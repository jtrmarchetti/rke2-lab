---
argument_specs:
  main:
    short_description: Initialise OpenBao and record its keys
    description:
      - Runs the one-time initialisation, records the unseal keys and root
        token in the controller's environment file before unsealing with them,
        and leaves an already-initialised vault alone.
      - The keys are recorded before the unseal deliberately, because a
        failure between the two leaves a sealed vault whose keys exist rather
        than an unsealed vault whose keys do not.
    options:
      openbao_init_enabled:
        type: bool
        default: true
        description: Whether the role does anything.
      openbao_init_namespace:
        type: str
        default: openbao
        description: Namespace the vault runs in.
      openbao_init_pod:
        type: str
        default: openbao-0
        description: Pod the vault runs in.
      openbao_init_key_shares:
        type: int
        default: 5
        description: Number of unseal key shares to produce.
      openbao_init_key_threshold:
        type: int
        default: 3
        description: How many shares are needed to unseal.
      openbao_init_env_file:
        type: str
        description:
          - File the break-glass copy of the keys is written to, at mode 0600.
      openbao_init_kubectl:
        type: str
        description: kubectl invocation, including the kubeconfig.
      openbao_init_pod_ready_retries:
        type: int
        default: 240
        description: >-
          How many times to poll the vault pod for Ready before failing.
          Each poll fast-fails while the pod does not exist yet (the Flux
          cascade is still installing), so the effective cold-build window is
          retries x delay. Sized 240 x 15s = 60 minutes after a measured
          cold build where the pod reached Ready ~27 minutes after the gate
          started and a whole install chain (longhorn 30m + openbao 15m)
          can still be running.
      openbao_init_pod_ready_delay:
        type: int
        default: 15
        description:
          - Seconds between Ready polls; see openbao_init_pod_ready_retries
            for the effective-window calculation.
      openbao_init_pod_ready_timeout:
        type: int
        default: 60
        description: >-
          Per-poll bound for the individual `kubectl wait` call, in seconds.
          While the pod exists this is how long one poll blocks for
          Ready; while it does not exist yet the call returns immediately.
          Kept small so one blocked poll cannot eat the whole retries x
          delay window.
      openbao_init_no_log:
        type: bool
        default: true
        description: Set false only when debugging; it prints unseal keys.
