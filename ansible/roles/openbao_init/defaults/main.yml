---

openbao_init_namespace: openbao
openbao_init_pod: openbao-0

openbao_init_key_shares: 5
openbao_init_key_threshold: 3

openbao_init_env_file: >-
  {{ ansible_facts['env']['HOME'] }}/.config/rke2lab/env.sh

openbao_init_kubectl: null

# How long to wait for the vault pod to report Ready before the role fails.
# On a cold build the OpenBao stack still has to be installed by the Flux
# cascade before the pod can start. The gate polls `kubectl wait` with
# retries x delay (the garage_init pattern) because `kubectl wait` returns
# immediately when the pod does not exist yet: a single wait would see a
# missing pod, fail at once, and never run its --timeout. History: on the
# nested-VM lab (slow shared-LVM I/O) the pod reached Ready ~27 minutes
# after the gate started on f_cold3, and a single 1800s wait fataled at
# 0.025s on g1_cold3 (2026-08-30) because the whole cascade was still
# installing, so the budget was 240 x 15s = 60 minutes with headroom for the
# slower-IO VMs. After the migration to the current real-disk hypervisor a
# measured cold build (2026-09-09) saw the cascade need ~27 minutes to the
# pod Ready, so the budget drops to 160 x 15s = 40 minutes: ~1.5x the
# observed chain, leaving headroom for a slower cascade. The gate passes on
# the first poll on warm or idempotent runs.
# Each poll bounds its own wait at
# `openbao_init_pod_ready_timeout` (60s) so one blocked call adds at most
# that to a poll; the absolute worst case is retries x (delay + timeout),
# ~3.5h, which only occurs when every poll stays blocked.
openbao_init_pod_ready_retries: 160
openbao_init_pod_ready_delay: 15
openbao_init_pod_ready_timeout: 60

openbao_init_no_log: true
