---

- name: main | Assert the required inputs are present
  ansible.builtin.assert:
    that:
      - (openbao_init_namespace | length) > 0
      - (openbao_init_pod | length) > 0
      - (openbao_init_env_file | length) > 0
      - (openbao_init_key_threshold | int) <= (openbao_init_key_shares | int)
    fail_msg: >-
      openbao_init needs a namespace, a pod, and a file to record the keys in,
      and the threshold cannot exceed the number of shares.
    quiet: true

- name: main | Wait for the vault pod to report Ready
  changed_when: false
  failed_when: false
  register: _reg_openbao_init_pod_ready
  until: _reg_openbao_init_pod_ready.rc == 0
  retries: "{{ openbao_init_pod_ready_retries }}"
  delay: "{{ openbao_init_pod_ready_delay }}"
  ansible.builtin.command:
    cmd: >-
      {{ openbao_init_kubectl }} wait -n {{ openbao_init_namespace }}
      pod/{{ openbao_init_pod }}
      --for=condition=Ready
      --timeout={{ openbao_init_pod_ready_timeout }}s

- name: main | Fail with an actionable message when the pod never became Ready
  ansible.builtin.fail:
    msg: >-
      {{ openbao_init_pod }} did not report Ready after
      {{ openbao_init_pod_ready_retries }} x
      {{ openbao_init_pod_ready_delay }}s polls. On a cold build the OpenBao
      stack
      is installed by the Flux cascade; check `kubectl -n
      {{ openbao_init_namespace }} get pods`, the HelmRelease conditions, and
      pod events before re-running.
  when: _reg_openbao_init_pod_ready.rc != 0

- name: main | Read the vault's current state
  changed_when: false

  failed_when: _reg_openbao_init_status['rc'] not in [0, 1, 2]
  register: _reg_openbao_init_status
  until: >-
    _reg_openbao_init_status['rc'] in [0, 1, 2]
    and ('"initialized"' in _reg_openbao_init_status['stdout'])
  retries: 4
  delay: 5
  ansible.builtin.command:
    cmd: >-
      {{ openbao_init_kubectl }} exec -n {{ openbao_init_namespace }}
      {{ openbao_init_pod }} -- bao status -format=json

- name: main | Parse the read result (an empty dict when the pod was unreachable)
  ansible.builtin.set_fact:
    _var_openbao_init_status: >-
      {{ _reg_openbao_init_status['stdout'] | default('{}', true) | from_json }}

- name: main | Fail with an actionable message when the vault could not be read
  ansible.builtin.fail:
    msg: >-
      {{ openbao_init_pod }} returned no `bao status` JSON on any attempt:
      the pod is probably not up yet. On a cold build the OpenBao stack is
      installed by the Flux cascade, which may still be settling. Re-run
      this playbook once the cluster workloads are Ready.
  when: (_var_openbao_init_status | length) == 0

- name: main | Report the vault's state
  ansible.builtin.debug:
    msg: >-
      {{ openbao_init_pod }}: initialised =
      {{ _var_openbao_init_status['initialized'] | default('unknown') }},
      sealed = {{ _var_openbao_init_status['sealed'] | default('unknown') }}
    verbosity: 0

- name: main | Initialise the vault
  when: not (_var_openbao_init_status['initialized'] | default(false) | bool)
  block:
    - name: main | Run the one-time initialisation
      changed_when: true
      no_log: "{{ openbao_init_no_log | bool }}"
      register: _reg_openbao_init_result
      ansible.builtin.command:
        cmd: >-
          {{ openbao_init_kubectl }} exec -n {{ openbao_init_namespace }}
          {{ openbao_init_pod }} -- bao operator init
          -key-shares={{ openbao_init_key_shares }}
          -key-threshold={{ openbao_init_key_threshold }}
          -format=json

    - name: main | Record the keys in the controller's secret environment
      no_log: "{{ openbao_init_no_log | bool }}"
      ansible.builtin.blockinfile:
        path: "{{ openbao_init_env_file }}"
        marker: "# {mark} ANSIBLE MANAGED BLOCK openbao"
        create: true
        mode: "0600"
        block: |
          export OPENBAO_UNSEAL_KEYS="{{ _var_openbao_init_keys | join(',') }}"
          export OPENBAO_ROOT_TOKEN="{{ _var_openbao_init_root }}"

    - name: main | Unseal the vault with the threshold of keys
      changed_when: true
      no_log: "{{ openbao_init_no_log | bool }}"
      loop: "{{ _var_openbao_init_keys[: openbao_init_key_threshold | int] }}"
      loop_control:
        loop_var: _item_openbao_init_unseal_key
        label: "share {{ loop_index }}"
        index_var: loop_index
      ansible.builtin.command:
        cmd: >-
          {{ openbao_init_kubectl }} exec -n {{ openbao_init_namespace }}
          {{ openbao_init_pod }} -- bao operator unseal {{ _item_openbao_init_unseal_key }}

- name: main | Confirm the vault is initialised and unsealed
  changed_when: false
  failed_when: _reg_openbao_init_final['rc'] not in [0, 2]
  register: _reg_openbao_init_final
  until: >-
    _reg_openbao_init_final['rc'] == 0
    and not ((_reg_openbao_init_final['stdout'] | default('{}', true) | from_json)
             ['sealed'] | default(false) | bool)
  retries: 20
  delay: 5
  ansible.builtin.command:
    cmd: >-
      {{ openbao_init_kubectl }} exec -n {{ openbao_init_namespace }}
      {{ openbao_init_pod }} -- bao status -format=json

- name: main | Assert the vault is open
  ansible.builtin.assert:
    that:
      - (_reg_openbao_init_final['stdout'] | default('{}', true) | from_json)
          ['initialized'] | default(false) | bool
      - not ((_reg_openbao_init_final['stdout'] | default('{}', true) | from_json)
          ['sealed'] | default(false) | bool)
    fail_msg: >-
      {{ openbao_init_pod }} is still sealed. If this run initialised it, the
      keys are in {{ openbao_init_env_file }} and can be applied by hand with
      `bao operator unseal`; if it did not, the vault was already initialised
      with keys this run never saw.
    quiet: true
