---

- name: main | Assert the required inputs are present
  ansible.builtin.assert:
    that:
      - (openbao_init_namespace | length) > 0
      - (openbao_init_pod | length) > 0
      - (openbao_init_env_file | length) > 0
      - (openbao_init_key_threshold | int) <= (openbao_init_key_shares | int)
    fail_msg: >-
      openbao_init needs a namespace, a pod, and a file to record the keys in,
      and the threshold cannot exceed the number of shares.
    quiet: true

- name: main | Read the vault's current state
  changed_when: false

  failed_when: _reg_openbao_init_status['rc'] not in [0, 1, 2]
  register: _reg_openbao_init_status
  until: >-
    _reg_openbao_init_status['rc'] in [0, 1, 2]
    and ('"initialized"' in _reg_openbao_init_status['stdout'])
  retries: 80
  delay: 15
  ansible.builtin.command:
    cmd: >-
      {{ openbao_init_kubectl }} exec -n {{ openbao_init_namespace }}
      {{ openbao_init_pod }} -- bao status -format=json

- name: main | Report the vault's state
  ansible.builtin.debug:
    msg: >-
      {{ openbao_init_pod }}: initialised =
      {{ (_reg_openbao_init_status['stdout'] | from_json)['initialized'] }},
      sealed = {{ (_reg_openbao_init_status['stdout'] | from_json)['sealed'] }}
    verbosity: 0

- name: main | Initialise the vault
  when: not ((_reg_openbao_init_status['stdout'] | from_json)['initialized'] | bool)
  block:
    - name: main | Run the one-time initialisation
      changed_when: true
      no_log: "{{ openbao_init_no_log | bool }}"
      register: _reg_openbao_init_result
      ansible.builtin.command:
        cmd: >-
          {{ openbao_init_kubectl }} exec -n {{ openbao_init_namespace }}
          {{ openbao_init_pod }} -- bao operator init
          -key-shares={{ openbao_init_key_shares }}
          -key-threshold={{ openbao_init_key_threshold }}
          -format=json

    - name: main | Record the keys in the controller's secret environment
      no_log: "{{ openbao_init_no_log | bool }}"
      ansible.builtin.blockinfile:
        path: "{{ openbao_init_env_file }}"
        marker: "# {mark} ANSIBLE MANAGED BLOCK openbao"
        create: true
        mode: "0600"
        block: |
          export OPENBAO_UNSEAL_KEYS="{{ _var_openbao_init_keys | join(',') }}"
          export OPENBAO_ROOT_TOKEN="{{ _var_openbao_init_root }}"

    - name: main | Unseal the vault with the threshold of keys
      changed_when: true
      no_log: "{{ openbao_init_no_log | bool }}"
      loop: "{{ _var_openbao_init_keys[: openbao_init_key_threshold | int] }}"
      loop_control:
        loop_var: _item_openbao_init_unseal_key
        label: "share {{ loop_index }}"
        index_var: loop_index
      ansible.builtin.command:
        cmd: >-
          {{ openbao_init_kubectl }} exec -n {{ openbao_init_namespace }}
          {{ openbao_init_pod }} -- bao operator unseal {{ _item_openbao_init_unseal_key }}

- name: main | Confirm the vault is initialised and unsealed
  changed_when: false
  failed_when: _reg_openbao_init_final['rc'] not in [0, 2]
  register: _reg_openbao_init_final
  until: >-
    _reg_openbao_init_final['rc'] == 0
    and not ((_reg_openbao_init_final['stdout'] | from_json)['sealed'] | bool)
  retries: 10
  delay: 6
  ansible.builtin.command:
    cmd: >-
      {{ openbao_init_kubectl }} exec -n {{ openbao_init_namespace }}
      {{ openbao_init_pod }} -- bao status -format=json

- name: main | Assert the vault is open
  ansible.builtin.assert:
    that:
      - (_reg_openbao_init_final['stdout'] | from_json)['initialized'] | bool
      - not ((_reg_openbao_init_final['stdout'] | from_json)['sealed'] | bool)
    fail_msg: >-
      {{ openbao_init_pod }} is still sealed. If this run initialised it, the
      keys are in {{ openbao_init_env_file }} and can be applied by hand with
      `bao operator unseal`; if it did not, the vault was already initialised
      with keys this run never saw.
    quiet: true
