---

- name: service | Gather the current service state
  ansible.builtin.service_facts:

- name: service | Record whether a restart is meaningful
  ansible.builtin.set_fact:
    _rke2_service_running: >-
      {{ ansible_facts['services']['rke2-agent.service']['state']
         | default('') == 'running' }}

- name: service | Apply any pending restart before checking readiness
  ansible.builtin.meta: flush_handlers

- name: service | Enable and start the RKE2 agent
  ansible.builtin.systemd_service:
    name: rke2-agent
    state: started
    enabled: true
    daemon_reload: true

- name: service | Read the name this node will register under
  changed_when: false
  register: _reg_rke2_agent_node_name
  ansible.builtin.command:
    cmd: hostname --fqdn

- name: service | Wait for this node to report Ready
  changed_when: false
  failed_when: _reg_rke2_agent_node_ready['rc'] != 0
  delegate_to: "{{ rke2_agent_control_host }}"
  register: _reg_rke2_agent_node_ready
  ansible.builtin.command:
    cmd: >-
      {{ rke2_agent_control_data_dir }}/bin/kubectl
      --kubeconfig {{ rke2_agent_control_kubeconfig }}
      wait --for=condition=Ready
      node/{{ _reg_rke2_agent_node_name['stdout'] | trim }}
      --timeout={{ rke2_agent_ready_retries | int
                   * rke2_agent_ready_delay | int }}s

- name: service | Assert the node joined and became Ready
  ansible.builtin.assert:
    that:
      - _reg_rke2_agent_node_ready['rc'] == 0
    fail_msg: >-
      {{ inventory_hostname }} did not reach Ready. A node that never appears in
      `kubectl get nodes` did not reach the supervisor at all — that is the VIP,
      the token, or the CA, and the answer is in `journalctl -u rke2-agent`. A
      node that appears and stays NotReady did reach it, and the answer is
      whether Cilium could pull through the mirror.
    quiet: true
