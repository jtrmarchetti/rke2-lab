---
galaxy_info:
  role_name: kube_cli_controller
  author: rke2lab
  description: >-
    Sets up the automation controller to operate the cluster: kubectl taken
    from the cluster's own node so the versions cannot drift, k9s pinned to a
    release, and a shell environment that sets KUBECONFIG so a bare kubectl
    command works.
  license: MIT
  min_ansible_version: "2.15"
  platforms:
    - name: Ubuntu
      versions:
        - noble
  galaxy_tags:
    - kubernetes
    - kubectl
    - k9s

dependencies: []
