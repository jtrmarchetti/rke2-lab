---
# One mode per directory, not one mode for both. The configuration directory
# is shared with controller_runtime and holds env.sh, the Flux deploy token and
# the cluster CA, so it is 0700 — and this task used to reset it to 0755 on
# every run, which both fought controller_runtime for the mode (neither role
# could ever report a clean second run) and left the lab's secret directory
# listable by anyone on the host.
- name: main | Ensure the operator directories exist
  when: (kube_cli_controller_enabled | bool)
  loop:
    - path: "{{ kube_cli_controller_bin_dir }}"
      mode: "0755"
    - path: "{{ kube_cli_controller_config_dir }}"
      mode: "0700"
  loop_control:
    loop_var: _item_kube_cli_controller_dir
    label: "{{ _item_kube_cli_controller_dir['path'] }}"
  ansible.builtin.file:
    path: "{{ _item_kube_cli_controller_dir['path'] }}"
    state: directory
    mode: "{{ _item_kube_cli_controller_dir['mode'] }}"

# Every downloaded binary here is pinned by the two values that travel
# together — version and URL — and neither has a value that is correct in any
# environment, so both come from the caller. Checked up front because the
# alternative failure is get_url reporting an unparseable URL two task files
# later, which reads as a network problem rather than a missing input.
- name: main | Assert every downloaded binary is fully pinned
  when: (kube_cli_controller_enabled | bool)
  loop:
    - enabled: "{{ kube_cli_controller_k9s_enabled }}"
      name: k9s
      url: "{{ kube_cli_controller_k9s_url }}"
      version: "{{ kube_cli_controller_k9s_version }}"
    - enabled: "{{ kube_cli_controller_flux_enabled }}"
      name: flux
      url: "{{ kube_cli_controller_flux_url }}"
      version: "{{ kube_cli_controller_flux_version }}"
    - enabled: "{{ kube_cli_controller_kubeseal_enabled }}"
      name: kubeseal
      url: "{{ kube_cli_controller_kubeseal_url }}"
      version: "{{ kube_cli_controller_kubeseal_version }}"
  loop_control:
    loop_var: _item_kube_cli_controller_pin
    label: "{{ _item_kube_cli_controller_pin['name'] }}"
  ansible.builtin.assert:
    that:
      - not (_item_kube_cli_controller_pin['enabled'] | bool)
        or ((_item_kube_cli_controller_pin['version']
             | default('', true) | string | trim | length) > 0
            and (_item_kube_cli_controller_pin['url']
                 | default('', true) | string | trim | length) > 0)
    fail_msg: >-
      {{ _item_kube_cli_controller_pin['name'] }} is enabled but not fully
      pinned. Its version and URL come from
      inventory/group_vars/controller/artifacts.yml, passed in by
      playbooks/controller.yml.
    quiet: true

- name: main | Install kubectl from the cluster's own binary
  when:
    - (kube_cli_controller_enabled | bool)
    - (kube_cli_controller_kubectl_enabled | bool)
  ansible.builtin.include_tasks: kubectl.yml

- name: main | Install k9s
  when:
    - (kube_cli_controller_enabled | bool)
    - (kube_cli_controller_k9s_enabled | bool)
  ansible.builtin.include_tasks: k9s.yml

- name: main | Configure the operator shell
  when:
    - (kube_cli_controller_enabled | bool)
    - (kube_cli_controller_shell_enabled | bool)
  ansible.builtin.include_tasks: shell.yml

- name: main | Install the Flux CLI
  when:
    - (kube_cli_controller_enabled | bool)
    - (kube_cli_controller_flux_enabled | bool)
  ansible.builtin.include_tasks: flux.yml

- name: main | Install kubeseal
  when:
    - (kube_cli_controller_enabled | bool)
    - (kube_cli_controller_kubeseal_enabled | bool)
  ansible.builtin.include_tasks: kubeseal.yml
