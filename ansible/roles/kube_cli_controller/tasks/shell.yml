---
# Two files, deliberately. Everything this role decides goes into a file it
# owns; the user's own dotfile gets one marked line that sources it. That way
# updating the environment is a template change, and removing it is deleting a
# block — neither requires editing around whatever else the user keeps in there.

- name: shell | Write the cluster environment
  ansible.builtin.template:
    src: "{{ _var_kube_cli_controller_files_dir }}/kube-env.sh.j2"
    dest: "{{ kube_cli_controller_config_dir }}/kube-env.sh"
    mode: "0644"

# Into every startup file, because no single one of them is read by every kind
# of shell. See the note on kube_cli_controller_shell_rc_files: ~/.bashrc is
# abandoned at the top for non-interactive shells, and ~/.profile is not read by
# an interactive non-login one. The snippet is safe to source twice.
- name: shell | Source it from the shell startup files
  loop: "{{ kube_cli_controller_shell_rc_files }}"
  loop_control:
    loop_var: _item_kube_cli_controller_rc
    label: "{{ _item_kube_cli_controller_rc }}"
  ansible.builtin.blockinfile:
    path: "{{ _item_kube_cli_controller_rc }}"
    marker: "# {mark} ANSIBLE MANAGED BLOCK - rke2lab cluster access"
    create: true
    mode: "0644"
    block: |
      # Cluster access for the dev.lo RKE2 lab. Generated by the
      # kube_cli_controller role; see plan/PHASE5_IMPLEMENTATION.md.
      if [ -r "{{ kube_cli_controller_config_dir }}/kube-env.sh" ]; then
          . "{{ kube_cli_controller_config_dir }}/kube-env.sh"
      fi

# Proves the whole path rather than the file having been written: the tunnel,
# the VIP, the certificate, and the credentials in the kubeconfig. Uses the
# binary and the kubeconfig this role just placed, so it fails here rather than
# the first time the operator tries to use them.
- name: shell | Prove kubectl reaches the cluster with this configuration
  changed_when: false
  failed_when: false
  register: _reg_kube_cli_controller_check
  ansible.builtin.command:
    cmd: >-
      {{ kube_cli_controller_bin_dir }}/kubectl
      --kubeconfig {{ kube_cli_controller_kubeconfig }}
      get nodes -o name

- name: shell | Report what the cluster answered
  ansible.builtin.assert:
    that:
      - _reg_kube_cli_controller_check['rc'] == 0
    fail_msg: >-
      kubectl could not reach the cluster with
      {{ kube_cli_controller_kubeconfig }}:
      {{ _reg_kube_cli_controller_check['stderr'] | default('') }}
      The kubeconfig is written by the rke2_server role during
      playbooks/kubecp.yml, so run that first if the file is missing. If it is
      present, check the tunnel is up and that kube.dev.lo still resolves to the
      virtual address.
    success_msg: >-
      kubectl reaches the cluster:
      {{ _reg_kube_cli_controller_check['stdout_lines'] | default([]) | length }}
      nodes.
    quiet: false
