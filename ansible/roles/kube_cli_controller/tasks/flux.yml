---

- name: flux | Read the version already installed here
  changed_when: false
  failed_when: false
  check_mode: false
  register: _reg_kube_cli_controller_flux
  ansible.builtin.command:
    cmd: "{{ kube_cli_controller_bin_dir }}/flux --version"

- name: flux | Download and unpack the release
  when: >-
    _reg_kube_cli_controller_flux['rc'] != 0
    or kube_cli_controller_flux_version
       not in _reg_kube_cli_controller_flux['stdout']
  block:
    - name: flux | Create a scratch directory for the download
      register: _reg_kube_cli_controller_flux_tmp
      ansible.builtin.tempfile:
        state: directory
        suffix: flux

    - name: flux | Download the release tarball from the artifact host
      ansible.builtin.get_url:
        url: "{{ kube_cli_controller_flux_url | trim }}"
        dest: "{{ _reg_kube_cli_controller_flux_tmp['path'] }}/flux.tar.gz"
        mode: "0644"

    - name: flux | Unpack just the binary
      ansible.builtin.unarchive:
        src: "{{ _reg_kube_cli_controller_flux_tmp['path'] }}/flux.tar.gz"
        dest: "{{ kube_cli_controller_bin_dir }}"
        remote_src: true
        include:
          - flux
        mode: "0755"
  always:
    - name: flux | Remove the scratch directory
      when: >-
        (_reg_kube_cli_controller_flux_tmp['path'] | default('') | length) > 0
      ansible.builtin.file:
        path: "{{ _reg_kube_cli_controller_flux_tmp['path'] | default('') }}"
        state: absent
