---
# No internal constants. Every value this role uses is a public input in
# defaults/main.yml. The file exists because plan/ANSIBLE_STANDARDS.md requires
# the role layout to be complete.

# Templates for this role live in ansible/files/kube_cli_controller/ rather than
# inside the role, so the tree that renders a host's configuration can
# be read without opening the role.
_var_kube_cli_controller_files_dir: "{{ role_path | dirname | dirname }}/files/kube_cli_controller"
