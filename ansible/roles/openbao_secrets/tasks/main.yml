---

- name: main | Assert the required inputs are present
  when: (openbao_secrets_enabled | bool)
  ansible.builtin.assert:
    that:
      - (openbao_secrets_root_token | length) > 0
      - (openbao_secrets_url | length) > 0
      - (openbao_secrets_kv_path | length) > 0
      - (openbao_secrets_keycloak_admin_password | length) > 0
      - (openbao_secrets_keycloak_db_password | length) > 0
      - (openbao_secrets_grafana_admin_password | length) > 0
      - (openbao_secrets_garage_admin_token | length) > 0
      - (openbao_secrets_garage_metrics_token | length) > 0
      - (openbao_secrets_garage_rpc_secret | length) > 0
      - (openbao_secrets_grafana_oidc_client_secret | length) > 0
      - (openbao_secrets_longhorn_oidc_client_secret | length) > 0

      - (openbao_secrets_longhorn_cookie_secret | length) in [16, 24, 32]
    fail_msg: >-
      openbao_secrets needs the root token and every runtime secret it writes
      into the vault. They come from ~/.config/rke2lab/env.sh — the token is
      written there by openbao_init, the rest by hand — so run
      `source ~/.config/rke2lab/env.sh` first. See plan/SECRETS.md.
    quiet: true

- name: main | Write every runtime secret into the vault
  when:
    - (openbao_secrets_enabled | bool)

    - not ansible_check_mode
  block:
    - name: main | Read the value the vault already holds
      no_log: "{{ openbao_secrets_no_log | bool }}"
      register: _reg_openbao_secrets_current
      loop: "{{ _var_openbao_secrets_entries }}"
      loop_control:
        loop_var: _item_openbao_secrets_entry
        label: "{{ _item_openbao_secrets_entry['path'] }}"
      ansible.builtin.uri:
        url: >-
          {{ openbao_secrets_url }}/v1/{{ openbao_secrets_kv_path }}/data/{{
          _item_openbao_secrets_entry['path'] }}
        headers: "{{ _var_openbao_secrets_headers }}"
        ca_path: "{{ openbao_secrets_ca_file }}"

        status_code: [200, 404]

    - name: main | Decide which entries already hold the intended value
      no_log: "{{ openbao_secrets_no_log | bool }}"
      loop: >-
        {{ _var_openbao_secrets_entries
           | zip(_reg_openbao_secrets_current['results']) | list }}
      loop_control:
        loop_var: _item_openbao_secrets_read
        label: "{{ _item_openbao_secrets_read[0]['path'] }}"
      vars:
        _openbao_secrets_was: >-
          {{ _item_openbao_secrets_read[1]['json']['data']['data'] | default({}, true) }}
      ansible.builtin.set_fact:
        _openbao_secrets_reuse: >-
          {{ (_openbao_secrets_reuse | default([]))
             + [_item_openbao_secrets_read[1]['status'] == 200
                and _openbao_secrets_was == _item_openbao_secrets_read[0]['data']] }}

    - name: main | Report what will be written
      ansible.builtin.debug:
        msg: >-
          {{ _var_openbao_secrets_entries | length }} vault entries:
          {{ _openbao_secrets_reuse | select | list | length }} unchanged,
          {{ _openbao_secrets_reuse | reject | list | length }} written
        verbosity: 0

    - name: main | Write the entries that changed
      when: not (_openbao_secrets_reuse[loop_index] | bool)
      changed_when: true
      no_log: "{{ openbao_secrets_no_log | bool }}"
      loop: "{{ _var_openbao_secrets_entries }}"
      loop_control:
        loop_var: _item_openbao_secrets_entry
        label: "{{ _item_openbao_secrets_entry['path'] }}"
        index_var: loop_index
      ansible.builtin.uri:
        url: >-
          {{ openbao_secrets_url }}/v1/{{ openbao_secrets_kv_path }}/data/{{
          _item_openbao_secrets_entry['path'] }}
        method: POST
        headers: "{{ _var_openbao_secrets_headers }}"
        ca_path: "{{ openbao_secrets_ca_file }}"
        body_format: json
        body:
          data: "{{ _item_openbao_secrets_entry['data'] }}"
        status_code: [200, 204]

    - name: main | Confirm every entry reads back
      no_log: "{{ openbao_secrets_no_log | bool }}"
      register: _reg_openbao_secrets_final
      loop: "{{ _var_openbao_secrets_entries }}"
      loop_control:
        loop_var: _item_openbao_secrets_entry
        label: "{{ _item_openbao_secrets_entry['path'] }}"
      ansible.builtin.uri:
        url: >-
          {{ openbao_secrets_url }}/v1/{{ openbao_secrets_kv_path }}/data/{{
          _item_openbao_secrets_entry['path'] }}
        headers: "{{ _var_openbao_secrets_headers }}"
        ca_path: "{{ openbao_secrets_ca_file }}"

    - name: main | Assert every entry holds every key it was given
      no_log: "{{ openbao_secrets_no_log | bool }}"
      loop: >-
        {{ _var_openbao_secrets_entries
           | zip(_reg_openbao_secrets_final['results']) | list }}
      loop_control:
        loop_var: _item_openbao_secrets_read
        label: "{{ _item_openbao_secrets_read[0]['path'] }}"
      ansible.builtin.assert:
        that:
          - >-
            _item_openbao_secrets_read[0]['data'].keys() | sort
            == _item_openbao_secrets_read[1]['json']['data']['data'].keys() | sort
        fail_msg: >-
          The vault entry {{ _item_openbao_secrets_read[0]['path'] }} does not hold the keys this
          role wrote. An ExternalSecret naming a missing property syncs
          nothing and reports a Secret that never becomes ready.
        quiet: true
