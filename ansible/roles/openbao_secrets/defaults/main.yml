---
openbao_secrets_enabled: true

# The vault's own API, through the ingress the cluster issued a certificate
# for. Same address, and the same reasoning, as openbao_config: this exercises
# the DNS delegation, the ingress and the certificate rather than bypassing all
# three by exec'ing into the pod.
openbao_secrets_url: null
# The domain CA, so the certificate the cluster's own intermediate issued is
# verified rather than trusted blindly.
openbao_secrets_ca_file: /etc/ssl/certs/ca-certificates.crt

# Secret sourced from ~/.config/rke2lab/env.sh, written there by openbao_init.
# openbao_secrets_root_token:

# Where runtime secrets live. Must equal openbao_config_kv_path — that role
# mounts the engine and writes the policy ESO reads it through, and this one
# fills it.
openbao_secrets_kv_path: kv

# --- What is written -------------------------------------------------------
#
# Plaintext, from the controller's env.sh. These are the values that used to be
# sealed into the cluster-state repository; they are now written here once and
# read by an ExternalSecret in the cluster.
#
# No defaults. A secret that quietly defaults to the empty string produces a
# perfectly valid vault entry containing nothing, which fails much later as an
# authentication error in a component that looks broken.
# openbao_secrets_keycloak_admin_password:
# openbao_secrets_keycloak_db_password:
# openbao_secrets_grafana_admin_password:
# openbao_secrets_garage_admin_token:
# openbao_secrets_garage_metrics_token:
# openbao_secrets_garage_rpc_secret:

openbao_secrets_grafana_admin_user: admin

# --- Single sign-on --------------------------------------------------------
#
# The OIDC client secrets the two federated *workloads* read. Authored in
# env.sh rather than generated by Keycloak, which is what keeps this role able
# to run before Keycloak exists — see keycloak_clients/tasks/main.yml for the
# whole argument, and note that it is why neither of these is optional the way
# Garage's S3 key is.
#
# Only two, and not four. OpenBao and GitLab federate as well, but neither
# reads its client secret through External Secrets: OpenBao stores it inside
# its own auth configuration and GitLab in gitlab.rb on repo01. The vault holds
# what a running workload reads, which is the test plan/SECRETS.md sets.
# openbao_secrets_grafana_oidc_client_secret:
# openbao_secrets_longhorn_oidc_client_secret:

# oauth2-proxy's cookie secret, which is not an OIDC credential at all: it is
# the key the proxy encrypts its own session cookie with. Changing it signs
# everyone out and nothing else. It must be 16, 24 or 32 bytes — oauth2-proxy
# refuses to start on any other length, with an error about AES key size that
# does not mention cookies.
# openbao_secrets_longhorn_cookie_secret:

# The two secrets with a default, and the default is "absent".
#
# Garage mints its own S3 access key, and it only exists after Garage is
# running — which is after this role has written the credentials Garage needs
# in order to start. So the first pass of a cold rebuild writes everything
# except these, garage_init creates the key, and the second pass writes them.
# The entry is omitted while they are empty rather than written as blanks over
# a value the vault may already hold.
openbao_secrets_garage_s3_access_key: ""
openbao_secrets_garage_s3_secret_key: ""

# Set false only when debugging; it exposes every secret above and the root
# token.
openbao_secrets_no_log: true
