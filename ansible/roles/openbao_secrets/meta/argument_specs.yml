---
argument_specs:
  main:
    short_description: Write the cluster's runtime secrets into OpenBao
    description:
      - Writes one KV version 2 entry per component, at the paths the
        ExternalSecrets in the cluster-state repository read from.
      - Reads each entry first and writes only what differs, so a run that
        changes nothing creates no new secret version.
      - Garage's S3 key is optional, because it is minted by Garage after this
        role has written the credentials Garage needs in order to start.
    options:
      openbao_secrets_enabled:
        type: bool
        default: true
        description: Whether the role does anything.
      openbao_secrets_url:
        type: str
        description: The vault's API, through its ingress.
      openbao_secrets_ca_file:
        type: str
        description: CA bundle the vault's certificate is verified against.
      openbao_secrets_root_token:
        type: str
        required: true
        description:
          - Root token, written to the controller environment by openbao_init.
      openbao_secrets_kv_path:
        type: str
        default: kv
        description:
          - Mount path of the KV version 2 engine. Must equal
            openbao_config_kv_path.
      openbao_secrets_keycloak_admin_password:
        type: str
        required: true
        description: Keycloak's bootstrap administrator password.
      openbao_secrets_keycloak_db_password:
        type: str
        required: true
        description: Password Keycloak connects to its database with.
      openbao_secrets_grafana_admin_user:
        type: str
        default: admin
        description: Grafana's local administrator name.
      openbao_secrets_grafana_admin_password:
        type: str
        required: true
        description: Grafana's local administrator password.
      openbao_secrets_garage_admin_token:
        type: str
        required: true
        description: Bearer token for Garage's admin API.
      openbao_secrets_garage_metrics_token:
        type: str
        required: true
        description: Bearer token for Garage's metrics endpoint.
      openbao_secrets_garage_rpc_secret:
        type: str
        required: true
        description: Shared secret Garage nodes authenticate to each other with.
      openbao_secrets_grafana_oidc_client_secret:
        type: str
        required: true
        description:
          - Grafana's OIDC client secret, authored in env.sh rather than
            generated by Keycloak. Not optional, because writing it on the
            first pass is what lets Grafana start before Keycloak exists.
      openbao_secrets_longhorn_oidc_client_secret:
        type: str
        required: true
        description:
          - OIDC client secret for the oauth2-proxy in front of the Longhorn
            UI, which has no authentication of its own.
      openbao_secrets_longhorn_cookie_secret:
        type: str
        required: true
        description:
          - Key oauth2-proxy encrypts its session cookie with. Must be 16, 24
            or 32 bytes; any other length is refused at start-up with an AES
            key size error that never mentions cookies.
      openbao_secrets_garage_s3_access_key:
        type: str
        default: ""
        description:
          - S3 access key identifier Garage minted, from garage_init. Empty on
            a cold rebuild's first pass, when Garage does not yet exist; the
            entry is omitted rather than written blank.
      openbao_secrets_garage_s3_secret_key:
        type: str
        default: ""
        description: Secret half of the key above, subject to the same rule.
      openbao_secrets_no_log:
        type: bool
        default: true
        description:
          - Set false only when debugging; it exposes every secret written and
            the root token.
