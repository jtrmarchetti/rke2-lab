---
argument_specs:
  main:
    short_description: Containerized FreeIPA server for an isolated network.
    description:
      - Deploys FreeIPA as a container on a host with no internet access.
      - The image is delivered as a tarball from the repo01 artifact host.
      - DNS is installed without forwarders; the domain is authoritative for
        itself and resolves nothing else.
    options:
      freeipa_server_enabled:
        type: bool
        required: false
      freeipa_server_domain:
        type: str
        required: false
      freeipa_server_hostname:
        type: str
        required: false
      freeipa_server_ip_address:
        type: str
        required: false
      freeipa_server_admin_password:
        description: IPA admin password, sourced from the environment.
        type: str
        required: false
      freeipa_server_directory_manager_password:
        description: Directory manager password. Sourced from the environment.
        type: str
        required: false
      freeipa_server_ready_retries:
        description: Polling attempts for each readiness check.
        type: int
        required: false
      freeipa_server_ready_delay:
        description: Seconds between readiness polling attempts.
        type: int
        required: false
      freeipa_server_ready_timeout:
        description: Seconds to wait for each service port to open.
        type: int
        required: false
      freeipa_server_dns_zones:
        description: DNS zones to ensure exist. Each entry needs a name.
        type: list
        elements: dict
        required: false
      freeipa_server_dns_records:
        description: >-
          Service records to publish in the domain. Each entry needs name and
          value; type defaults to A and zone to freeipa_server_domain.
        type: list
        elements: dict
        required: false
      freeipa_server_no_log:
        description: >-
          Set false only when debugging record tasks; it exposes the admin
          password in output.
        type: bool
        required: false
      freeipa_server_settle_retries:
        description: >-
          How many times to poll the container for a stably-running state before
          giving up; a crash-looper burns the whole budget and the restart-count
          assert then fails the run.
        type: int
        required: false
      freeipa_server_settle_delay:
        description: Seconds between container-settle polls.
        type: int
        required: false
      freeipa_server_resolv_template:
        description: >-
          Path to the /etc/resolv.conf template, under the repo files tree.
        type: str
        required: false
      freeipa_server_env_template:
        description: >-
          Path to the FreeIPA environment file template, under the repo files tree.
        type: str
        required: false
      freeipa_server_compose_template:
        description: >-
          Path to the FreeIPA docker-compose template, under the repo files tree.
        type: str
        required: false
      freeipa_server_named_options_template:
        description: >-
          Path to the named options-ext conf template, under the repo files tree.
        type: str
        required: false
      freeipa_server_manage_resolver:
        description: >-
          Stop and mask systemd-resolved and point /etc/resolv.conf at
          127.0.0.1, so FreeIPA's named can own port 53 and the host resolves
          through its own domain.
        type: bool
        required: false
      freeipa_server_container_name:
        type: str
        required: false
      freeipa_server_container_image:
        type: str
        required: false
      freeipa_server_compose_dir:
        type: str
        required: false
      freeipa_server_data_dir:
        type: str
        required: false
      freeipa_server_image_tarball_url:
        description: >-
          Apache artifact host URL for the saved image tarball. The pin and
          the TLS transport are the integrity control; the download is not
          verified against a recorded checksum.
        type: str
        required: false
      freeipa_server_image_tarball_path:
        type: str
        required: false
      freeipa_server_runtime_packages:
        type: list
        elements: str
        required: false
      freeipa_server_install_timeout:
        description: Seconds allowed for the first-run domain bootstrap.
        type: int
        required: false
      freeipa_server_apt_retries:
        type: int
        required: false
        default: 3
        description: >-
          Task-level attempts for a failing package install before the task is fatal.
      freeipa_server_apt_delay:
        type: int
        required: false
        default: 15
        description: Seconds between package install attempts.
      freeipa_server_dns_forward_zones:
        type: list
        elements: dict
        required: false
        description:
          - Zones this server delegates rather than holds. Each entry names the
            zone, the forwarder to send it to, and optionally the policy.
        options:
          name:
            type: str
            required: true
            description: Zone to delegate.
          forwarder:
            type: str
            required: true
            description: Address of the authoritative server for that zone.
          policy:
            type: str
            required: false
            default: only
            description: >-
              "only" makes the delegation total. "first" falls back to this
              server's own resolution, which for a zone it does not hold means
              an upstream lookup for an internal name.
      freeipa_server_named_options_path:
        type: str
        description: Path of the BIND options file IPA leaves alone.
      freeipa_server_named_config_group:
        type: str
        default: floppy
        description: Group IPA gives its named configuration files.
