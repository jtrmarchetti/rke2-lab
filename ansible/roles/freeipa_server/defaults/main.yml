---
freeipa_server_enabled: false

freeipa_server_domain: null
freeipa_server_realm: DEV.LO
freeipa_server_hostname: null
freeipa_server_ip_address: null
freeipa_server_admin_password: ""
freeipa_server_directory_manager_password: ""

freeipa_server_setup_dns: true
freeipa_server_forwarders_enabled: false
freeipa_server_forwarders: []
freeipa_server_allow_zone_overlap: true
freeipa_server_setup_reverse_zone: true

freeipa_server_no_host_dns: true

freeipa_server_manage_resolver: true

freeipa_server_ntp: false
freeipa_server_ntp_servers: []

freeipa_server_container_name: freeipa-server
# Held at almalinux-8 (FreeIPA 4.9) - see repo memory
# freeipa-almalinux10-upgrade-failure.md for why the 3.x tag cannot take over
# the running domain in place.
freeipa_server_container_image: "freeipa/freeipa-server:almalinux-8"
freeipa_server_compose_dir: /opt/rke2lab/freeipa
freeipa_server_data_dir: /data1/freeipa

freeipa_server_image_tarball_url: null
freeipa_server_image_tarball_path: /var/tmp/freeipa-server-almalinux-8.tar

freeipa_server_runtime_packages:
  - docker.io
  - docker-compose-v2

  - python3-requests

freeipa_server_apt_retries: 3
freeipa_server_apt_delay: 15

freeipa_server_dns_zones: []

freeipa_server_dns_records: []

freeipa_server_named_options_path: >-
  /data1/freeipa/etc/named/ipa-options-ext.conf

freeipa_server_named_config_group: floppy

freeipa_server_dns_forward_zones: []

freeipa_server_no_log: true

freeipa_server_install_timeout: 1800

freeipa_server_ready_retries: 60
freeipa_server_ready_delay: 10
freeipa_server_ready_timeout: 300

freeipa_server_settle_retries: 21
freeipa_server_settle_delay: 10

freeipa_server_resolv_template: null
freeipa_server_env_template: null
freeipa_server_compose_template: null
freeipa_server_named_options_template: null
