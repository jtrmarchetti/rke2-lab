---

- name: dns_forwarders | Ensure each forward zone exists and points at its server

  changed_when: >-
    (_reg_freeipa_server_forward['stdout_lines'] | default(['']) | last | trim)
    == 'changed'
  no_log: "{{ freeipa_server_no_log | default(true) }}"
  register: _reg_freeipa_server_forward
  loop: "{{ freeipa_server_dns_forward_zones }}"
  loop_control:
    loop_var: _item_freeipa_server_forward
    label: "{{ _item_freeipa_server_forward['name'] }} -> {{ _item_freeipa_server_forward['forwarder'] }}"
  ansible.builtin.shell:
    cmd: |
      docker exec -i {{ freeipa_server_container_name }} bash -c '
        set -e
        echo "{{ freeipa_server_admin_password | b64encode }}" |
          base64 -d | kinit admin >/dev/null
        want="{{ _item_freeipa_server_forward["forwarder"] }}"
        if ipa dnsforwardzone-show {{ _item_freeipa_server_forward["name"] }} >/dev/null 2>&1; then
          have=$(ipa dnsforwardzone-show {{ _item_freeipa_server_forward["name"] }} \
            --raw 2>/dev/null | awk "/idnsforwarders:/ {print \$2}")
          if [ "${have}" = "${want}" ]; then
            echo "unchanged"
            exit 0
          fi
          ipa dnsforwardzone-mod {{ _item_freeipa_server_forward["name"] }} \
            --forwarder="${want}" \
            --forward-policy={{ _item_freeipa_server_forward["policy"] | default("only") }} >/dev/null
        else
          ipa dnsforwardzone-add {{ _item_freeipa_server_forward["name"] }} \
            --forwarder="${want}" \
            --forward-policy={{ _item_freeipa_server_forward["policy"] | default("only") }} >/dev/null
        fi
        echo "changed"'
