---
argument_specs:
  main:
    short_description: Configure, start, and gate an RKE2 server
    description:
      - Renders /etc/rancher/rke2/config.yaml, including the fixed registration
        address on every server except the one that starts the cluster.
      - Deploys kube-vip into the auto-deploy manifest directory on the
        bootstrap server, so the API virtual address exists before any other
        server needs it to join.
      - Waits on transactions rather than on service status - the API answering
        /readyz, the node reaching Ready, and the virtual address accepting a
        connection.
    options:
      rke2_server_enabled:
        type: bool
        default: true
        description: Whether the role does anything.
      rke2_server_bootstrap:
        type: bool
        default: false
        description:
          - True on exactly one host. That host omits the server address, which
            is what makes it the initial etcd member.
      rke2_server_api_address:
        type: str
        description: The API virtual address held by kube-vip.
      rke2_server_api_name:
        type: str
        description: The name resolving to the virtual address.
      rke2_server_supervisor_port:
        type: int
        default: 9345
        description: Port new nodes register against.
      rke2_server_api_port:
        type: int
        default: 6443
        description: Port the Kubernetes API is served on.
      rke2_server_token:
        type: str
        required: true
        description:
          - Shared cluster join secret, from RKE2_TOKEN in the environment.
      rke2_server_node_ip:
        type: str
        required: true
        description: This node's address on the internal network.
      rke2_server_tls_san:
        type: list
        elements: str
        required: true
        description:
          - Every name and address the API certificate must cover, so adding a
            path later is not a certificate reissue and a rolling restart.
      rke2_server_cni:
        type: str
        default: cilium
        description: The packaged CNI RKE2 deploys.
      rke2_server_disable:
        type: list
        elements: str
        description: Packaged components to leave undeployed.
      rke2_server_ingress_controller:
        type: list
        elements: str
        description:
          - Ingress controllers RKE2 deploys. One of none, ingress-nginx or
            traefik; the first value becomes the default ingress class.
      rke2_server_ingress_node_selector:
        type: str
        default: node-role.kubernetes.io/worker
        description:
          - Node label key the packaged ingress chart is pinned to, supplied
            through a HelmChartConfig on the bootstrap server.
      rke2_server_node_taints:
        type: list
        elements: str
        description:
          - Taints the kubelet registers with. Applies at first registration
            only, so this affects a rebuilt node rather than a running one.
      rke2_server_data_dir:
        type: str
        default: /data1/rancher/rke2
        description: RKE2 data directory. Must match rke2_node_data_dir.
      rke2_server_expose_metrics:
        type: bool
        default: true
        description:
          - Binds etcd, the scheduler, the controller manager and kube-proxy
            metrics off 127.0.0.1 so kube-prometheus-stack can scrape them.
            Left at RKE2's default the chart reports the whole control plane
            down on a cluster that is healthy.
      rke2_server_etcd_snapshot_schedule:
        type: str
        default: "0 */6 * * *"
        description: Cron schedule for automatic etcd snapshots.
      rke2_server_etcd_snapshot_retention:
        type: int
        default: 10
        description: How many automatic snapshots to keep.
      rke2_server_etcd_args:
        type: list
        elements: str
        description:
          - Extra arguments passed to etcd, as key=value strings. Used here to
            raise the heartbeat and election timeouts so etcd tolerates slow
            storage instead of mistaking a slow commit for a dead leader.
      rke2_server_kube_vip_enabled:
        type: bool
        default: true
        description: Whether to deploy kube-vip for the virtual address.
      rke2_server_kube_vip_image:
        type: str
        default: ghcr.io/kube-vip/kube-vip:v1.2.2
        description:
          - Upstream image reference. The rewrite to the GitLab path happens
            inside containerd, so the upstream name is what belongs here.
      rke2_server_kube_vip_interface:
        type: str
        default: eth0
        description: Interface kube-vip advertises the address on.
      rke2_server_kube_vip_lease_duration:
        type: int
        default: 15
        description: Leader election lease duration, in seconds.
      rke2_server_kube_vip_renew_deadline:
        type: int
        default: 10
        description: Leader election renewal deadline, in seconds.
      rke2_server_kube_vip_retry_period:
        type: int
        default: 2
        description: Leader election retry period, in seconds.
      rke2_server_ready_retries:
        type: int
        default: 90
        description: How many times a readiness check is retried.
      rke2_server_ready_delay:
        type: int
        default: 10
        description: Seconds between readiness retries.
      rke2_server_kubeconfig_dest:
        type: str
        default: ""
        description:
          - Where to write a kubeconfig on the controller, rewritten to reach
            the cluster through the virtual address. Empty disables the copy.
      rke2_server_ingress_address:
        type: str
        description:
          - LoadBalancer address requested for the ingress controller. The
            cluster's DNS answers every ingress hostname with it.
