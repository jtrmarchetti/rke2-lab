---
argument_specs:
  main:
    short_description: Configure, start, and gate an RKE2 server
    description:
      - Renders /etc/rancher/rke2/config.yaml, including the fixed registration
        address on every server except the one that starts the cluster.
      - Deploys kube-vip into the auto-deploy manifest directory on the
        bootstrap server, so the API virtual address exists before any other
        server needs it to join.
      - Waits on transactions rather than on service status - the API answering
        /readyz, the node reaching Ready, and the virtual address accepting a
        connection.
    options:
      rke2_server_enabled:
        type: bool
        default: true
        description: Whether the role does anything.
      rke2_server_bootstrap:
        type: bool
        default: false
        description:
          - True on exactly one host. That host omits the server address, which
            is what makes it the initial etcd member.
      rke2_server_api_address:
        type: str
        description: The API virtual address held by kube-vip.
      rke2_server_api_name:
        type: str
        description: The name resolving to the virtual address.
      rke2_server_api_port:
        type: int
        default: 6443
        description: Port the Kubernetes API is served on.
      rke2_server_token:
        type: str
        required: true
        description:
          - Shared cluster join secret, from RKE2_TOKEN in the environment.
      rke2_server_node_ip:
        type: str
        required: true
        description: This node's address on the internal network.
      rke2_server_tls_san:
        type: list
        elements: str
        required: true
        description:
          - Every name and address the API certificate must cover, so adding a
            path later is not a certificate reissue and a rolling restart.
      rke2_server_ingress_controller:
        type: list
        elements: str
        description:
          - Ingress controllers RKE2 deploys. One of none, ingress-nginx or
            traefik; the first value becomes the default ingress class.
      rke2_server_data_dir:
        type: str
        default: /data1/rancher/rke2
        description: RKE2 data directory. Must match rke2_node_data_dir.
      rke2_server_kube_vip_enabled:
        type: bool
        default: true
        description: Whether to deploy kube-vip for the virtual address.
      rke2_server_ready_retries:
        type: int
        default: 90
        description: How many times a readiness check is retried.
      rke2_server_ready_delay:
        type: int
        default: 10
        description: Seconds between readiness retries.
      rke2_server_kubeconfig_dest:
        type: str
        default: ""
        description:
          - Where to write a kubeconfig on the controller, rewritten to reach
            the cluster through the virtual address. Empty disables the copy.
      rke2_server_config_template:
        type: path
        description: Path to the config.yaml template, from inventory.
      rke2_server_traefik_template:
        type: path
        description: Path to the Traefik HelmChartConfig template, from inventory.
      rke2_server_kube_vip_template:
        type: path
        description: Path to the kube-vip manifest template, from inventory.
