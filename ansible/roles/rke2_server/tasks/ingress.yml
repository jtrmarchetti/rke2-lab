---

- name: ingress | Ensure the auto-deploy manifest directory exists
  ansible.builtin.file:
    path: "{{ rke2_server_data_dir }}/server/manifests"
    state: directory
    owner: root
    group: root
    mode: "0750"

- name: ingress | Render the Traefik chart configuration
  ansible.builtin.template:
    src: "{{ _var_rke2_server_files_dir }}/traefik-config.yaml.j2"
    dest: "{{ rke2_server_data_dir }}/server/manifests/rke2-traefik-config.yaml"
    owner: root
    group: root
    mode: "0600"
