---
# Helm on repo01, fetched from this host's own Apache document root rather than
# from get.helm.sh.
#
# The rule in plan/OVERVIEW.md is that every artifact is staged before it is
# used, and it applies to the tool that stages artifacts as much as to what it
# stages: a rebuild that downloads helm straight from the internet works only
# while the internet is reachable, and the point of the artifact host is that
# nothing downstream depends on that.

- name: main | Read the version already installed here
  when: (helm_cli_enabled | bool)
  changed_when: false
  failed_when: false
  register: _reg_helm_cli_installed
  ansible.builtin.command:
    cmd: "{{ helm_cli_bin_dir }}/helm version --short"

- name: main | Download and unpack the release
  when:
    - (helm_cli_enabled | bool)
    - >-
      _reg_helm_cli_installed['rc'] != 0
      or helm_cli_version not in _reg_helm_cli_installed['stdout']
  block:
    - name: main | Create a scratch directory for the download
      register: _reg_helm_cli_tmp
      ansible.builtin.tempfile:
        state: directory
        suffix: helm

    # Downloaded over TLS from the artifact host at the pinned URL, so the
    # integrity rides on the transport and the pinned source rather than on a
    # recorded checksum.
    - name: main | Download the release tarball from the artifact host
      ansible.builtin.get_url:
        url: "{{ helm_cli_url | trim }}"
        dest: "{{ _reg_helm_cli_tmp['path'] }}/helm.tar.gz"
        mode: "0644"

    - name: main | Unpack just the binary
      ansible.builtin.unarchive:
        src: "{{ _reg_helm_cli_tmp['path'] }}/helm.tar.gz"
        dest: "{{ helm_cli_bin_dir }}"
        remote_src: true
        include:
          - "{{ helm_cli_archive_member }}"
        extra_opts:
          - --strip-components=1
        owner: root
        group: root
        mode: "0755"
  always:
    - name: main | Remove the scratch directory
      when: (_reg_helm_cli_tmp['path'] | default('') | length) > 0
      ansible.builtin.file:
        path: "{{ _reg_helm_cli_tmp['path'] | default('') }}"
        state: absent
