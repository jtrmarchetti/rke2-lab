---
argument_specs:
  main:
    short_description: Install the Helm CLI on the artifact host
    description:
      - Installs a pinned Helm 3 release from the artifact host's Apache root,
        verified against the SHA256 recorded in the artifact manifest.
      - Reinstalls only when the installed version differs, so a second run
        reports no change.
    options:
      helm_cli_enabled:
        type: bool
        default: true
        description: Whether the role does anything.
      helm_cli_bin_dir:
        type: str
        default: /usr/local/bin
        description: Directory the binary is installed into.
      helm_cli_version:
        type: str
        description:
          - Version to install, compared against `helm version --short` to
            decide whether the installed copy is stale.
      helm_cli_url:
        type: str
        description: >-
          Release tarball URL, served by the artifact host. The pinned URL and
          the TLS transport are the integrity control.
      helm_cli_archive_member:
        type: str
        default: linux-amd64/helm
        description: Path of the binary inside the release tarball.
