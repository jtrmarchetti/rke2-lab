---
gitops_source_enabled: true

gitops_source_gitlab_url: null

gitops_source_group: platform
gitops_source_project: cluster-state
gitops_source_branch: main

gitops_source_cluster_path: ./clusters/dev-lo

gitops_source_domain: null

gitops_source_cluster_domain: null

gitops_source_keycloak_realm: null

gitops_source_registry_host: null

gitops_source_charts_repo: rke2/charts

gitops_source_lb_range: null
gitops_source_dns_address: null
gitops_source_ingress_address: null

gitops_source_domain_ca_file: null

gitops_source_ca_file: /etc/ssl/certs/ca-certificates.crt

gitops_source_work_dir: >-
  {{ ansible_facts['env']['HOME'] }}/.cache/rke2lab/cluster-state

gitops_source_bin_dir: "{{ ansible_facts['env']['HOME'] }}/.local/bin"

gitops_source_sealing_key_file: >-
  {{ ansible_facts['env']['HOME'] }}/.config/rke2lab/sealed-secrets-key.yaml

gitops_source_ca_dir: >-
  {{ ansible_facts['env']['HOME'] }}/.config/rke2lab/k8s-ca
gitops_source_ca_common_name: null

gitops_source_push: true

gitops_source_commit_message: >-
  Render cluster state from Ansible
gitops_source_commit_name: rke2lab automation
gitops_source_commit_email: null

gitops_source_openbao_unseal_keys: ""

# Surgical pass: seal only the unseal-key entry, skip project + render.
gitops_source_unseal_keys_only: false

gitops_source_deploy_token_file: /data1/gitlab/rke2-deploy-token.yml

gitops_source_admin_token_file: /data1/gitlab/admin-token.yml

gitops_source_no_log: true
