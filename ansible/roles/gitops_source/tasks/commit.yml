---

- name: commit | Note whether the ansible-owned tree carries work
  changed_when: false
  failed_when: false
  register: _reg_gitops_source_tree_dirty
  ansible.builtin.command:
    cmd: >-
      git -C {{ gitops_source_work_dir }} status --porcelain
      . ':(exclude){{ _var_gitops_source_flux_dir }}'

- name: commit | Stage the ansible-owned tree # noqa: command-instead-of-module
  changed_when: >-
    {{ _reg_gitops_source_tree_dirty['stdout'] | length > 0 }}
  ansible.builtin.command:
    cmd: >-
      git -C {{ gitops_source_work_dir }} add -A
      . ':(exclude){{ _var_gitops_source_flux_dir }}'

- name: commit | Look for a difference # noqa: command-instead-of-module
  changed_when: false
  failed_when: false
  register: _reg_gitops_source_diff
  ansible.builtin.command:
    cmd: >-
      git -C {{ gitops_source_work_dir }} diff --cached --quiet

- name: commit | Summarise the difference # noqa: command-instead-of-module
  when: _reg_gitops_source_diff['rc'] != 0
  changed_when: false
  register: _reg_gitops_source_diffstat
  ansible.builtin.command:
    cmd: >-
      git -C {{ gitops_source_work_dir }} diff --cached --stat

- name: commit | Show it
  ansible.builtin.debug:
    msg: >-
      {{ _reg_gitops_source_diffstat['stdout_lines']
         if _reg_gitops_source_diff['rc'] != 0
         else 'cluster-state is already in sync with the template tree' }}
    verbosity: 0

- name: commit | Say so when the push is gated off
  when:
    - _reg_gitops_source_diff['rc'] != 0
    - not (gitops_source_push | bool)
  ansible.builtin.debug:
    msg: >-
      gitops_source_push is false — the diff above was rendered but not
      committed. The working tree is at {{ gitops_source_work_dir }}.
    verbosity: 0

- name: commit | Commit and push
  when:
    - _reg_gitops_source_diff['rc'] != 0
    - (gitops_source_push | bool)
  block:
    - name: commit | Create the commit # noqa: command-instead-of-module
      changed_when: true
      ansible.builtin.command:
        cmd: >-
          git -C {{ gitops_source_work_dir }} commit
          -m "{{ gitops_source_commit_message }}"

    - name: commit | Push it # noqa: command-instead-of-module
      changed_when: true
      no_log: "{{ gitops_source_no_log | bool }}"
      ansible.builtin.command:
        cmd: >-
          git -C {{ gitops_source_work_dir }} push
          {{ _var_gitops_source_push_url }}
          {{ gitops_source_branch }}:{{ gitops_source_branch }}
