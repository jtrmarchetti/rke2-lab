---

- name: project | Look for the group
  no_log: "{{ gitops_source_no_log | bool }}"
  register: _reg_gitops_source_group_get
  ansible.builtin.uri:
    ca_path: "{{ gitops_source_ca_file }}"
    url: "{{ _var_gitops_source_api }}/groups/{{ _var_gitops_source_group_path }}"
    headers: "{{ _var_gitops_source_headers }}"
    status_code: [200, 404]

- name: project | Create the group
  when: _reg_gitops_source_group_get['status'] == 404
  no_log: "{{ gitops_source_no_log | bool }}"
  register: _reg_gitops_source_group_new
  ansible.builtin.uri:
    ca_path: "{{ gitops_source_ca_file }}"
    url: "{{ _var_gitops_source_api }}/groups"
    method: POST
    headers: "{{ _var_gitops_source_headers }}"
    body_format: form-urlencoded
    body:
      name: "{{ gitops_source_group }}"
      path: "{{ gitops_source_group }}"
      visibility: private
      description: >-
        Declarative cluster state, rendered from Ansible. Phase 6.
    status_code: [201]

- name: project | Re-read the group
  no_log: "{{ gitops_source_no_log | bool }}"
  register: _reg_gitops_source_group_final
  ansible.builtin.uri:
    ca_path: "{{ gitops_source_ca_file }}"
    url: "{{ _var_gitops_source_api }}/groups/{{ _var_gitops_source_group_path }}"
    headers: "{{ _var_gitops_source_headers }}"

- name: project | Look for the project
  no_log: "{{ gitops_source_no_log | bool }}"
  register: _reg_gitops_source_project_get
  ansible.builtin.uri:
    ca_path: "{{ gitops_source_ca_file }}"
    url: >-
      {{ _var_gitops_source_api }}/projects/{{ _var_gitops_source_project_path }}
    headers: "{{ _var_gitops_source_headers }}"
    status_code: [200, 404]

- name: project | Create the project
  when: _reg_gitops_source_project_get['status'] == 404
  changed_when: true
  no_log: "{{ gitops_source_no_log | bool }}"
  ansible.builtin.uri:
    ca_path: "{{ gitops_source_ca_file }}"
    url: "{{ _var_gitops_source_api }}/projects"
    method: POST
    headers: "{{ _var_gitops_source_headers }}"
    body_format: form-urlencoded
    body:
      name: "{{ gitops_source_project }}"
      path: "{{ gitops_source_project }}"
      namespace_id: "{{ _reg_gitops_source_group_final['json']['id'] }}"
      visibility: private

      default_branch: "{{ gitops_source_branch }}"

      issues_enabled: false
      merge_requests_enabled: false
      wiki_enabled: false
    status_code: [201]
