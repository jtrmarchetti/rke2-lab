---
# Every template under templates/cluster-state, rendered into the clone at the
# same relative path with the .j2 suffix dropped.
#
# Discovered rather than listed. A list would be a second place to remember to
# edit, and the failure mode of forgetting is a manifest that exists in this
# repository, is absent from GitLab, and is therefore silently not deployed —
# which is precisely the class of problem this role exists to remove.

- name: render | Find every template in the source tree
  register: _reg_gitops_source_templates
  ansible.builtin.find:
    paths: "{{ _var_gitops_source_template_root }}"
    patterns: "*.j2"
    recurse: true

- name: render | Find the files copied without rendering
  register: _reg_gitops_source_files
  ansible.builtin.find:
    paths: "{{ _var_gitops_source_file_root }}"
    recurse: true

# Directories first, because `template` and `copy` will not create a missing
# parent and the tree is several levels deep.
- name: render | Create the directory structure
  loop: >-
    {{ (_reg_gitops_source_templates['files'] + _reg_gitops_source_files['files'])
       | map(attribute='path')
       | map('regex_replace', '^' ~ _var_gitops_source_template_root ~ '/', '')
       | map('regex_replace', '^' ~ _var_gitops_source_file_root ~ '/', '')
       | map('dirname') | unique | sort }}
  loop_control:
    loop_var: _item_gitops_source_directory
    label: "{{ _item_gitops_source_directory }}"
  ansible.builtin.file:
    path: "{{ gitops_source_work_dir }}/{{ _item_gitops_source_directory }}"
    state: directory
    mode: "0755"

- name: render | Render the templates
  loop: "{{ _reg_gitops_source_templates['files'] }}"
  loop_control:
    loop_var: _item_gitops_source_file
    label: >-
      {{ _item_gitops_source_file['path'] | regex_replace('^' ~ _var_gitops_source_template_root
                                      ~ '/', '') }}
  vars:
    _gitops_source_dest: >-
      {{ _item_gitops_source_file['path']
         | regex_replace('^' ~ _var_gitops_source_template_root ~ '/', '')
         | regex_replace('\.j2$', '') }}
  ansible.builtin.template:
    src: "{{ _item_gitops_source_file['path'] }}"
    dest: "{{ gitops_source_work_dir }}/{{ _gitops_source_dest }}"
    mode: "0644"
    # The rendered files are Kubernetes manifests, not shell or Python, so
    # trailing-newline handling is the only whitespace question that matters
    # and lstrip_blocks would silently reindent block scalars.
    lstrip_blocks: false
    trim_blocks: true

# Vendor release assets, byte for byte. gotk-components.yaml is what
# `flux install --export` produced for the pinned version; rendering it would
# invite an edit, and its whole value is that it is unmodified.
- name: render | Copy the vendored files
  loop: "{{ _reg_gitops_source_files['files'] }}"
  loop_control:
    loop_var: _item_gitops_source_file
    label: >-
      {{ _item_gitops_source_file['path'] | regex_replace('^' ~ _var_gitops_source_file_root
                                      ~ '/', '') }}
  vars:
    _gitops_source_dest: >-
      {{ _item_gitops_source_file['path']
         | regex_replace('^' ~ _var_gitops_source_file_root ~ '/', '') }}
  ansible.builtin.copy:
    src: "{{ _item_gitops_source_file['path'] }}"
    dest: "{{ gitops_source_work_dir }}/{{ _gitops_source_dest }}"
    mode: "0644"
