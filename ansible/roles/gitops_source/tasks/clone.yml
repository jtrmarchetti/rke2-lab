---
# A fresh clone every run, into a stable path.
#
# Fresh, because the alternative is reconciling a local working copy with a
# remote that may have moved, and every form of that is a merge — which is the
# wrong shape for a directory whose content is generated. Whatever is in GitLab
# is history to append to, not state to reconcile with.
#
# Stable, because the rendered tree is worth being able to look at afterwards.
# `git -C {{ gitops_source_work_dir }} show` answers "what did the last run
# actually push" without a second clone.

- name: clone | Remove the previous working clone
  ansible.builtin.file:
    path: "{{ gitops_source_work_dir }}"
    state: absent

- name: clone | Ensure the parent directory exists
  ansible.builtin.file:
    path: "{{ gitops_source_work_dir | dirname }}"
    state: directory
    mode: "0700"

# Not the git module: it wants the credential in the URL it stores, and this
# credential is a one-day admin token that must not be written into the clone's
# config. The command form takes it per invocation, and the next task replaces
# the stored remote with the plain URL.
#
# An empty project clones successfully and leaves an unborn branch, which is
# the cold-rebuild case and is handled below rather than treated as an error.
- name: clone | Clone the repository # noqa: command-instead-of-module
  changed_when: true
  no_log: "{{ gitops_source_no_log | bool }}"
  register: _reg_gitops_source_clone
  ansible.builtin.command:
    cmd: >-
      git clone {{ _var_gitops_source_push_url }} {{ gitops_source_work_dir }}

- name: clone | Drop the token from the remote # noqa: command-instead-of-module
  changed_when: true
  ansible.builtin.command:
    cmd: >-
      git -C {{ gitops_source_work_dir }} remote set-url origin
      {{ gitops_source_gitlab_url }}/{{ gitops_source_group }}/{{
      gitops_source_project }}.git

- name: clone | Look for the branch # noqa: command-instead-of-module
  changed_when: false
  failed_when: false
  register: _reg_gitops_source_branch_head
  ansible.builtin.command:
    cmd: >-
      git -C {{ gitops_source_work_dir }} rev-parse --verify --quiet
      refs/remotes/origin/{{ gitops_source_branch }}

# `-B` rather than `-b`: it is the same command whether the branch exists
# locally or not, which matters because the two cases here are "cloned a
# repository that already has this branch" and "cloned an empty one".
- name: clone | Check out the branch # noqa: command-instead-of-module
  changed_when: true
  ansible.builtin.command:
    cmd: >-
      git -C {{ gitops_source_work_dir }} checkout -B
      {{ gitops_source_branch }}
      {{ ('refs/remotes/origin/' ~ gitops_source_branch)
         if _reg_gitops_source_branch_head['rc'] == 0 else '' }}

# Identity on the repository rather than globally: this host is a workstation
# and the operator's own git identity is not this role's to change.
- name: clone | Set the committer identity # noqa: command-instead-of-module
  changed_when: true
  loop:
    - key: user.name
      value: "{{ gitops_source_commit_name }}"
    - key: user.email
      value: "{{ gitops_source_commit_email }}"
  loop_control:
    loop_var: _item_gitops_source_git_setting
    label: "{{ _item_gitops_source_git_setting['key'] }}"
  ansible.builtin.command:
    cmd: >-
      git -C {{ gitops_source_work_dir }} config {{ _item_gitops_source_git_setting['key'] }}
      "{{ _item_gitops_source_git_setting['value'] }}"

# The wipe that makes this repository a rendering rather than an accumulation.
# Without it a file deleted from the template tree, or edited directly in
# GitLab, would live on forever — and Flux would go on reconciling it, because
# `prune` removes what a kustomization stops declaring and not what a
# kustomization was never told about.
#
# The working tree only. `git add -A` after the render reads the deletions out
# of it, so the index needs no separate clearing.
- name: clone | List everything the render is about to replace
  register: _reg_gitops_source_stale
  ansible.builtin.find:
    paths: "{{ gitops_source_work_dir }}"
    patterns: "*"
    hidden: true
    file_type: any
    excludes:
      - .git

- name: clone | Remove them
  loop: "{{ _reg_gitops_source_stale['files'] }}"
  loop_control:
    loop_var: _item_gitops_source_stale_file
    label: "{{ _item_gitops_source_stale_file['path'] | basename }}"
  ansible.builtin.file:
    path: "{{ _item_gitops_source_stale_file['path'] }}"
    state: absent
