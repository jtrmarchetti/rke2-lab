---

- name: clone | Check for a working clone
  register: _reg_gitops_source_repo
  ansible.builtin.stat:
    path: "{{ gitops_source_work_dir }}/.git"
    get_checksum: false

- name: clone | Ensure the parent directory exists
  ansible.builtin.file:
    path: "{{ gitops_source_work_dir | dirname }}"
    state: directory
    mode: "0700"

- name: clone | Clone the repository # noqa: command-instead-of-module
  when: not _reg_gitops_source_repo['stat']['exists']
  changed_when: true
  no_log: "{{ gitops_source_no_log | bool }}"
  ansible.builtin.command:
    cmd: >-
      git clone {{ _var_gitops_source_push_url }} {{ gitops_source_work_dir }}

- name: clone | Fetch the remote branch # noqa: command-instead-of-module
  changed_when: false
  failed_when: false
  no_log: "{{ gitops_source_no_log | bool }}"
  ansible.builtin.command:
    cmd: >-
      git -C {{ gitops_source_work_dir }} fetch
      {{ _var_gitops_source_push_url }}
      {{ gitops_source_branch }}:refs/remotes/origin/{{ gitops_source_branch }}

- name: clone | Look up the recorded remote URL # noqa: command-instead-of-module
  changed_when: false
  failed_when: false
  register: _reg_gitops_source_remote_url
  ansible.builtin.command:
    cmd: >-
      git -C {{ gitops_source_work_dir }} remote get-url origin

- name: clone | Drop the token from the remote # noqa: command-instead-of-module
  when:
    - _reg_gitops_source_remote_url['stdout_lines'] | first
      != _var_gitops_source_git_url
  changed_when: true
  ansible.builtin.command:
    cmd: >-
      git -C {{ gitops_source_work_dir }} remote set-url origin
      {{ _var_gitops_source_git_url }}

- name: clone | Look for the branch # noqa: command-instead-of-module
  changed_when: false
  failed_when: false
  register: _reg_gitops_source_branch_head
  ansible.builtin.command:
    cmd: >-
      git -C {{ gitops_source_work_dir }} rev-parse --verify --quiet
      refs/remotes/origin/{{ gitops_source_branch }}

- name: clone | Note whether the fetch left a resolvable tip behind # noqa: command-instead-of-module
  when: _reg_gitops_source_branch_head['rc'] != 0
  changed_when: false
  failed_when: false
  register: _reg_gitops_source_fetch_head
  ansible.builtin.command:
    cmd: >-
      git -C {{ gitops_source_work_dir }} rev-parse --verify --quiet FETCH_HEAD

- name: clone | Pick the checkout start point
  ansible.builtin.set_fact:
    _gitops_source_checkout_start: >-
      {{ 'refs/remotes/origin/' ~ gitops_source_branch
         if _reg_gitops_source_branch_head['rc'] == 0
         else ('FETCH_HEAD'
               if (_reg_gitops_source_fetch_head['rc'] | default(1)) == 0
               else '') }}

- name: clone | Pin the working clone to the remote branch # noqa: command-instead-of-module
  changed_when: false
  ansible.builtin.command:
    cmd: >-
      git -C {{ gitops_source_work_dir }} checkout -B
      {{ gitops_source_branch }}
      {{ _gitops_source_checkout_start | trim }}

- name: clone | Look for the untracked files a failed run left behind # noqa: command-instead-of-module
  changed_when: false
  failed_when: false
  register: _reg_gitops_source_clean
  ansible.builtin.command:
    cmd: >-
      git -C {{ gitops_source_work_dir }} clean -fdn

- name: clone | Remove them # noqa: command-instead-of-module
  when: _reg_gitops_source_clean['stdout_lines'] | default([]) | length > 0
  changed_when: true
  ansible.builtin.command:
    cmd: >-
      git -C {{ gitops_source_work_dir }} clean -fd

- name: clone | Set the committer identity # noqa: command-instead-of-module
  changed_when: false
  loop:
    - key: user.name
      value: "{{ gitops_source_commit_name }}"
    - key: user.email
      value: "{{ gitops_source_commit_email }}"
  loop_control:
    loop_var: _item_gitops_source_git_setting
    label: "{{ _item_gitops_source_git_setting['key'] }}"
  ansible.builtin.command:
    cmd: >-
      git -C {{ gitops_source_work_dir }} config
      {{ _item_gitops_source_git_setting['key'] }}
      "{{ _item_gitops_source_git_setting['value'] }}"
