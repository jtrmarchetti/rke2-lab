---

- name: shell | Ensure the configuration directory exists
  ansible.builtin.file:
    path: "{{ controller_runtime_config_dir | trim }}"
    state: directory
    mode: "0700"

- name: shell | Write the automation environment
  ansible.builtin.template:
    src: "{{ controller_runtime_env_template }}"
    dest: "{{ controller_runtime_env_file | trim }}"
    mode: "0644"

- name: shell | Source it from the shell startup files
  loop: "{{ controller_runtime_shell_rc_files }}"
  loop_control:
    loop_var: _item_controller_runtime_rc
    label: "{{ _item_controller_runtime_rc }}"
  ansible.builtin.blockinfile:
    path: "{{ _item_controller_runtime_rc }}"
    marker: "# {mark} ANSIBLE MANAGED BLOCK - rke2lab automation runtime"
    create: true
    mode: "0644"
    block: |
      if [ -r "{{ controller_runtime_env_file | trim }}" ]; then
          . "{{ controller_runtime_env_file | trim }}"
      fi
