---
# Every artifact is published with a checksum file next to it, and consumers
# verify before use.
#
# Iterates _var_artifact_stage_wanted, not the whole manifest: a transit artifact
# that has already been published is deliberately no longer on disk, and
# asserting its presence would turn the retention model into a permanent
# failure. For file artifacts this restates the manifest checksum
# that was already enforced at download; for image tarballs it is the only
# checksum that exists, because `docker save` output is not reproducible and
# the manifest pins the registry digest instead.
- name: checksums | Read the checksum of each published artifact
  when: not ansible_check_mode
  register: _reg_artifact_stage_published
  loop: "{{ _var_artifact_stage_wanted }}"
  loop_control:
    loop_var: _item_artifact_stage_wanted
    label: "{{ _item_artifact_stage_wanted['dest'] }}"
  ansible.builtin.stat:
    path: "{{ artifact_stage_root }}/{{ _item_artifact_stage_wanted['dest'] }}"
    checksum_algorithm: sha256

- name: checksums | Assert every manifest artifact is present
  when: not ansible_check_mode
  loop: "{{ _reg_artifact_stage_published['results'] | default([]) }}"
  loop_control:
    loop_var: _item_artifact_stage_result
    label: >-
      {{ _item_artifact_stage_result['_item_artifact_stage_wanted']['dest'] }}
  ansible.builtin.assert:
    that:
      - _item_artifact_stage_result['stat']['exists']
    fail_msg: >-
      Manifest artifact {{ _item_artifact_stage_result['_item_artifact_stage_wanted']['name'] }} was not published to
      {{ artifact_stage_root }}/{{ _item_artifact_stage_result['_item_artifact_stage_wanted']['dest'] }}.
    quiet: true

# Written in the format sha256sum reads, with the bare file name, so a consumer
# can verify with `sha256sum -c <file>.sha256` from the directory it downloaded
# into.
- name: checksums | Publish a checksum file next to each artifact
  when: not ansible_check_mode
  loop: "{{ _reg_artifact_stage_published['results'] | default([]) }}"
  loop_control:
    loop_var: _item_artifact_stage_result
    label: >-
      {{ _item_artifact_stage_result['_item_artifact_stage_wanted']['dest'] }}
  ansible.builtin.copy:
    content: >
      {{ _item_artifact_stage_result['stat']['checksum'] }}  {{ _item_artifact_stage_result['_item_artifact_stage_wanted']['dest'] | basename }}
    dest: >-
      {{ artifact_stage_root }}/{{ _item_artifact_stage_result['_item_artifact_stage_wanted']['dest'] }}{{
      _var_artifact_stage_checksum_suffix }}
    owner: "{{ artifact_stage_owner }}"
    group: "{{ artifact_stage_group }}"
    mode: "{{ artifact_stage_file_mode }}"
