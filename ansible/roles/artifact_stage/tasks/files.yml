---
# Downloaded over TLS from the pinned Apache/CDN URLs and published to the
# document root. Integrity rides on the transport (TLS, pinned source) rather
# than on a checksum sidecar, so there is nothing to verify after the
# download. get_url still skips a re-download when the destination exists,
# which is what makes a second run report no change.
- name: files | Download each file artifact
  when: not ansible_check_mode
  loop: "{{ _var_artifact_stage_files }}"
  loop_control:
    loop_var: _item_artifact_stage_file
    label: "{{ _item_artifact_stage_file['name'] }} (phase {{ _item_artifact_stage_file['phase'] }})"
  ansible.builtin.get_url:
    url: "{{ _item_artifact_stage_file['url'] }}"
    dest: "{{ artifact_stage_root }}/{{ _item_artifact_stage_file['dest'] }}"
    owner: "{{ artifact_stage_owner }}"
    group: "{{ artifact_stage_group }}"
    mode: "{{ artifact_stage_file_mode }}"
    timeout: "{{ artifact_stage_download_timeout }}"
