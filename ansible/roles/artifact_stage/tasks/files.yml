---
# get_url verifies the download against the manifest checksum and refuses to
# publish a file that does not match, so this task is both the fetch and the
# integrity gate. It also skips a re-download when the file on disk already
# matches, which is what makes a second run report no change.
- name: files | Download and verify each file artifact
  when: not ansible_check_mode
  loop: "{{ _var_artifact_stage_files }}"
  loop_control:
    loop_var: _item_artifact_stage_file
    label: "{{ _item_artifact_stage_file['name'] }} (phase {{ _item_artifact_stage_file['phase'] }})"
  ansible.builtin.get_url:
    url: "{{ _item_artifact_stage_file['url'] }}"
    dest: "{{ artifact_stage_root }}/{{ _item_artifact_stage_file['dest'] }}"
    checksum: "sha256:{{ _item_artifact_stage_file['sha256'] }}"
    owner: "{{ artifact_stage_owner }}"
    group: "{{ artifact_stage_group }}"
    mode: "{{ artifact_stage_file_mode }}"
    timeout: "{{ artifact_stage_download_timeout }}"
