---
- name: main | Assert every manifest entry has the fields its type requires
  when: (artifact_stage_enabled | bool)
  loop: "{{ artifact_stage_manifest }}"
  loop_control:
    loop_var: _item_artifact_stage_entry
    label: "{{ _item_artifact_stage_entry['name'] | default('<unnamed>') }}"
  ansible.builtin.assert:
    that:
      - _item_artifact_stage_entry['type'] != 'file' or (_item_artifact_stage_entry['url'] | default('') | length > 0)
      - _item_artifact_stage_entry['type'] != 'image' or (_item_artifact_stage_entry['image'] | default('') | length > 0)
      - >-
        _item_artifact_stage_entry['type'] != 'mirror'
        or (_item_artifact_stage_entry['image'] | default('') | length > 0)
      - >-
        _item_artifact_stage_entry['type'] == 'mirror'
        or _item_artifact_stage_entry['dest'] | default('') is match('^[^/][^\\0]*[^/]$')
      - _item_artifact_stage_entry['retention'] | default('') in ['bootstrap', 'transit']
    fail_msg: >-
      Manifest entry '{{ _item_artifact_stage_entry['name'] | default('<unnamed>') }}' is incomplete.
      A file entry needs url; an image or mirror entry needs image. dest must
      be a relative path under the document root, and retention must be
      'bootstrap' or 'transit' — an artifact with no stated retention would
      be kept forever by default, which is the behaviour this field exists to
      end.
    quiet: true

# A transit artifact is deleted locally once GitLab confirms it holds the
# content, so absence from disk cannot mean "fetch it again" — that would
# re-download the whole set on every run. The marker rke2_publish leaves behind
# is the local record of that confirmation, and it is read here rather than by
# the caller: every playbook that stages artifacts needs this, and one that
# forgot it would silently re-download gigabytes and report itself changed.
- name: main | Find the markers of artifacts already published to GitLab
  when: (artifact_stage_enabled | bool)
  register: _reg_artifact_stage_markers
  ansible.builtin.find:
    paths: "{{ artifact_stage_root }}"
    patterns: "*{{ _var_artifact_stage_published_suffix }}"
    recurse: true
    file_type: file

- name: main | Map the markers back to manifest entry names
  when: (artifact_stage_enabled | bool)
  vars:
    _artifact_stage_marked_dests: >-
      {{ _reg_artifact_stage_markers['files'] | map(attribute='path')
         | map('regex_replace', '^' ~ artifact_stage_root ~ '/', '')
         | map('regex_replace',
                _var_artifact_stage_published_suffix | regex_escape ~ '$', '')
         | list }}
  ansible.builtin.set_fact:
    _artifact_stage_marked_names: >-
      {{ _var_artifact_stage_local
         | selectattr('dest', 'in', _artifact_stage_marked_dests)
         | map(attribute='name') | list }}

# Mirror entries are skipped throughout this role. They are copied straight
# from one registry to another by rke2_publish and have no local path at all,
# which is the whole point of them.
- name: main | Ensure the destination directories exist
  when: (artifact_stage_enabled | bool)
  loop: "{{ _var_artifact_stage_local }}"
  loop_control:
    loop_var: _item_artifact_stage_local
    label: "{{ _item_artifact_stage_local['dest'] }}"
  ansible.builtin.file:
    path: >-
      {{ artifact_stage_root }}/{{ _item_artifact_stage_local['dest'] | dirname }}
    state: directory
    owner: "{{ artifact_stage_owner }}"
    group: "{{ artifact_stage_group }}"
    mode: "0755"

- name: main | Stage file artifacts
  when:
    - (artifact_stage_enabled | bool)
    - (_var_artifact_stage_files | length > 0)
  ansible.builtin.include_tasks: files.yml

# The image step pulls by tag, which needs a running Docker daemon. On a
# fresh build nothing earlier in this play has installed the runtime: each
# consumer role (gitlab, freeipa_server) installs its own in a later phase.
# container_storage has already written /etc/docker/daemon.json pointing
# data-root at the data volume, so starting the daemon here — right after
# that config exists, and before the first pull — is the point a fresh build
# needs. Gated on image entries so a file-only manifest stays runtime-free.
- name: main | Ensure container runtime packages are installed
  when:
    - (artifact_stage_enabled | bool)
    - (_var_artifact_stage_images | length > 0)
  ansible.builtin.apt:
    name: "{{ artifact_stage_runtime_packages }}"
    state: present

- name: main | Ensure the container runtime is running
  when:
    - (artifact_stage_enabled | bool)
    - (_var_artifact_stage_images | length > 0)
    - not ansible_check_mode
  ansible.builtin.systemd:
    name: docker
    enabled: true
    state: started

- name: main | Stage container image artifacts
  when:
    - (artifact_stage_enabled | bool)
    - (_var_artifact_stage_images | length > 0)
  ansible.builtin.include_tasks: images.yml

# Legacy cleanup, one time only. Older versions of this role published a
# .sha256 sidecar next to every artifact; the pipeline no longer writes or
# reads them, so a run that still has some deletes them and later runs find
# nothing and report ok. The rke2/sha256sum-amd64.txt artifact does not match
# the pattern, because it ends in .txt: it stays, the node's install.sh needs
# it.
- name: main | Find the legacy checksum sidecars this role used to publish
  when: (artifact_stage_enabled | bool)
  register: _reg_artifact_stage_legacy_sidecars
  ansible.builtin.find:
    paths: "{{ artifact_stage_root }}"
    patterns: "*{{ _var_artifact_stage_checksum_suffix }}"
    recurse: true
    file_type: file

- name: main | Remove the legacy checksum sidecars
  when:
    - (artifact_stage_enabled | bool)
    - (_reg_artifact_stage_legacy_sidecars['files'] | length > 0)
  loop: "{{ _reg_artifact_stage_legacy_sidecars['files'] }}"
  loop_control:
    loop_var: _item_artifact_stage_legacy_sidecar
    label: "{{ _item_artifact_stage_legacy_sidecar['path'] }}"
  ansible.builtin.file:
    path: "{{ _item_artifact_stage_legacy_sidecar['path'] }}"
    state: absent
