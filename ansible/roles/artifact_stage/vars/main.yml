---
# Records the reference a published image tarball was built from, so a
# changed pin in the manifest triggers a re-export while an unchanged one
# does not. Not published for consumers; it is this role's idempotency
# marker.
_var_artifact_stage_tag_suffix: .tag

# Leftover from the digest-pinned era. image_publish.yml still recognises it
# so one run can remove the old marker; delete this line and the removal
# task once no host carries a .digest marker anymore.
_var_artifact_stage_digest_suffix: .digest

# Leftover from the sidecar era. tasks/main.yml still uses it to find and
# delete the .sha256 sidecars older versions published, one time only;
# delete this line and the cleanup task once no host carries one anymore.
_var_artifact_stage_checksum_suffix: .sha256

# Written next to a transit artifact when the destination confirmed it holds
# the content. Its presence is what lets staging skip a re-download of
# something that has already been published and deleted locally — the local
# file is gone by design, so the file's absence cannot be the signal.
_var_artifact_stage_published_suffix: .published

# A transit artifact that carries a .published marker is not restaged. Without
# this, deleting the local copy after publishing would mean re-downloading
# every image tarball on every run — the exact trap the manifest schema
# describes.
#
# Two sources, and both are the same fact from different directions: the
# markers this role discovers on disk, and any names the caller passes in.
_var_artifact_stage_wanted: >-
  {{ _var_artifact_stage_local
     | rejectattr('name', 'in',
                  artifact_stage_published_names
                  + _artifact_stage_marked_names) | list }}

# Everything with a local path, which is everything this role handles at all.
# A mirror entry has no local path: it is copied from one registry to another
# by rke2_publish and never touches this host's disk.
_var_artifact_stage_local: >-
  {{ artifact_stage_manifest
     | rejectattr('type', 'equalto', 'mirror') | list }}

_var_artifact_stage_files: >-
  {{ _var_artifact_stage_wanted | selectattr('type', 'equalto', 'file') | list }}
_var_artifact_stage_images: >-
  {{ _var_artifact_stage_wanted | selectattr('type', 'equalto', 'image') | list }}
