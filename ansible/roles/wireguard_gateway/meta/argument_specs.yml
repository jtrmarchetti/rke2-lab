---
argument_specs:
  main:
    short_description: WireGuard gateway inputs.
    options:
      wireguard_gateway_enabled:
        type: bool
        required: false
      wireguard_gateway_interface:
        type: str
        required: false
      wireguard_gateway_address:
        type: str
        required: false
      wireguard_gateway_listen_port:
        type: int
        required: false
      wireguard_gateway_private_key:
        type: str
        required: false
      wireguard_gateway_peer_public_key:
        description: The controller peer's public key, derived by the caller.
        type: str
        required: false
      wireguard_gateway_ip_forward_enabled:
        type: bool
        required: false
      wireguard_gateway_template:
        description: Path to the wg interface template, under the repo files tree.
        type: str
        required: false
