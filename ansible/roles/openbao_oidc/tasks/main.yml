---

- name: main | Assert the required inputs are present
  when: (openbao_oidc_enabled | bool)
  ansible.builtin.assert:
    that:
      - (openbao_oidc_root_token | length) > 0
      - (openbao_oidc_url | length) > 0
      - (openbao_oidc_issuer | length) > 0
      - (openbao_oidc_client_secret | length) > 0
      - (openbao_oidc_discovery_ca_file | default('', true) | length) > 0
    fail_msg: >-
      openbao_oidc needs the root token (OPENBAO_ROOT_TOKEN, written to
      ~/.config/rke2lab/env.sh by openbao_init), the vault's URL, Keycloak's
      realm issuer, the client secret this vault authenticates to Keycloak
      with, and the domain CA it verifies Keycloak's certificate against —
      without that last one the configuration write fails with
      `error checking oidc discovery URL`, which names the URL and says nothing
      about certificates. Run `source ~/.config/rke2lab/env.sh` first; see
      plan/SECRETS.md.
    quiet: true

- name: main | Add an OIDC path into the vault beside the root token
  when:
    - (openbao_oidc_enabled | bool)

    - not ansible_check_mode
  block:
    - name: main | Read the enabled authentication methods
      changed_when: false
      no_log: "{{ openbao_oidc_no_log | bool }}"
      register: _reg_openbao_oidc_auth
      ansible.builtin.uri:
        url: "{{ openbao_oidc_url }}/v1/sys/auth"
        headers: "{{ _var_openbao_oidc_headers }}"
        ca_path: "{{ openbao_oidc_ca_file }}"

    - name: main | Enable the OIDC authentication method
      when: >-
        (openbao_oidc_mount ~ '/') not in _reg_openbao_oidc_auth['json']
      changed_when: true
      no_log: "{{ openbao_oidc_no_log | bool }}"
      ansible.builtin.uri:
        url: >-
          {{ openbao_oidc_url }}/v1/sys/auth/{{ openbao_oidc_mount }}
        method: POST
        headers: "{{ _var_openbao_oidc_headers }}"
        ca_path: "{{ openbao_oidc_ca_file }}"
        body_format: json
        body:
          type: oidc
        status_code: [200, 204]

    - name: main | Read the current OIDC configuration
      changed_when: false

      failed_when: false
      no_log: "{{ openbao_oidc_no_log | bool }}"
      register: _reg_openbao_oidc_config
      ansible.builtin.uri:
        url: >-
          {{ openbao_oidc_url }}/v1/auth/{{ openbao_oidc_mount }}/config
        headers: "{{ _var_openbao_oidc_headers }}"
        ca_path: "{{ openbao_oidc_ca_file }}"
        status_code: [200, 404]

    - name: main | Point the OIDC method at the Keycloak realm
      when: >-
        (_reg_openbao_oidc_config['status'] | default(404)) != 200
        or (_reg_openbao_oidc_config['json']['data']['oidc_discovery_url']
            | default('')) != openbao_oidc_issuer
        or (_reg_openbao_oidc_config['json']['data']['oidc_client_id']
            | default('')) != openbao_oidc_client_id
        or (_reg_openbao_oidc_config['json']['data']['default_role']
            | default('')) != openbao_oidc_role_name
        or (_reg_openbao_oidc_config['json']['data']['oidc_discovery_ca_pem']
            | default('') | trim) != (_var_openbao_oidc_discovery_ca | trim)
      changed_when: true
      no_log: "{{ openbao_oidc_no_log | bool }}"
      ansible.builtin.uri:
        url: >-
          {{ openbao_oidc_url }}/v1/auth/{{ openbao_oidc_mount }}/config
        method: POST
        headers: "{{ _var_openbao_oidc_headers }}"
        ca_path: "{{ openbao_oidc_ca_file }}"
        body_format: json
        body:
          oidc_discovery_url: "{{ openbao_oidc_issuer }}"
          oidc_discovery_ca_pem: "{{ _var_openbao_oidc_discovery_ca }}"
          oidc_client_id: "{{ openbao_oidc_client_id }}"
          oidc_client_secret: "{{ openbao_oidc_client_secret }}"
          default_role: "{{ openbao_oidc_role_name }}"
        status_code: [200, 204]

    - name: main | Include the policy tasks
      ansible.builtin.include_tasks: policies.yml

    - name: main | Include the role and identity group tasks
      ansible.builtin.include_tasks: identity.yml

    - name: main | Confirm the root token still authenticates
      changed_when: false
      no_log: "{{ openbao_oidc_no_log | bool }}"
      register: _reg_openbao_oidc_root_check
      ansible.builtin.uri:
        url: "{{ openbao_oidc_url }}/v1/auth/token/lookup-self"
        headers: "{{ _var_openbao_oidc_headers }}"
        ca_path: "{{ openbao_oidc_ca_file }}"

    - name: main | Assert the offline way in survived
      vars:
        _openbao_oidc_root_policies: >-
          {{ _reg_openbao_oidc_root_check['json']['data']['policies']
             | default([]) }}
      ansible.builtin.assert:
        that:
          - "'root' in _openbao_oidc_root_policies"
        fail_msg: >-
          The root token no longer carries the root policy. OIDC was supposed
          to be a second way in, not a replacement for the first — a vault
          reachable only through Keycloak cannot be opened on the day Keycloak
          will not start, which is the day someone needs the Keycloak database
          password this vault holds.
        quiet: true

    - name: main | Report the OIDC path
      ansible.builtin.debug:
        msg: >-
          OIDC login enabled at {{ openbao_oidc_url }}/ui against
          {{ openbao_oidc_issuer }}. The '{{ openbao_oidc_admin_role }}' role
          grants {{ openbao_oidc_admin_policy }} and
          '{{ openbao_oidc_user_role }}' grants {{ openbao_oidc_user_policy }}.
          The root token remains valid.
        verbosity: 0
