---

- name: identity | Read the OIDC role as it currently stands
  changed_when: false

  failed_when: false
  no_log: "{{ openbao_oidc_no_log | bool }}"
  register: _reg_openbao_oidc_role
  ansible.builtin.uri:
    url: >-
      {{ openbao_oidc_url }}/v1/auth/{{ openbao_oidc_mount }}/role/{{
      openbao_oidc_role_name }}
    headers: "{{ _var_openbao_oidc_headers }}"
    ca_path: "{{ openbao_oidc_ca_file }}"
    status_code: [200, 404]

- name: identity | Write the OIDC role
  when: >-
    (_reg_openbao_oidc_role['status'] | default(404)) != 200
    or (_reg_openbao_oidc_role['json']['data']['groups_claim']
        | default('')) != openbao_oidc_groups_claim
    or (_reg_openbao_oidc_role['json']['data']['allowed_redirect_uris']
        | default([]) | sort) != (_var_openbao_oidc_redirect_uris | sort)
  changed_when: true
  no_log: "{{ openbao_oidc_no_log | bool }}"
  ansible.builtin.uri:
    url: >-
      {{ openbao_oidc_url }}/v1/auth/{{ openbao_oidc_mount }}/role/{{
      openbao_oidc_role_name }}
    method: POST
    headers: "{{ _var_openbao_oidc_headers }}"
    ca_path: "{{ openbao_oidc_ca_file }}"
    body_format: json
    body:
      role_type: oidc
      user_claim: sub
      groups_claim: "{{ openbao_oidc_groups_claim }}"
      allowed_redirect_uris: "{{ _var_openbao_oidc_redirect_uris }}"
      oidc_scopes: ["openid", "profile", "email"]
      token_ttl: "{{ openbao_oidc_token_ttl }}"
      token_max_ttl: "{{ openbao_oidc_token_max_ttl }}"
      token_policies: []
    status_code: [200, 204]

- name: identity | Re-read the authentication methods for the mount accessor
  changed_when: false
  no_log: "{{ openbao_oidc_no_log | bool }}"
  register: _reg_openbao_oidc_auth_final
  ansible.builtin.uri:
    url: "{{ openbao_oidc_url }}/v1/sys/auth"
    headers: "{{ _var_openbao_oidc_headers }}"
    ca_path: "{{ openbao_oidc_ca_file }}"

- name: identity | Read the identity groups that already exist
  changed_when: false

  failed_when: false
  no_log: "{{ openbao_oidc_no_log | bool }}"
  register: _reg_openbao_oidc_group_names
  ansible.builtin.uri:
    url: "{{ openbao_oidc_url }}/v1/identity/group/name?list=true"
    headers: "{{ _var_openbao_oidc_headers }}"
    ca_path: "{{ openbao_oidc_ca_file }}"
    status_code: [200, 404]

- name: identity | Create the external identity groups
  when: >-
    _item_openbao_oidc_group['name'] not in
    (_reg_openbao_oidc_group_names['json']['data']['keys'] | default([]))
  changed_when: true
  no_log: "{{ openbao_oidc_no_log | bool }}"
  loop: "{{ _var_openbao_oidc_groups }}"
  loop_control:
    loop_var: _item_openbao_oidc_group
    label: "{{ _item_openbao_oidc_group['name'] }}"
  ansible.builtin.uri:
    url: >-
      {{ openbao_oidc_url }}/v1/identity/group/name/{{
      _item_openbao_oidc_group['name'] }}
    method: POST
    headers: "{{ _var_openbao_oidc_headers }}"
    ca_path: "{{ openbao_oidc_ca_file }}"
    body_format: json
    body:
      type: external
      policies: "{{ _item_openbao_oidc_group['policies'] }}"
    status_code: [200, 204]

- name: identity | Read each group back for its identifier and policies
  changed_when: false
  no_log: "{{ openbao_oidc_no_log | bool }}"
  register: _reg_openbao_oidc_groups
  loop: "{{ _var_openbao_oidc_groups }}"
  loop_control:
    loop_var: _item_openbao_oidc_group
    label: "{{ _item_openbao_oidc_group['name'] }}"
  ansible.builtin.uri:
    url: >-
      {{ openbao_oidc_url }}/v1/identity/group/name/{{
      _item_openbao_oidc_group['name'] }}
    headers: "{{ _var_openbao_oidc_headers }}"
    ca_path: "{{ openbao_oidc_ca_file }}"

- name: identity | Correct a group whose policies have drifted
  when: >-
    (_item_openbao_oidc_read[1]['json']['data']['policies'] | default([])
     | sort) != (_item_openbao_oidc_read[0]['policies'] | sort)
  changed_when: true
  no_log: "{{ openbao_oidc_no_log | bool }}"
  loop: >-
    {{ _var_openbao_oidc_groups
       | zip(_reg_openbao_oidc_groups['results']) | list }}
  loop_control:
    loop_var: _item_openbao_oidc_read
    label: "{{ _item_openbao_oidc_read[0]['name'] }}"
  ansible.builtin.uri:
    url: >-
      {{ openbao_oidc_url }}/v1/identity/group/name/{{
      _item_openbao_oidc_read[0]['name'] }}
    method: POST
    headers: "{{ _var_openbao_oidc_headers }}"
    ca_path: "{{ openbao_oidc_ca_file }}"
    body_format: json
    body:
      type: external
      policies: "{{ _item_openbao_oidc_read[0]['policies'] }}"
    status_code: [200, 204]

- name: identity | Read the aliases that already exist
  changed_when: false
  failed_when: false
  no_log: "{{ openbao_oidc_no_log | bool }}"
  register: _reg_openbao_oidc_alias_ids
  ansible.builtin.uri:
    url: "{{ openbao_oidc_url }}/v1/identity/group-alias/id?list=true"
    headers: "{{ _var_openbao_oidc_headers }}"
    ca_path: "{{ openbao_oidc_ca_file }}"
    status_code: [200, 404]

- name: identity | Read each existing alias
  changed_when: false
  no_log: "{{ openbao_oidc_no_log | bool }}"
  register: _reg_openbao_oidc_aliases
  loop: >-
    {{ _reg_openbao_oidc_alias_ids['json']['data']['keys'] | default([]) }}
  loop_control:
    loop_var: _item_openbao_oidc_alias_id
  ansible.builtin.uri:
    url: >-
      {{ openbao_oidc_url }}/v1/identity/group-alias/id/{{
      _item_openbao_oidc_alias_id }}
    headers: "{{ _var_openbao_oidc_headers }}"
    ca_path: "{{ openbao_oidc_ca_file }}"

- name: identity | Bind each group to the role name it is granted by
  when: >-
    _item_openbao_oidc_bind[0]['alias'] not in _openbao_oidc_bound
  changed_when: true
  no_log: "{{ openbao_oidc_no_log | bool }}"
  loop: >-
    {{ _var_openbao_oidc_groups
       | zip(_reg_openbao_oidc_groups['results']) | list }}
  loop_control:
    loop_var: _item_openbao_oidc_bind
    label: >-
      {{ _item_openbao_oidc_bind[0]['alias'] }} ->
      {{ _item_openbao_oidc_bind[0]['name'] }}
  vars:

    _openbao_oidc_bound: >-
      {{ _reg_openbao_oidc_aliases['results'] | default([])
         | map(attribute='json.data') | selectattr('mount_accessor',
           'equalto', _var_openbao_oidc_accessor | trim)
         | map(attribute='name') | list }}
  ansible.builtin.uri:
    url: "{{ openbao_oidc_url }}/v1/identity/group-alias"
    method: POST
    headers: "{{ _var_openbao_oidc_headers }}"
    ca_path: "{{ openbao_oidc_ca_file }}"
    body_format: json
    body:
      name: "{{ _item_openbao_oidc_bind[0]['alias'] }}"
      mount_accessor: "{{ _var_openbao_oidc_accessor | trim }}"
      canonical_id: "{{ _item_openbao_oidc_bind[1]['json']['data']['id'] }}"
    status_code: [200, 204]
