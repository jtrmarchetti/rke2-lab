---
# The two policies an OIDC login can land on.
#
# Read before written, so a run that changes nothing writes nothing. The vault
# accepts a policy write whether or not the text differs, so without the
# comparison this role could never report a clean second run — the same
# reasoning openbao_config records for its own policy.

- name: policies | Read the policy currently stored
  changed_when: false
  # Absent before the first write.
  failed_when: false
  no_log: "{{ openbao_oidc_no_log | bool }}"
  register: _reg_openbao_oidc_policies
  loop: "{{ _var_openbao_oidc_policies }}"
  loop_control:
    loop_var: _item_openbao_oidc_policy
    label: "{{ _item_openbao_oidc_policy['name'] }}"
  ansible.builtin.uri:
    url: >-
      {{ openbao_oidc_url }}/v1/sys/policies/acl/{{
      _item_openbao_oidc_policy['name'] }}
    headers: "{{ _var_openbao_oidc_headers }}"
    ca_path: "{{ openbao_oidc_ca_file }}"
    status_code: [200, 404]

- name: policies | Write the policies that differ
  when: >-
    (_item_openbao_oidc_written[1]['status'] | default(404)) != 200
    or (_item_openbao_oidc_written[1]['json']['data']['policy']
        | default('') | trim)
       != (_item_openbao_oidc_written[0]['policy'] | trim)
  changed_when: true
  no_log: "{{ openbao_oidc_no_log | bool }}"
  loop: >-
    {{ _var_openbao_oidc_policies
       | zip(_reg_openbao_oidc_policies['results']) | list }}
  loop_control:
    loop_var: _item_openbao_oidc_written
    label: "{{ _item_openbao_oidc_written[0]['name'] }}"
  ansible.builtin.uri:
    url: >-
      {{ openbao_oidc_url }}/v1/sys/policies/acl/{{
      _item_openbao_oidc_written[0]['name'] }}
    method: PUT
    headers: "{{ _var_openbao_oidc_headers }}"
    ca_path: "{{ openbao_oidc_ca_file }}"
    body_format: json
    body:
      policy: "{{ _item_openbao_oidc_written[0]['policy'] }}"
    status_code: [200, 204]

# Read back and checked for what must *not* be in them. A policy that granted
# sys/seal or sys/policies/acl write would quietly make Keycloak part of the
# vault's recovery path, which is the one property this whole role is arranged
# to preserve, and it would do it without any other symptom.
- name: policies | Confirm the policies read back
  changed_when: false
  no_log: "{{ openbao_oidc_no_log | bool }}"
  register: _reg_openbao_oidc_policies_final
  loop: "{{ _var_openbao_oidc_policies }}"
  loop_control:
    loop_var: _item_openbao_oidc_policy
    label: "{{ _item_openbao_oidc_policy['name'] }}"
  ansible.builtin.uri:
    url: >-
      {{ openbao_oidc_url }}/v1/sys/policies/acl/{{
      _item_openbao_oidc_policy['name'] }}
    headers: "{{ _var_openbao_oidc_headers }}"
    ca_path: "{{ openbao_oidc_ca_file }}"

# The loop item is a (name, policy text) pair rather than the registered result
# it came from, for two reasons. The results carry their producing loop's
# variable rather than `item`, so indexing them by `item` fails at template
# time — and they also carry the request that fetched them, X-Vault-Token
# header included, which an assertion failure would print in full. A pair holds
# exactly what the check needs and nothing that must not be logged.
- name: policies | Assert no OIDC policy can seal, rekey or grant access
  loop: >-
    {{ _var_openbao_oidc_policies | map(attribute='name')
       | zip(_reg_openbao_oidc_policies_final['results']
             | map(attribute='json.data.policy')) | list }}
  loop_control:
    loop_var: _item_openbao_oidc_stored
    label: "{{ _item_openbao_oidc_stored[0] }}"
  vars:
    # Comments stripped before the check, because the policies explain
    # themselves and the explanations contain the very words being searched
    # for. Checking the prose as if it were policy is how a comment reading
    # "sealing stays with the root token" fails an assertion about sealing —
    # the check has to see what the vault sees.
    _openbao_oidc_text: >-
      {{ (_item_openbao_oidc_stored[1] | default('')).split('\n')
         | reject('match', '\\s*#') | join('\n') }}
  ansible.builtin.assert:
    that:
      # The paths that would let a Keycloak session take the vault away from
      # its offline operator.
      - '"sys/seal" not in _openbao_oidc_text'
      - '"sys/unseal" not in _openbao_oidc_text'
      - '"sys/rekey" not in _openbao_oidc_text'
      - '"sys/step-down" not in _openbao_oidc_text'
      - '"auth/*" not in _openbao_oidc_text'
      # `sudo` is the capability that unlocks root-protected paths, and no
      # policy here has any business carrying it. The KV paths legitimately
      # grant create, update and delete, so those cannot be checked this way.
      - '"sudo" not in _openbao_oidc_text'
      # A wildcard at the root grants everything, whatever the capabilities say.
      - '"path \"*\"" not in _openbao_oidc_text'
    fail_msg: >-
      The policy {{ _item_openbao_oidc_stored[0] }} grants a path
      that would let someone who signed in through Keycloak seal the vault,
      rekey it, or change who may log in. Those stay with the root token, so
      that the vault can still be opened on the day Keycloak is the thing that
      is broken — the day someone needs the Keycloak database password this
      vault holds.
    quiet: true
