---

- name: policies | Read the policy currently stored
  changed_when: false

  failed_when: false
  no_log: "{{ openbao_oidc_no_log | bool }}"
  register: _reg_openbao_oidc_policies
  loop: "{{ _var_openbao_oidc_policies }}"
  loop_control:
    loop_var: _item_openbao_oidc_policy
    label: "{{ _item_openbao_oidc_policy['name'] }}"
  ansible.builtin.uri:
    url: >-
      {{ openbao_oidc_url }}/v1/sys/policies/acl/{{
      _item_openbao_oidc_policy['name'] }}
    headers: "{{ _var_openbao_oidc_headers }}"
    ca_path: "{{ openbao_oidc_ca_file }}"
    status_code: [200, 404]

- name: policies | Write the policies that differ
  when: >-
    (_item_openbao_oidc_written[1]['status'] | default(404)) != 200
    or (_item_openbao_oidc_written[1]['json']['data']['policy']
        | default('') | trim)
       != (_item_openbao_oidc_written[0]['policy'] | trim)
  changed_when: true
  no_log: "{{ openbao_oidc_no_log | bool }}"
  loop: >-
    {{ _var_openbao_oidc_policies
       | zip(_reg_openbao_oidc_policies['results']) | list }}
  loop_control:
    loop_var: _item_openbao_oidc_written
    label: "{{ _item_openbao_oidc_written[0]['name'] }}"
  ansible.builtin.uri:
    url: >-
      {{ openbao_oidc_url }}/v1/sys/policies/acl/{{
      _item_openbao_oidc_written[0]['name'] }}
    method: PUT
    headers: "{{ _var_openbao_oidc_headers }}"
    ca_path: "{{ openbao_oidc_ca_file }}"
    body_format: json
    body:
      policy: "{{ _item_openbao_oidc_written[0]['policy'] }}"
    status_code: [200, 204]

- name: policies | Confirm the policies read back
  changed_when: false
  no_log: "{{ openbao_oidc_no_log | bool }}"
  register: _reg_openbao_oidc_policies_final
  loop: "{{ _var_openbao_oidc_policies }}"
  loop_control:
    loop_var: _item_openbao_oidc_policy
    label: "{{ _item_openbao_oidc_policy['name'] }}"
  ansible.builtin.uri:
    url: >-
      {{ openbao_oidc_url }}/v1/sys/policies/acl/{{
      _item_openbao_oidc_policy['name'] }}
    headers: "{{ _var_openbao_oidc_headers }}"
    ca_path: "{{ openbao_oidc_ca_file }}"

- name: policies | Assert no OIDC policy can seal, rekey or grant access
  loop: >-
    {{ _var_openbao_oidc_policies | map(attribute='name')
       | zip(_reg_openbao_oidc_policies_final['results']
             | map(attribute='json.data.policy')) | list }}
  loop_control:
    loop_var: _item_openbao_oidc_stored
    label: "{{ _item_openbao_oidc_stored[0] }}"
  vars:

    _openbao_oidc_text: >-
      {{ _item_openbao_oidc_stored[1] | default('')
         | regex_replace('(?m)^[ \\t]*#.*$', '') }}
  ansible.builtin.assert:
    that:

      - '"sys/seal" not in _openbao_oidc_text'
      - '"sys/unseal" not in _openbao_oidc_text'
      - '"sys/rekey" not in _openbao_oidc_text'
      - '"sys/step-down" not in _openbao_oidc_text'
      - '"auth/*" not in _openbao_oidc_text'

      - '"sudo" not in _openbao_oidc_text'

      - '"path \"*\"" not in _openbao_oidc_text'
    fail_msg: >-
      The policy {{ _item_openbao_oidc_stored[0] }} grants a path
      that would let someone who signed in through Keycloak seal the vault,
      rekey it, or change who may log in. Those stay with the root token, so
      that the vault can still be opened on the day Keycloak is the thing that
      is broken — the day someone needs the Keycloak database password this
      vault holds.
    quiet: true
