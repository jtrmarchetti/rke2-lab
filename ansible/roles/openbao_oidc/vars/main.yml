---
# The root token travels in a header, not in a command line: no process on any
# host ever has it in argv.
_var_openbao_oidc_headers:
  X-Vault-Token: "{{ openbao_oidc_root_token }}"

# The domain CA, read from disk at run time rather than pasted, so a reissued
# CA reaches the vault without anyone remembering to re-copy it. rstrip=false
# because a PEM without its trailing newline is a different byte string, and
# the comparison above would then rewrite the configuration on every run.
_var_openbao_oidc_discovery_ca: >-
  {{ lookup('file', openbao_oidc_discovery_ca_file, rstrip=false) }}

# Callback URLs, absolute. The UI's are relative in the defaults because they
# hang off whatever address the vault answers on; the CLI's is not, because it
# is a listener on the operator's own machine.
_var_openbao_oidc_redirect_uris: >-
  {{ (openbao_oidc_redirect_uris | map('regex_replace', '^',
      openbao_oidc_url) | list) + [openbao_oidc_cli_redirect_uri] }}

# --- The two policies ------------------------------------------------------
#
# Read carefully, because what is *absent* is the design.
#
# Neither policy grants `sys/seal`, `sys/rekey`, `sys/rotate`, or write access
# to `sys/policies` and `auth/*`. Those stay reachable only with the root
# token, which lives offline in the controller's env.sh. So the worst an
# administrator who signs in through Keycloak can do is read and rewrite the
# secrets — which is bad enough to take seriously and is not the same as being
# able to seal the vault, rekey it, or grant themselves a way back in.
#
# That separation is the whole reason this role does not simply hand the
# `root` policy to sso-admins. An identity provider that can mint a root token
# makes Keycloak a component of the vault's own recovery path, and the vault is
# what holds Keycloak's database password.
_var_openbao_oidc_admin_policy: |
  # Full control of the secrets themselves.
  path "{{ openbao_oidc_kv_path }}/data/*" {
    capabilities = ["create", "read", "update", "delete", "list"]
  }
  path "{{ openbao_oidc_kv_path }}/metadata/*" {
    capabilities = ["create", "read", "update", "delete", "list"]
  }
  path "{{ openbao_oidc_kv_path }}/delete/*" {
    capabilities = ["update"]
  }
  path "{{ openbao_oidc_kv_path }}/undelete/*" {
    capabilities = ["update"]
  }

  # Enough of sys and auth to diagnose the vault, and no more. Read-only:
  # sealing, rekeying, and changing who may log in stay with the root token.
  path "sys/mounts" {
    capabilities = ["read", "list"]
  }
  path "sys/health" {
    capabilities = ["read"]
  }
  path "sys/policies/acl" {
    capabilities = ["list"]
  }
  path "sys/policies/acl/*" {
    capabilities = ["read"]
  }
  path "auth" {
    capabilities = ["read", "list"]
  }
  path "identity/*" {
    capabilities = ["read", "list"]
  }

_var_openbao_oidc_user_policy: |
  # Read the secrets, and nothing else. The same access External Secrets has,
  # granted to a person rather than to a ServiceAccount.
  path "{{ openbao_oidc_kv_path }}/data/*" {
    capabilities = ["read"]
  }
  path "{{ openbao_oidc_kv_path }}/metadata/*" {
    capabilities = ["read", "list"]
  }
  path "sys/health" {
    capabilities = ["read"]
  }

_var_openbao_oidc_policies:
  - name: "{{ openbao_oidc_admin_policy }}"
    policy: "{{ _var_openbao_oidc_admin_policy }}"
  - name: "{{ openbao_oidc_user_policy }}"
    policy: "{{ _var_openbao_oidc_user_policy }}"

# The two external identity groups.
#
# External rather than internal, because membership is not held here: the group
# is matched by an alias whose name is the role that arrived in the token, so
# the vault's answer to "who is an administrator" is whatever Keycloak said,
# which is whatever FreeIPA said. There is no third list to keep in step.
_var_openbao_oidc_groups:
  - name: "{{ openbao_oidc_admin_policy }}"
    alias: "{{ openbao_oidc_admin_role }}"
    policies: ["{{ openbao_oidc_admin_policy }}"]
  - name: "{{ openbao_oidc_user_policy }}"
    alias: "{{ openbao_oidc_user_role }}"
    policies: ["{{ openbao_oidc_user_policy }}"]

_var_openbao_oidc_accessor: >-
  {{ (_reg_openbao_oidc_auth_final['json'][openbao_oidc_mount ~ '/']
      | default({}))['accessor'] | default('') }}
