---

- name: main | Assert the inputs this role cannot invent are present
  when: (gitops_bootstrap_enabled | bool)
  ansible.builtin.assert:
    that:
      - (gitops_bootstrap_gitlab_host | length) > 0
    fail_msg: >-
      gitops_bootstrap needs the inventory name of the GitLab host, so it can
      mint an admin token there.
    quiet: true

- name: main | Check the inputs the render and install read from disk are present
  when: (gitops_bootstrap_enabled | bool)
  failed_when: not _reg_gitops_bootstrap_inputs['stat']['exists']
  register: _reg_gitops_bootstrap_inputs
  loop:
    - "{{ gitops_bootstrap_domain_ca_file }}"
    - "{{ gitops_bootstrap_flux | trim | split(' ') | first }}"
    - "{{ gitops_bootstrap_kubectl | trim | split(' ') | first }}"
  loop_control:
    loop_var: _item_gitops_bootstrap_input
    label: "{{ _item_gitops_bootstrap_input }}"
  ansible.builtin.stat:
    path: "{{ _item_gitops_bootstrap_input }}"
    get_checksum: false

- name: main | Install Flux and point it at the repository
  when:
    - (gitops_bootstrap_enabled | bool)

    - not ansible_check_mode
  block:

    - name: main | Ensure the shared GitLab admin token
      ansible.builtin.include_role:
        name: gitlab_admin_token
        apply:
          vars:
            gitlab_admin_token_url: "{{ gitops_bootstrap_gitlab_url }}"
            gitlab_admin_token_host: "{{ gitops_bootstrap_gitlab_host }}"
            gitlab_admin_token_file: "{{ gitops_bootstrap_admin_token_file }}"
            gitlab_admin_token_no_log: "{{ gitops_bootstrap_no_log }}"

    - name: main | Read the recorded admin token from the GitLab host
      delegate_to: "{{ gitops_bootstrap_gitlab_host }}"
      no_log: "{{ gitops_bootstrap_no_log | bool }}"
      register: _reg_gitops_bootstrap_admin_token_raw
      ansible.builtin.slurp:
        src: "{{ gitops_bootstrap_admin_token_file }}"

    - name: main | Ensure the read-only repository token exists
      ansible.builtin.include_tasks: deploy_token.yml

    - name: main | Regenerate the flux-owned folder from the Flux CLI
      ansible.builtin.include_tasks: flux_files.yml

    - name: main | Commit and push the regenerated folder
      ansible.builtin.include_tasks: flux_commit.yml

    - name: main | Install the Flux components and the sync objects
      ansible.builtin.include_tasks: install.yml
