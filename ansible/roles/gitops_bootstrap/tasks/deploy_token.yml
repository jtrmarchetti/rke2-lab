---

- name: deploy_token | Check for a previously recorded token
  register: _reg_gitops_bootstrap_token_file
  ansible.builtin.stat:
    path: "{{ gitops_bootstrap_deploy_token_file }}"
    get_checksum: false

- name: deploy_token | Read the previously recorded token
  when: _reg_gitops_bootstrap_token_file['stat']['exists']
  no_log: "{{ gitops_bootstrap_no_log | bool }}"
  register: _reg_gitops_bootstrap_token_recorded
  ansible.builtin.slurp:
    src: "{{ gitops_bootstrap_deploy_token_file }}"

- name: deploy_token | List the project deploy tokens
  no_log: "{{ gitops_bootstrap_no_log | bool }}"
  register: _reg_gitops_bootstrap_token_list
  ansible.builtin.uri:
    ca_path: "{{ gitops_bootstrap_ca_file }}"
    url: >-
      {{ _var_gitops_bootstrap_api }}/projects/{{
      _var_gitops_bootstrap_project_path }}/deploy_tokens?per_page=100
    headers: "{{ _var_gitops_bootstrap_headers }}"

- name: deploy_token | Decide whether the existing token can be reused
  ansible.builtin.set_fact:
    _gitops_bootstrap_token_reusable: >-
      {{ _reg_gitops_bootstrap_token_file['stat']['exists']
         and (_var_gitops_bootstrap_token_match | length) > 0
         and (gitops_bootstrap_deploy_token_scopes
              | difference(_var_gitops_bootstrap_token_match[0]['scopes'])
              | length) == 0 }}

- name: deploy_token | Report the decision
  ansible.builtin.debug:
    msg: >-
      deploy token '{{ gitops_bootstrap_deploy_token_name }}':
      {{ 'reusing the recorded credential'
         if (_gitops_bootstrap_token_reusable | bool)
         else 'creating a replacement' }}
    verbosity: 0

- name: deploy_token | Replace an unusable token
  when: not (_gitops_bootstrap_token_reusable | bool)
  block:
    - name: deploy_token | Delete the superseded tokens
      changed_when: true
      no_log: "{{ gitops_bootstrap_no_log | bool }}"
      loop: "{{ _var_gitops_bootstrap_token_match }}"
      loop_control:
        loop_var: _item_gitops_bootstrap_token
        label: "{{ _item_gitops_bootstrap_token['name'] }} ({{ _item_gitops_bootstrap_token['id'] }})"
      ansible.builtin.uri:
        ca_path: "{{ gitops_bootstrap_ca_file }}"
        url: >-
          {{ _var_gitops_bootstrap_api }}/projects/{{
          _var_gitops_bootstrap_project_path }}/deploy_tokens/{{ _item_gitops_bootstrap_token['id'] }}
        method: DELETE
        headers: "{{ _var_gitops_bootstrap_headers }}"
        status_code: [204, 404]

    - name: deploy_token | Create the read-only token
      changed_when: true
      no_log: "{{ gitops_bootstrap_no_log | bool }}"
      register: _reg_gitops_bootstrap_token_new
      ansible.builtin.uri:
        ca_path: "{{ gitops_bootstrap_ca_file }}"
        url: >-
          {{ _var_gitops_bootstrap_api }}/projects/{{
          _var_gitops_bootstrap_project_path }}/deploy_tokens
        method: POST
        headers: "{{ _var_gitops_bootstrap_headers }}"

        body_format: json
        body:
          name: "{{ gitops_bootstrap_deploy_token_name }}"
          username: "{{ gitops_bootstrap_deploy_token_name }}"
          scopes: "{{ gitops_bootstrap_deploy_token_scopes }}"
        status_code: [201]

    - name: deploy_token | Record it for later runs
      no_log: "{{ gitops_bootstrap_no_log | bool }}"
      ansible.builtin.copy:
        content: |
          username: {{ _reg_gitops_bootstrap_token_new['json']['username'] }}
          token: {{ _reg_gitops_bootstrap_token_new['json']['token'] }}
        dest: "{{ gitops_bootstrap_deploy_token_file }}"
        mode: "0600"

- name: deploy_token | Prove the token can read the repository
  changed_when: false
  no_log: "{{ gitops_bootstrap_no_log | bool }}"
  ansible.builtin.uri:
    ca_path: "{{ gitops_bootstrap_ca_file }}"
    url: >-
      {{ gitops_bootstrap_gitlab_url }}/{{ gitops_bootstrap_group }}/{{
      gitops_bootstrap_project }}.git/info/refs?service=git-upload-pack
    url_username: "{{ _var_gitops_bootstrap_username }}"
    url_password: "{{ _var_gitops_bootstrap_password }}"
    force_basic_auth: true
    status_code: [200]
