---
_var_gitops_bootstrap_api: "{{ gitops_bootstrap_gitlab_url }}/api/v4"

_var_gitops_bootstrap_project_path: >-
  {{ (gitops_bootstrap_group ~ '/' ~ gitops_bootstrap_project)
     | replace('/', '%2F') }}

_var_gitops_bootstrap_admin_token: >-
  {{ _reg_gitops_bootstrap_admin_token_raw['content'] | b64decode | from_yaml }}
_var_gitops_bootstrap_headers:
  PRIVATE-TOKEN: "{{ _var_gitops_bootstrap_admin_token['token'] }}"

_var_gitops_bootstrap_sealing_keys: >-
  {{ (lookup('file', gitops_bootstrap_sealing_key_file)
      | from_yaml)['items'] }}

_var_gitops_bootstrap_install: >-
  {{ _reg_gitops_bootstrap_installed['rc'] != 0
     or (gitops_bootstrap_force_install | bool) }}

_var_gitops_bootstrap_git_url: >-
  {{ gitops_bootstrap_gitlab_url }}/{{ gitops_bootstrap_group }}/{{
  gitops_bootstrap_project }}.git

_var_gitops_bootstrap_push_url: >-
  {{ gitops_bootstrap_gitlab_url
     | regex_replace('^https://',
                     'https://oauth2:'
                     ~ _var_gitops_bootstrap_admin_token['token'] ~ '@')
  }}/{{ gitops_bootstrap_group }}/{{
  gitops_bootstrap_project }}.git

_var_gitops_bootstrap_flux_dir: >-
  {{ gitops_bootstrap_cluster_dir }}/flux-system

_var_gitops_bootstrap_component_file: >-
  {{ gitops_bootstrap_work_dir }}/{{ gitops_bootstrap_cluster_dir
  }}/flux-system/gotk-components.yaml
_var_gitops_bootstrap_sync_file: >-
  {{ gitops_bootstrap_work_dir }}/{{ gitops_bootstrap_cluster_dir
  }}/flux-system/gotk-sync.yaml

_var_gitops_bootstrap_token_match: >-
  {{ _reg_gitops_bootstrap_token_list['json']
     | selectattr('name', 'equalto', gitops_bootstrap_deploy_token_name)
     | list }}

_var_gitops_bootstrap_username: >-
  {{ _reg_gitops_bootstrap_token_new['json']['username']
     if (_reg_gitops_bootstrap_token_new is defined
         and _reg_gitops_bootstrap_token_new is not skipped
         and 'json' in _reg_gitops_bootstrap_token_new)
     else (_reg_gitops_bootstrap_token_recorded['content']
           | b64decode | from_yaml)['username'] }}
_var_gitops_bootstrap_password: >-
  {{ _reg_gitops_bootstrap_token_new['json']['token']
     if (_reg_gitops_bootstrap_token_new is defined
         and _reg_gitops_bootstrap_token_new is not skipped
         and 'json' in _reg_gitops_bootstrap_token_new)
     else (_reg_gitops_bootstrap_token_recorded['content']
           | b64decode | from_yaml)['token'] }}

_var_gitops_bootstrap_secret:
  apiVersion: v1
  kind: Secret
  type: Opaque
  metadata:
    name: flux-system
    namespace: "{{ gitops_bootstrap_namespace }}"

  data:
    username: "{{ _var_gitops_bootstrap_username | trim | b64encode }}"
    password: "{{ _var_gitops_bootstrap_password | trim | b64encode }}"
    caFile: >-
      {{ lookup('file', gitops_bootstrap_domain_ca_file,
                rstrip=false) | b64encode }}
