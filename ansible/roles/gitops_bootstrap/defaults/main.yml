---
gitops_bootstrap_enabled: true

gitops_bootstrap_gitlab_url: null

gitops_bootstrap_group: platform
gitops_bootstrap_project: cluster-state
gitops_bootstrap_branch: main

gitops_bootstrap_work_dir: >-
  {{ ansible_facts['env']['HOME'] }}/.cache/rke2lab/cluster-state
gitops_bootstrap_cluster_dir: clusters/dev-lo

gitops_bootstrap_deploy_token_name: flux-cluster-state
gitops_bootstrap_deploy_token_scopes:
  - read_repository

gitops_bootstrap_deploy_token_file: >-
  {{ ansible_facts['env']['HOME'] }}/.config/rke2lab/flux-deploy-token.yml

gitops_bootstrap_admin_token_file: /data1/gitlab/admin-token.yml

gitops_bootstrap_domain_ca_file: null

gitops_bootstrap_ca_file: /etc/ssl/certs/ca-certificates.crt

gitops_bootstrap_namespace: flux-system

gitops_bootstrap_sealing_key_file: >-
  {{ ansible_facts['env']['HOME'] }}/.config/rke2lab/sealed-secrets-key.yaml

gitops_bootstrap_sealing_key_label: >-
  sealedsecrets.bitnami.com/sealed-secrets-key=active

gitops_bootstrap_kubectl: >-
  {{ ansible_facts['env']['HOME'] }}/.local/bin/kubectl
  --kubeconfig {{ ansible_facts['env']['HOME'] }}/.kube/dev-lo.config

gitops_bootstrap_force_install: false

gitops_bootstrap_controllers:
  - source-controller
  - kustomize-controller
  - helm-controller
  - notification-controller

gitops_bootstrap_ready_timeout: 600

gitops_bootstrap_no_log: true
