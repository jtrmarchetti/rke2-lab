---
# Configures the vault for the one consumer it has: External Secrets Operator.
#
# Three things, and the third is the interesting one:
#
#   - A KV v2 secrets engine at a known path, which is where runtime secrets
#     live.
#   - A policy granting read access to it, and nothing else.
#   - The Kubernetes auth method, so ESO authenticates with the ServiceAccount
#     token the API server already issues it. That is the reason to prefer it
#     over a token or an AppRole: there is no static credential to store
#     anywhere, nothing to rotate, and nothing for the bootstrap problem to be
#     about. Sealed Secrets covers material that genuinely predates the vault,
#     and with Kubernetes auth that turns out to be almost nothing.
#
# Driven over the vault's own HTTPS API through its ingress, rather than by
# exec'ing into the pod. Three reasons, and the first is the one that decided
# it: `kubectl exec` does not carry the caller's environment into the
# container, so a token passed that way arrives nowhere and the vault answers
# 403 — which reads as a policy problem rather than a plumbing one. The API is
# also what every other client uses, so this exercises the ingress, the
# certificate the cluster issued for it, and the DNS delegation that resolves
# it, rather than bypassing all three.
#
# Everything is read before it is written, so a second run reports no change.

- name: main | Assert the required inputs are present
  ansible.builtin.assert:
    that:
      - (openbao_config_root_token | length) > 0
      - (openbao_config_url | length) > 0
      - (openbao_config_kv_path | length) > 0
    fail_msg: >-
      openbao_config needs the root token, which the openbao_init role wrote to
      ~/.config/rke2lab/env.sh as OPENBAO_ROOT_TOKEN. Run
      `source ~/.config/rke2lab/env.sh` first.
    quiet: true

- name: main | Read the enabled secrets engines
  no_log: "{{ openbao_config_no_log | bool }}"
  register: _reg_openbao_config_engines
  ansible.builtin.uri:
    url: "{{ openbao_config_url }}/v1/sys/mounts"
    headers: "{{ _var_openbao_config_headers }}"
    ca_path: "{{ openbao_config_ca_file }}"

- name: main | Enable the KV version 2 secrets engine
  when: >-
    (openbao_config_kv_path ~ '/') not in _reg_openbao_config_engines['json']
  no_log: "{{ openbao_config_no_log | bool }}"
  ansible.builtin.uri:
    url: >-
      {{ openbao_config_url }}/v1/sys/mounts/{{ openbao_config_kv_path }}
    method: POST
    headers: "{{ _var_openbao_config_headers }}"
    ca_path: "{{ openbao_config_ca_file }}"
    body_format: json
    body:
      type: kv
      options:
        version: "2"
    status_code: [200, 204]

- name: main | Read the enabled authentication methods
  no_log: "{{ openbao_config_no_log | bool }}"
  register: _reg_openbao_config_auth
  ansible.builtin.uri:
    url: "{{ openbao_config_url }}/v1/sys/auth"
    headers: "{{ _var_openbao_config_headers }}"
    ca_path: "{{ openbao_config_ca_file }}"

- name: main | Enable the Kubernetes authentication method
  when: "'kubernetes/' not in _reg_openbao_config_auth['json']"
  no_log: "{{ openbao_config_no_log | bool }}"
  ansible.builtin.uri:
    url: "{{ openbao_config_url }}/v1/sys/auth/kubernetes"
    method: POST
    headers: "{{ _var_openbao_config_headers }}"
    ca_path: "{{ openbao_config_ca_file }}"
    body_format: json
    body:
      type: kubernetes
    status_code: [200, 204]

# The cluster's own CA, read from the ConfigMap the API server publishes into
# every namespace for exactly this purpose. Taken from the cluster rather than
# named in inventory: it rotates when the cluster's CA rotates, and a stale
# copy here would fail authentication long after anyone remembered why.
- name: main | Read the cluster's API server certificate authority
  changed_when: false
  register: _reg_openbao_config_cluster_ca
  ansible.builtin.command:
    cmd: >-
      {{ openbao_config_kubectl }} get configmap kube-root-ca.crt
      -n {{ openbao_config_namespace }} -o jsonpath={.data.ca\.crt}

# Read before write, so a run that changes nothing reports nothing. These are
# all PUT/POST endpoints that succeed whether or not the value differs, so
# `changed_when: true` was the only honest answer without a comparison — at the
# cost of a role that could never report a clean second run.
- name: main | Read the current Kubernetes auth configuration
  changed_when: false
  # Absent until the first write, which is not an error.
  failed_when: false
  no_log: "{{ openbao_config_no_log | bool }}"
  register: _reg_openbao_config_auth
  ansible.builtin.uri:
    url: "{{ openbao_config_url }}/v1/auth/kubernetes/config"
    headers: "{{ _var_openbao_config_headers }}"
    ca_path: "{{ openbao_config_ca_file }}"
    status_code: [200, 404]

- name: main | Point the Kubernetes auth method at this cluster
  when: >-
    (_reg_openbao_config_auth['status'] | default(404)) != 200
    or (_reg_openbao_config_auth['json']['data']['kubernetes_host']
        | default('')) != openbao_config_kubernetes_host
    or (_reg_openbao_config_auth['json']['data']['kubernetes_ca_cert']
        | default('') | trim)
       != (_reg_openbao_config_cluster_ca['stdout'] | trim)
  changed_when: true
  no_log: "{{ openbao_config_no_log | bool }}"
  ansible.builtin.uri:
    url: "{{ openbao_config_url }}/v1/auth/kubernetes/config"
    method: POST
    headers: "{{ _var_openbao_config_headers }}"
    ca_path: "{{ openbao_config_ca_file }}"
    body_format: json
    body:
      kubernetes_host: "{{ openbao_config_kubernetes_host }}"
      kubernetes_ca_cert: "{{ _reg_openbao_config_cluster_ca['stdout'] }}"
    status_code: [200, 204]

- name: main | Read the policy currently stored
  changed_when: false
  # Absent before the first write.
  failed_when: false
  no_log: "{{ openbao_config_no_log | bool }}"
  register: _reg_openbao_config_policy
  ansible.builtin.uri:
    url: >-
      {{ openbao_config_url }}/v1/sys/policies/acl/{{
      openbao_config_policy_name }}
    headers: "{{ _var_openbao_config_headers }}"
    ca_path: "{{ openbao_config_ca_file }}"
    status_code: [200, 404]

- name: main | Write the read-only policy for the secrets operator
  when: >-
    (_reg_openbao_config_policy['status'] | default(404)) != 200
    or (_reg_openbao_config_policy['json']['data']['policy']
        | default('') | trim) != (_var_openbao_config_policy | trim)
  changed_when: true
  no_log: "{{ openbao_config_no_log | bool }}"
  ansible.builtin.uri:
    url: >-
      {{ openbao_config_url }}/v1/sys/policies/acl/{{
      openbao_config_policy_name }}
    method: PUT
    headers: "{{ _var_openbao_config_headers }}"
    ca_path: "{{ openbao_config_ca_file }}"
    body_format: json
    body:
      policy: "{{ _var_openbao_config_policy }}"
    status_code: [200, 204]

# Bound to one ServiceAccount in one namespace. A role bound to '*' would let
# any pod in the cluster read every secret this policy covers, which is the
# failure this auth method is otherwise good at avoiding.
- name: main | Read the role binding currently stored
  changed_when: false
  # Absent before the first write.
  failed_when: false
  no_log: "{{ openbao_config_no_log | bool }}"
  register: _reg_openbao_config_binding
  ansible.builtin.uri:
    url: >-
      {{ openbao_config_url }}/v1/auth/kubernetes/role/{{
      openbao_config_role_name }}
    headers: "{{ _var_openbao_config_headers }}"
    ca_path: "{{ openbao_config_ca_file }}"
    status_code: [200, 404]

- name: main | Bind the operator's service account to the policy
  when: >-
    (_reg_openbao_config_binding['status'] | default(404)) != 200
    or (_reg_openbao_config_binding['json']['data']
        | default({})) | dict2items | selectattr('key', 'in',
        ['bound_service_account_names', 'bound_service_account_namespaces',
         'token_policies']) | items2dict
       != {'bound_service_account_names': [openbao_config_service_account],
           'bound_service_account_namespaces': [openbao_config_namespace],
           'token_policies': [openbao_config_policy_name]}
  changed_when: true
  no_log: "{{ openbao_config_no_log | bool }}"
  ansible.builtin.uri:
    url: >-
      {{ openbao_config_url }}/v1/auth/kubernetes/role/{{
      openbao_config_role_name }}
    method: POST
    headers: "{{ _var_openbao_config_headers }}"
    ca_path: "{{ openbao_config_ca_file }}"
    body_format: json
    body:
      bound_service_account_names: "{{ openbao_config_service_account }}"
      bound_service_account_namespaces: "{{ openbao_config_namespace }}"
      token_policies: "{{ openbao_config_policy_name }}"
      token_ttl: "{{ openbao_config_token_ttl }}"
    status_code: [200, 204]

- name: main | Confirm the role reads back
  no_log: "{{ openbao_config_no_log | bool }}"
  register: _reg_openbao_config_role
  ansible.builtin.uri:
    url: >-
      {{ openbao_config_url }}/v1/auth/kubernetes/role/{{
      openbao_config_role_name }}
    headers: "{{ _var_openbao_config_headers }}"
    ca_path: "{{ openbao_config_ca_file }}"

- name: main | Assert the role is bound as narrowly as intended
  vars:
    _openbao_config_bound: "{{ _reg_openbao_config_role['json']['data'] }}"
  ansible.builtin.assert:
    that:
      - >-
        openbao_config_service_account in
        _openbao_config_bound['bound_service_account_names']
      - >-
        openbao_config_namespace in
        _openbao_config_bound['bound_service_account_namespaces']
      - >-
        '*' not in _openbao_config_bound['bound_service_account_namespaces']
    fail_msg: >-
      The {{ openbao_config_role_name }} role is not bound to
      {{ openbao_config_service_account }} in {{ openbao_config_namespace }}
      alone. A wider binding lets any pod that can be scheduled read every
      secret this policy covers.
    quiet: true
