---
argument_specs:
  main:
    short_description: Configure OpenBao for External Secrets Operator
    description:
      - Enables a KV version 2 engine, writes a read-only policy for it, and
        enables the Kubernetes auth method bound to one ServiceAccount in one
        namespace.
      - Asserts the binding is narrow, because a role bound to every namespace
        lets any schedulable pod read every secret the policy covers.
    options:
      openbao_config_enabled:
        type: bool
        default: true
        description: Whether the role does anything.
      openbao_config_url:
        type: str
        description: The vault's API, through its ingress.
      openbao_config_ca_file:
        type: str
        description: CA bundle the vault's certificate is verified against.
      openbao_config_kubernetes_host:
        type: str
        description: API server address as the vault reaches it.
      openbao_config_kubectl:
        type: str
        description: kubectl invocation, used to read the cluster's CA.
      openbao_config_root_token:
        type: str
        required: true
        description:
          - Root token, written to the controller environment by openbao_init.
      openbao_config_kv_path:
        type: str
        default: kv
        description: Mount path of the KV version 2 engine.
      openbao_config_namespace:
        type: str
        default: external-secrets
        description: Namespace the operator runs in.
      openbao_config_service_account:
        type: str
        default: external-secrets
        description: ServiceAccount the operator authenticates as.
      openbao_config_role_name:
        type: str
        default: external-secrets
        description: Kubernetes auth role name.
      openbao_config_policy_name:
        type: str
        default: external-secrets-read
        description: Policy granting read access to the KV engine.
      openbao_config_token_ttl:
        type: str
        default: 24h
        description: Lifetime of tokens the role issues.
      openbao_config_no_log:
        type: bool
        default: true
        description: Set false only when debugging; it prints the root token.
