---
_var_time_sync_config_path: /etc/chrony/chrony.conf
_var_time_sync_service_name: chrony
# Ubuntu ships the unit here. Its presence is what distinguishes "timesyncd is
# installed and needs stopping" from "chrony already displaced it", which the
# masked unit name alone does not.
_var_time_sync_timesyncd_unit: /usr/lib/systemd/system/systemd-timesyncd.service

# Templates for this role live in ansible/files/time_sync/ rather than
# inside the role, so the tree that renders a host's configuration can
# be read without opening the role.
_var_time_sync_files_dir: "{{ role_path | dirname | dirname }}/files/time_sync"
