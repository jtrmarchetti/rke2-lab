---

- name: main | Assert the container storage base is on the data volume
  when: (container_storage_enabled | bool)
  ansible.builtin.assert:
    that:
      - container_storage_base is match('^/.+')
      - container_storage_docker_root is match(_var_container_storage_base_re)
      - container_storage_containerd_root is match(_var_container_storage_base_re)
      - container_storage_base in _var_container_storage_mountpoints
    fail_msg: >-
      {{ container_storage_base }} is not a mounted filesystem on this host, or
      the configured roots do not sit under it. Run the data_volume role first:
      relocating the daemons onto an unmounted path just moves the problem to a
      different directory on the same OS disk.
    quiet: true

- name: main | List the systemd unit files # noqa: command-instead-of-module
  when: (container_storage_enabled | bool)
  changed_when: false
  register: _reg_container_storage_unit_files
  ansible.builtin.command:
    cmd: systemctl list-unit-files --no-legend --no-pager

- name: main | Record which container units are present
  when: (container_storage_enabled | bool)
  ansible.builtin.set_fact:
    _container_storage_present_units: >-
      {{ _var_container_storage_units
         | select('in', _reg_container_storage_unit_files['stdout']
                        | regex_findall('(?m)^(\S+)'))
         | list }}

- name: main | Ensure the daemon configuration directories exist
  when: (container_storage_enabled | bool)
  loop:
    - "{{ _var_container_storage_docker_config | dirname }}"
    - "{{ _var_container_storage_containerd_config | dirname }}"
  loop_control:
    loop_var: _item_container_storage_config_dir
  ansible.builtin.file:
    path: "{{ _item_container_storage_config_dir }}"
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: main | Ensure the Docker daemon stores its state on the data volume
  when: (container_storage_enabled | bool)
  register: _reg_container_storage_docker_config_result
  ansible.builtin.template:
    src: "{{ container_storage_docker_template }}"
    dest: "{{ _var_container_storage_docker_config }}"
    owner: root
    group: root
    mode: "0644"

- name: main | Ensure containerd stores its state on the data volume
  when: (container_storage_enabled | bool)
  register: _reg_container_storage_containerd_config_result
  ansible.builtin.template:
    src: "{{ container_storage_containerd_template }}"
    dest: "{{ _var_container_storage_containerd_config }}"
    owner: root
    group: root
    mode: "0644"

- name: main | Include the migration tasks
  when:
    - (container_storage_enabled | bool)
    - (container_storage_migrate | bool)
    - not ansible_check_mode
  ansible.builtin.include_tasks: migrate.yml

- name: main | Restart the container daemons when only the configuration changed
  when:
    - (container_storage_enabled | bool)
    - not ansible_check_mode
    - _container_storage_migrated is not defined
    - >-
      _reg_container_storage_docker_config_result is changed or
      _reg_container_storage_containerd_config_result is changed
    - _item_container_storage_unit in _container_storage_present_units
  loop: "{{ _var_container_storage_units | reverse | list }}"
  loop_control:
    loop_var: _item_container_storage_unit
  ansible.builtin.systemd_service:
    name: "{{ _item_container_storage_unit }}"
    state: restarted

- name: main | Remove the rollback copies of the previous container roots
  when:
    - (container_storage_enabled | bool)
    - (container_storage_remove_rollback | bool)
    - not ansible_check_mode
  loop: "{{ _var_container_storage_moves }}"
  loop_control:
    loop_var: _item_container_storage_move
    label: "{{ _item_container_storage_move['name'] }}"
  ansible.builtin.file:
    path: "{{ _item_container_storage_move['src'] }}.migrated"
    state: absent
