---

- name: migrate | Determine which roots still hold data at the default path
  register: _reg_container_storage_src_stat
  loop: "{{ _var_container_storage_moves }}"
  loop_control:
    loop_var: _item_container_storage_move
    label: "{{ _item_container_storage_move['name'] }}"
  ansible.builtin.stat:
    path: "{{ _item_container_storage_move['src'] }}"

- name: migrate | Determine which destination roots already exist
  register: _reg_container_storage_dest_stat
  loop: "{{ _var_container_storage_moves }}"
  loop_control:
    loop_var: _item_container_storage_move
    label: "{{ _item_container_storage_move['name'] }}"
  ansible.builtin.stat:
    path: "{{ _item_container_storage_move['dest'] }}"

- name: migrate | Select the roots that need relocating
  ansible.builtin.set_fact:
    _container_storage_pending: >-
      {{ _var_container_storage_moves
         | zip(_reg_container_storage_src_stat['results'],
               _reg_container_storage_dest_stat['results'])
         | selectattr('1.stat.exists')
         | selectattr('1.stat.isdir')
         | rejectattr('1.stat.islnk')
         | rejectattr('2.stat.exists')
         | map(attribute='0')
         | list }}

- name: migrate | Report what will be relocated
  ansible.builtin.debug:
    msg: >-
      {{ (_container_storage_pending | length) }} container root(s) to
      relocate onto {{ container_storage_base }}:
      {{ _container_storage_pending | map(attribute='name') | join(', ')
         | default('none', true) }}

- name: migrate | Relocate the container roots onto the data volume
  when: (_container_storage_pending | length) > 0
  block:

    - name: migrate | Find the compose file in each project directory
      register: _reg_container_storage_compose_find
      loop: "{{ container_storage_graceful_compose_dirs }}"
      loop_control:
        loop_var: _item_container_storage_project
      ansible.builtin.find:
        paths: "{{ _item_container_storage_project }}"
        patterns:
          - "docker-compose*.yml"
          - "docker-compose*.yaml"
          - "compose*.yml"
          - "compose*.yaml"
        file_type: file

    - name: migrate | Assert every compose project directory yielded a file
      loop: "{{ _reg_container_storage_compose_find['results'] }}"
      loop_control:
        loop_var: _item_container_storage_found
        label: >-
          {{ _item_container_storage_found['_item_container_storage_project'] }}
      ansible.builtin.assert:
        that:
          - (_item_container_storage_found['files'] | length) > 0
        fail_msg: >-
          No compose file found in {{ _item_container_storage_found['_item_container_storage_project'] }}. The daemons are about to
          be stopped and anything running there would be killed on the daemon's
          own 15 second timeout instead of its stop_grace_period.
        quiet: true

    - name: migrate | Record the discovered compose files
      ansible.builtin.set_fact:
        _container_storage_compose_files: >-
          {{ _reg_container_storage_compose_find['results']
             | map(attribute='files') | flatten
             | map(attribute='path') | list }}

    - name: migrate | Stop the compose projects gracefully
      changed_when: true
      loop: "{{ _container_storage_compose_files }}"
      loop_control:
        loop_var: _item_container_storage_compose_file
      ansible.builtin.command:
        cmd: >-
          docker compose -f {{ _item_container_storage_compose_file }}
          stop --timeout {{ container_storage_compose_stop_timeout }}

    - name: migrate | Stop the container daemons
      when: _item_container_storage_unit in _container_storage_present_units
      loop: "{{ _var_container_storage_units }}"
      loop_control:
        loop_var: _item_container_storage_unit
      ansible.builtin.systemd_service:
        name: "{{ _item_container_storage_unit }}"
        state: stopped

    - name: migrate | Confirm no container daemon process survives
      changed_when: false
      failed_when: _reg_container_storage_pgrep['rc'] == 0
      register: _reg_container_storage_pgrep
      until: _reg_container_storage_pgrep['rc'] != 0
      retries: 6
      delay: 5
      loop:
        - dockerd
        - containerd
      loop_control:
        loop_var: _item_container_storage_daemon
      ansible.builtin.command:
        cmd: pgrep -x "{{ _item_container_storage_daemon }}"

    - name: migrate | Copy each root onto the data volume # noqa: command-instead-of-module
      loop: "{{ _container_storage_pending }}"
      loop_control:
        loop_var: _item_container_storage_pending
        label: "{{ _item_container_storage_pending['name'] }} -> {{ _item_container_storage_pending['dest'] }}"
      ansible.builtin.command:
        cmd: rsync -aHAX --numeric-ids {{ _item_container_storage_pending['src'] }}/ {{ _item_container_storage_pending['dest'] }}/
        creates: "{{ _item_container_storage_pending['dest'] }}"

    - name: migrate | Ensure the relocated roots carry the daemon's own mode
      loop: "{{ _container_storage_pending }}"
      loop_control:
        loop_var: _item_container_storage_pending
        label: "{{ _item_container_storage_pending['name'] }}"
      ansible.builtin.file:
        path: "{{ _item_container_storage_pending['dest'] }}"
        state: directory
        owner: root
        group: root
        mode: "{{ _item_container_storage_pending['mode'] }}"

    - name: migrate | Set the old root aside as a rollback copy
      loop: "{{ _container_storage_pending }}"
      loop_control:
        loop_var: _item_container_storage_pending
        label: "{{ _item_container_storage_pending['name'] }}"
      ansible.builtin.command:
        cmd: mv {{ _item_container_storage_pending['src'] }} {{ _item_container_storage_pending['src'] }}.migrated
        creates: "{{ _item_container_storage_pending['src'] }}.migrated"

    - name: migrate | Record that a migration happened
      ansible.builtin.set_fact:
        _container_storage_migrated: true

  always:
    - name: migrate | Start the container daemons
      when: _item_container_storage_unit in _container_storage_present_units
      loop: "{{ _var_container_storage_units | reverse | list }}"
      loop_control:
        loop_var: _item_container_storage_unit
      ansible.builtin.systemd_service:
        name: "{{ _item_container_storage_unit }}"
        state: started

    - name: migrate | Bring the compose projects back up
      changed_when: true
      loop: "{{ _container_storage_compose_files | default([]) }}"
      loop_control:
        loop_var: _item_container_storage_compose_file
      ansible.builtin.command:
        cmd: docker compose -f {{ _item_container_storage_compose_file }} up -d

- name: migrate | Confirm the Docker daemon is using the relocated root
  when: "'docker.service' in _container_storage_present_units"
  changed_when: false
  register: _reg_container_storage_docker_info
  until:
    - _reg_container_storage_docker_info['rc'] == 0
    - >-
      (_reg_container_storage_docker_info['stdout'] | trim)
      == container_storage_docker_root
  retries: 12
  delay: 5
  ansible.builtin.command:
    cmd: docker info --format '{% raw %}{{ .DockerRootDir }}{% endraw %}'
