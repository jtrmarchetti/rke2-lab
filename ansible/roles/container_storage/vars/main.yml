---
# Kept here rather than inline in the assert, so the assertion stays inside the
# line length ANSIBLE_STANDARDS.md sets.
_var_container_storage_base_re: "^{{ container_storage_base }}/"
_var_container_storage_mountpoints: >-
  {{ ansible_facts['mounts'] | map(attribute='mount') | list }}

_var_container_storage_docker_config: /etc/docker/daemon.json
_var_container_storage_containerd_config: /etc/containerd/config.toml

# Stopped in this order and started in reverse. Docker depends on containerd,
# and docker.socket restarts docker on the next connection, so it has to go
# down with the service or the migration races a daemon coming back up under
# it.
_var_container_storage_units:
  - docker.socket
  - docker.service
  - containerd.service

_var_container_storage_moves:
  - name: docker
    src: /var/lib/docker
    dest: "{{ container_storage_docker_root }}"
    mode: "{{ container_storage_docker_mode }}"
  - name: containerd
    src: /var/lib/containerd
    dest: "{{ container_storage_containerd_root }}"
    mode: "{{ container_storage_containerd_mode }}"

# Templates for this role live in ansible/files/container_storage/ rather than
# inside the role, so the tree that renders a host's configuration can
# be read without opening the role.
_var_container_storage_files_dir: "{{ role_path | dirname | dirname }}/files/container_storage"
