---
# The controller's end of the tunnel into 192.168.2.0/24.
#
# Ordering here is not arbitrary. The tooling comes first because the key
# derivation shells out to `wg`; the keys come before the interface because the
# rendered configuration contains both of them; and validation is last and off
# by default in the play that configures this end, because the far end of the
# tunnel does not exist yet when this end is written.

- name: main | Ensure the WireGuard tooling is installed
  when: (controller_tunnel_enabled | bool)
  ansible.builtin.include_tasks: packages.yml

- name: main | Resolve both ends' public keys
  when: (controller_tunnel_enabled | bool)
  ansible.builtin.include_tasks: keys.yml

- name: main | Configure the WireGuard interface
  when:
    - (controller_tunnel_enabled | bool)
    - (controller_tunnel_configure_enabled | bool)
  ansible.builtin.include_tasks: interface.yml

- name: main | Prove the tunnel carries traffic
  when:
    - (controller_tunnel_enabled | bool)
    - (controller_tunnel_validate_enabled | bool)
  ansible.builtin.include_tasks: validate.yml
