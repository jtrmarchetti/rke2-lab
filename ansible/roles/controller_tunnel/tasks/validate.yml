---
# Proof that the tunnel carries traffic, which plan/PROXMOX.md asked for in
# Phase 1 and nothing ever delivered.
#
# The three checks are deliberately different questions, and each one fails
# where the fault actually is rather than three playbooks later:
#
#   1. The interface exists and the gateway is a peer of it.  — this end
#   2. The gateway has completed a handshake.                 — both ends, keys
#   3. An internal address answers on a TCP port.             — forwarding, SNAT
#
# Without them, a gateway that is up but not forwarding shows up as every
# subsequent playbook timing out against an internal host, with an error that
# names the host and says nothing about the path to it.

- name: validate | Read the interface state
  changed_when: false
  failed_when: false
  check_mode: false
  register: _reg_controller_tunnel_show
  ansible.builtin.command:
    cmd: "wg show {{ controller_tunnel_interface }} latest-handshakes"

- name: validate | Assert the interface is up and the gateway is a peer
  ansible.builtin.assert:
    that:
      - _reg_controller_tunnel_show['rc'] == 0
      - controller_tunnel_gateway_public_key
        in _reg_controller_tunnel_show['stdout']
    fail_msg: >-
      The WireGuard interface {{ controller_tunnel_interface }} is not up, or
      the gateway is not configured as a peer of it. Re-run this playbook with
      controller_tunnel_configure_enabled left at its default, and check
      `systemctl status {{ _var_controller_tunnel_service }}`.
    quiet: true

# `latest-handshakes` reports a Unix timestamp per peer, and 0 means the peers
# have never spoken. That is the signature of mismatched keys — the interface
# comes up regardless, because WireGuard has no connection to fail to make.
#
# Retried rather than asserted once: PersistentKeepalive is 25 seconds, so a
# tunnel that has just been restarted has legitimately not handshaken yet, and
# a single check would fail on exactly the run that fixed it.
- name: validate | Wait for a completed handshake with the gateway
  when: not ansible_check_mode
  changed_when: false
  until: >-
    _reg_controller_tunnel_handshake['stdout'] | trim | length > 0
    and (_reg_controller_tunnel_handshake['stdout'] | trim | int) > 0
  retries: 6
  delay: 5
  register: _reg_controller_tunnel_handshake
  ansible.builtin.shell:
    cmd: >-
      set -o pipefail;
      wg show {{ controller_tunnel_interface }} latest-handshakes
      | awk '$1 == "{{ controller_tunnel_gateway_public_key }}" { print $2 }'
    executable: /bin/bash

# The check the other two cannot make. A handshake proves the peers agree on
# keys; it says nothing about whether the gateway forwards into
# 192.168.2.0/24 or SNATs the reply, which are separate settings on the far end
# and are what actually carry every Ansible connection after this playbook.
- name: validate | Prove an internal address is reachable through the tunnel
  when:
    - not ansible_check_mode
    - controller_tunnel_validate_address is not none
  ansible.builtin.wait_for:
    host: "{{ controller_tunnel_validate_address }}"
    port: "{{ controller_tunnel_validate_port | int }}"
    timeout: "{{ controller_tunnel_validate_timeout | int }}"
    msg: >-
      The tunnel handshakes but {{ controller_tunnel_validate_address }}:{{
      controller_tunnel_validate_port }} does not answer through it. The fault
      is on the gateway rather than here: check that IPv4 forwarding is on and
      that the POSTROUTING masquerade rule for the tunnel subnet is present —
      `sysctl net.ipv4.ip_forward` and `iptables -t nat -L POSTROUTING -n` on
      the gateway host.
