---
# Generates the intermediate's key here and has FreeIPA sign it.
#
# The key is written with mode 0600 into the controller's own configuration
# directory and never leaves this host in plaintext. What crosses to the
# identity host is a CSR, and what comes back is a certificate — both public.

- name: issue | Check whether the intermediate already exists
  register: _reg_ipa_sub_ca_existing
  ansible.builtin.stat:
    path: "{{ _var_ipa_sub_ca_crt }}"

- name: issue | Read the existing intermediate
  when: (_reg_ipa_sub_ca_existing['stat']['exists'] | bool)
  register: _reg_ipa_sub_ca_info
  community.crypto.x509_certificate_info:
    path: "{{ _var_ipa_sub_ca_crt }}"
    valid_at:
      renewal: "+{{ ipa_sub_ca_renew_before_days }}d"

# Reissue when there is no certificate or when it expires inside the renewal
# window. Presence alone is not enough: a CA certificate that is only ever
# checked for existence expires silently, and takes every certificate it signed
# with it.
#
# Expiry alone is not the whole of "must be issued". The domain root this CA
# is signed by is not immortal: a rebuild of the identity host — or a root
# rollover — issues a new root with the same subject, and every intermediate
# the old root signed is still unexpired but chains to nothing anyone trusts.
# Expiry checks the clock; this checks the chain. It can only run where the
# domain CA itself is present on this host, which is why it is optional:
# without it the gate falls back to expiry alone.
- name: issue | Stat the domain CA against which the chain is verified
  when: (ipa_sub_ca_domain_ca_file | length) > 0
  register: _reg_ipa_sub_ca_domain_ca
  ansible.builtin.stat:
    path: "{{ ipa_sub_ca_domain_ca_file }}"

- name: issue | Check that the existing intermediate chains to the domain CA
  when:
    - (_reg_ipa_sub_ca_existing['stat']['exists'] | bool)
    - (ipa_sub_ca_domain_ca_file | length) > 0
    - (_reg_ipa_sub_ca_domain_ca['stat']['exists'] | bool)
  changed_when: false
  register: _reg_ipa_sub_ca_chain
  failed_when: false
  ansible.builtin.command:
    cmd: >-
      openssl verify
      -CAfile {{ ipa_sub_ca_domain_ca_file }}
      {{ _var_ipa_sub_ca_crt }}

- name: issue | Determine whether the intermediate must be issued
  ansible.builtin.set_fact:
    _ipa_sub_ca_needed: >-
      {{ (not _reg_ipa_sub_ca_existing['stat']['exists'])
         or (not (_reg_ipa_sub_ca_info['valid_at']['renewal'] | default(false)))
         or (_reg_ipa_sub_ca_chain is defined
             and not (_reg_ipa_sub_ca_chain['skipped'] | default(false))
             and (_reg_ipa_sub_ca_chain['rc'] | default(1)) != 0) }}

- name: issue | Report the issuance decision
  ansible.builtin.debug:
    msg: >-
      {{ ipa_sub_ca_common_name }}: issue required =
      {{ _ipa_sub_ca_needed }}
    verbosity: 0

- name: issue | Issue the intermediate from the domain certificate authority
  when: (_ipa_sub_ca_needed | bool)
  block:
    - name: issue | Ensure the intermediate private key is present
      community.crypto.openssl_privatekey:
        path: "{{ _var_ipa_sub_ca_key }}"
        size: "{{ ipa_sub_ca_key_size | int }}"
        type: RSA
        mode: "0600"

    # No subject alternative name. A CA certificate is not presented for a
    # hostname, and FreeIPA validates every SAN against a principal — a SAN
    # here would add a constraint that buys nothing.
    - name: issue | Ensure the signing request is present
      community.crypto.openssl_csr:
        path: "{{ _var_ipa_sub_ca_csr }}"
        privatekey_path: "{{ _var_ipa_sub_ca_key }}"
        common_name: "{{ ipa_sub_ca_common_name }}"
        basic_constraints:
          - "CA:TRUE"
          - "pathlen:0"
        basic_constraints_critical: true
        key_usage:
          - keyCertSign
          - cRLSign
          - digitalSignature
        key_usage_critical: true
        mode: "0644"

    - name: issue | Read the signing request
      register: _reg_ipa_sub_ca_csr_content
      ansible.builtin.slurp:
        src: "{{ _var_ipa_sub_ca_csr }}"

    # --chain returns the issuing CA with the certificate, which is what makes
    # the result a usable chain rather than a certificate whose issuer the
    # cluster would have to be told about separately.
    - name: issue | Sign the request against the domain certificate authority
      changed_when: true
      delegate_to: "{{ ipa_sub_ca_ipa_host }}"
      no_log: "{{ ipa_sub_ca_no_log | bool }}"
      register: _reg_ipa_sub_ca_signed
      ansible.builtin.shell:
        cmd: |
          docker exec -i {{ ipa_sub_ca_ipa_container }} bash -c '
            set -e
            cat > {{ _var_ipa_sub_ca_remote_csr | trim }}
            echo "{{ ipa_sub_ca_admin_password | b64encode }}" |
              base64 -d | kinit {{ ipa_sub_ca_admin_user }} >/dev/null
            ipa cert-request {{ _var_ipa_sub_ca_remote_csr | trim }} \
              --principal host/{{ ipa_sub_ca_common_name }} \
              --profile-id {{ ipa_sub_ca_profile_id }} \
              --certificate-out={{ _var_ipa_sub_ca_remote_crt | trim }} \
              >/dev/null
            cat {{ _var_ipa_sub_ca_remote_crt | trim }}
            rm -f {{ _var_ipa_sub_ca_remote_csr | trim }} \
              {{ _var_ipa_sub_ca_remote_crt | trim }}'
        stdin: "{{ _reg_ipa_sub_ca_csr_content['content'] | b64decode }}"

    - name: issue | Ensure the issued intermediate is present
      ansible.builtin.copy:
        content: "{{ _reg_ipa_sub_ca_signed['stdout'] }}\n"
        dest: "{{ _var_ipa_sub_ca_crt }}"
        mode: "0644"

# Proves what was issued rather than trusting that the profile did its job. A
# profile whose basic constraints did not apply returns a perfectly valid leaf
# certificate, and cert-manager would accept it as an issuer and then fail on
# every certificate it tried to sign — far from here, and looking like a
# cert-manager fault.
- name: issue | Read the issued intermediate
  register: _reg_ipa_sub_ca_issued
  community.crypto.x509_certificate_info:
    path: "{{ _var_ipa_sub_ca_crt }}"

- name: issue | Assert the issued certificate is a certificate authority
  ansible.builtin.assert:
    that:
      - _reg_ipa_sub_ca_issued['basic_constraints'] is defined
      - "'CA:TRUE' in _reg_ipa_sub_ca_issued['basic_constraints']"
      - "'pathlen:0' in _reg_ipa_sub_ca_issued['basic_constraints']"
      # The long names openssl prints, which is what this module reports —
      # not the keyCertSign/cRLSign spellings used in the CSR and the profile.
      - "'Certificate Sign' in (_reg_ipa_sub_ca_issued['key_usage'] | default([]))"
      - "'CRL Sign' in (_reg_ipa_sub_ca_issued['key_usage'] | default([]))"
    fail_msg: >-
      {{ ipa_sub_ca_common_name }} was issued, but not as a certificate
      authority: basic constraints are
      {{ _reg_ipa_sub_ca_issued['basic_constraints'] | default('absent') }} and
      key usage is {{ _reg_ipa_sub_ca_issued['key_usage'] | default('absent') }}.
      The profile {{ ipa_sub_ca_profile_id }} did not apply. cert-manager would
      accept this as an issuer and fail on the first certificate it signed.
    quiet: true
