---
gitlab_enabled: false

# Service names. Both resolve to this host's internal address, published by
# FreeIPA in Phase 2. The registry is a separate hostname rather than a port on
# the first one, so both can share 443 and be selected on SNI.
gitlab_external_hostname: null
gitlab_registry_hostname: null
gitlab_external_url: null
gitlab_registry_external_url: null

# Published ports.
#
# Port 80 is deliberately absent: Apache serves the Tier 1 artifact root there
# and every Phase 1-2 consumer has that URL baked in. Nothing needs GitLab over
# plain HTTP, so there is no redirect to lose.
#
# Host SSH owns 22, so git SSH is published on 2222. gitlab_shell_ssh_port must
# match it or GitLab prints clone URLs pointing at the host's own sshd.
gitlab_https_port: 443
gitlab_ssh_port: 2222

# Root account seeded on the first reconfigure only. Sourced from the
# environment by inventory; see plan/SECRETS.md.
gitlab_root_password: ""

# TLS. Omnibus looks for /etc/gitlab/ssl/<hostname>.crt and .key by default,
# which is where these are mounted. Issued by the FreeIPA CA.
gitlab_letsencrypt_enabled: false
gitlab_ssl_source_dir: null

# Container deployment.
gitlab_container_name: gitlab
gitlab_container_image: "gitlab/gitlab-ce:19.2.2-ce.0"
gitlab_compose_dir: /opt/rke2lab/gitlab

# Data layout on the 100 GB second disk. The registry stores under data/, so
# registry growth cannot reach the 32 GB OS disk.
gitlab_data_root: /data1/gitlab
# Where backups land on the host. Not a separate mount: this path is already
# inside the data volume, so it is already on the data disk. Recorded here so
# the runbook and the role agree on where to look.
gitlab_backup_dir: /data1/gitlab/data/backups

# Air-gapped image delivery, matching the pattern the FreeIPA role uses: the
# tarball comes from the Apache artifact host and is verified against the
# .sha256 published beside it at staging time, because a `docker save` tarball
# has no reproducible checksum of its own.
gitlab_image_tarball_url: null
gitlab_image_tarball_checksum: null
gitlab_image_tarball_path: /var/tmp/gitlab-ce-19.2.2-ce.0.tar

# Host prerequisites, installed through the repo01 apt proxy.
gitlab_runtime_packages:
  - docker.io
  - docker-compose-v2

# Memory-constrained omnibus settings, per GitLab's own guidance for small
# installs. None of the monitoring stack is used in this lab and it costs
# roughly 300 MB; KAS serves the Kubernetes agent, which this lab does not use.
gitlab_puma_worker_processes: 2
gitlab_sidekiq_concurrency: 10
gitlab_monitoring_enabled: false
gitlab_kas_enabled: false

# Who may read the health endpoints. GitLab restricts /-/readiness, /-/liveness
# and /-/health to 127.0.0.0/8 by default and answers 404 — not 403 — to
# everyone else, which reads exactly like a missing endpoint.
#
# Published ports mean the container never sees a loopback source address: the
# request arrives from the compose network's gateway, so the default allowlist
# rejects even a request made on the host itself. The Docker range is listed
# for that reason, and the internal subnet and tunnel so the readiness gate can
# run from where Ansible runs.
gitlab_monitoring_allowed_networks: null

# --- Single sign-on --------------------------------------------------------
#
# GitLab federates to Keycloak through omniauth, and the whole design here is
# that it is *additive*. GitLab is upstream of the cluster — Flux reads the
# cluster-state repository from it, and every image and chart the cluster pulls
# comes out of its registry — so a GitLab that could only be administered
# through Keycloak would be unadministrable on the day the cluster is what is
# broken. The root account therefore keeps its password, and nothing below can
# take that away:
#
#   - `gitlab_oidc_auto_sign_in` stays false. Turning it on redirects the login
#     page straight to Keycloak, and the local form is then reachable only by
#     someone who knows to append ?auto_sign_in=false to the URL — a
#     break-glass path that depends on remembering a query parameter is not
#     one.
#   - `gitlab_oidc_block_auto_created_users` stays false, because a federated
#     user who lands blocked has to be unblocked by an administrator, and on a
#     first sign-in that administrator is root logging in with a password.
#
# The client secret is authored in env.sh rather than generated by Keycloak,
# for the reason keycloak_clients sets out: it lets both ends be configured
# independently, so GitLab can carry this configuration from its very first
# run — long before the cluster that hosts Keycloak exists. The sign-in button
# simply does not work until Keycloak answers, which is the correct behaviour
# and not a failure of anything.
gitlab_oidc_enabled: false
gitlab_oidc_issuer: null
gitlab_oidc_client_id: gitlab
gitlab_oidc_client_secret: ""
gitlab_oidc_label: dev.lo single sign-on
gitlab_oidc_auto_sign_in: false
gitlab_oidc_block_auto_created_users: false
# There is deliberately no parameter here for mapping a claim to administrator.
# GitLab CE cannot do it — group-to-admin sync is an Enterprise feature — so
# `gitlab-admins` exists in FreeIPA and Keycloak like every other service's
# admin group, and GitLab is the one consumer that ignores it. Administrator
# rights here are still granted in GitLab, by root. See the compose template.
#
# The domain CA, so the container verifies Keycloak's certificate. Omnibus
# links whatever is in /etc/gitlab/trusted-certs into the Ruby trust store on
# reconfigure; without it every sign-in fails at the token exchange with a
# certificate verification error.
gitlab_oidc_ca_source_file: null

# Container registry and package registry. Both are the point of this phase.
gitlab_registry_enabled: true
gitlab_package_registry_enabled: true

# Shared memory for PostgreSQL. GitLab's documented compose example sets this;
# the Docker default of 64 MB is too small and shows up as query failures under
# load rather than as an obvious misconfiguration.
gitlab_shm_size: 256m

# Readiness gating. The first reconfigure builds the whole application from
# scratch and is slow; ten minutes of polling covers a restart, and the first
# install is given the longer timeout below.
gitlab_ready_retries: 60
gitlab_ready_delay: 10
gitlab_install_timeout: 2400

# Set false only when debugging; it exposes the root password.
gitlab_no_log: true
