---
gitlab_enabled: false

gitlab_external_hostname: null
gitlab_registry_hostname: null
gitlab_external_url: null
gitlab_registry_external_url: null

gitlab_https_port: 443

gitlab_root_password: ""

gitlab_ssl_source_dir: null

gitlab_container_name: gitlab
gitlab_container_image: "gitlab/gitlab-ce:19.3.0-ce.0"
gitlab_compose_dir: /opt/rke2lab/gitlab

gitlab_data_root: /data1/gitlab

gitlab_backup_dir: /data1/gitlab/data/backups

gitlab_image_tarball_url: null
gitlab_image_tarball_path: /var/tmp/gitlab-ce-19.3.0-ce.0.tar

gitlab_runtime_packages:
  - docker.io
  - docker-compose-v2

gitlab_oidc_enabled: false
gitlab_oidc_issuer: null
gitlab_oidc_client_secret: ""

gitlab_oidc_ca_source_file: null

gitlab_registry_enabled: true

gitlab_env_template: null
gitlab_compose_template: null

gitlab_ready_retries: 60
gitlab_ready_delay: 10
gitlab_install_timeout: 2400

gitlab_no_log: true
