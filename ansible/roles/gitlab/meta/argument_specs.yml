---
argument_specs:
  main:
    short_description: GitLab container platform inputs.
    options:
      gitlab_enabled:
        type: bool
        required: false
        default: false
        description: Whether GitLab is deployed on this host.
      gitlab_external_hostname:
        type: str
        required: false
        description: DNS name GitLab is served on.
      gitlab_registry_hostname:
        type: str
        required: false
        description: DNS name the container registry is served on.
      gitlab_external_url:
        type: str
        required: false
        description: External URL configured in omnibus.
      gitlab_registry_external_url:
        type: str
        required: false
        description: External URL of the container registry.
      gitlab_https_port:
        type: int
        required: false
        default: 443
        description: Host port published for HTTPS.
      gitlab_root_password:
        type: str
        required: false
        description: >-
          Initial root password, applied on first reconfigure only. Sourced
          from the environment.
      gitlab_ssl_source_dir:
        type: path
        required: false
        description: Host directory holding the issued certificates and keys.
      gitlab_container_name:
        type: str
        required: false
        default: gitlab
        description: Container name.
      gitlab_container_image:
        type: str
        required: false
        description: >-
          Image reference including the tag. Must match the staged tarball.
      gitlab_compose_dir:
        type: path
        required: false
        default: /opt/rke2lab/gitlab
        description: Directory holding the compose and environment files.
      gitlab_data_root:
        type: path
        required: false
        default: /data1/gitlab
        description: Root of the persistent data tree on the data disk.
      gitlab_backup_dir:
        type: path
        required: false
        default: /data1/gitlab/backups
        description: Directory backups are written to.
      gitlab_image_tarball_url:
        type: str
        required: false
        description: >-
          URL of the saved image tarball on the artifact host. The pinned URL
          and the TLS transport are the integrity control.
      gitlab_image_tarball_path:
        type: path
        required: false
        description: Local path the tarball is downloaded to.
      gitlab_runtime_packages:
        type: list
        elements: str
        required: false
        description: Host packages required to run the container.
      gitlab_env_template:
        description: >-
          Path to the GitLab env file template, under the repo files tree.
        type: str
        required: false
      gitlab_compose_template:
        description: >-
          Path to the GitLab docker-compose template, under the repo files tree.
        type: str
        required: false
      gitlab_oidc_enabled:
        type: bool
        required: false
        default: false
        description: >-
          Federate sign-in to Keycloak. Additive — the root account keeps its
          password and the local form stays on the login page, because GitLab
          is upstream of the cluster that runs Keycloak.
      gitlab_oidc_issuer:
        type: str
        required: false
        description: Keycloak realm issuer URL, used for OIDC discovery.
      gitlab_oidc_client_secret:
        type: str
        required: false
        default: ""
        description: >-
          That client's authored secret, from env.sh. Authored rather than
          generated so GitLab can carry this configuration from its first run,
          long before the cluster hosting Keycloak exists.
      gitlab_oidc_ca_source_file:
        type: str
        required: false
        description: >-
          Path on this host to the domain CA, copied into GitLab's trusted
          certificates. Without it the token exchange fails verification
          against a certificate the cluster issued itself.
      gitlab_registry_enabled:
        type: bool
        required: false
        default: true
        description: Whether the container registry is enabled.
      gitlab_ready_retries:
        type: int
        required: false
        default: 60
        description: Readiness poll attempts.
      gitlab_ready_delay:
        type: int
        required: false
        default: 10
        description: Seconds between readiness polls.
      gitlab_install_timeout:
        type: int
        required: false
        default: 2400
        description: Seconds allowed for the first reconfigure.
      gitlab_no_log:
        type: bool
        required: false
        default: true
        description: Suppress task output that would expose the password.
