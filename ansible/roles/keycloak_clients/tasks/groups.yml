---

- name: groups | Assert the directory groups have been imported into the realm
  vars:
    _keycloak_clients_known: >-
      {{ _reg_keycloak_clients_groups['json'] | map(attribute='name') | list }}
    _keycloak_clients_absent: >-
      {{ _var_keycloak_clients_grants | map(attribute='group')
         | reject('in', _keycloak_clients_known) | list }}
  ansible.builtin.assert:
    that:
      - (_keycloak_clients_absent | length) == 0
    fail_msg: >-
      The realm has not imported these groups from the directory:
      {{ _keycloak_clients_absent | join(', ') }}. Either ipa_sso_groups has
      not run, or keycloak_ldap's group mapper has not synchronised — the
      federation imports groups on a sync, not on the next login, so a group
      created in FreeIPA after the last sync is invisible here. Re-run
      keycloak_ldap.
    quiet: true

- name: groups | Obtain a fresh admin token
  ansible.builtin.include_tasks: token.yml

- name: groups | Read the roles each group already holds on this client
  changed_when: false
  no_log: "{{ keycloak_clients_no_log | bool }}"
  register: _reg_keycloak_clients_granted
  loop: "{{ _var_keycloak_clients_grants }}"
  loop_control:
    loop_var: _item_keycloak_clients_grant
    label: "{{ _item_keycloak_clients_grant['group'] }}"
  vars:
    _keycloak_clients_group_id: >-
      {{ (_reg_keycloak_clients_groups['json']
          | selectattr('name', 'equalto',
                       _item_keycloak_clients_grant['group'])
          | list | first)['id'] }}
  ansible.builtin.uri:
    url: >-
      {{ _var_keycloak_clients_admin_api }}/groups/{{
      _keycloak_clients_group_id | trim }}/role-mappings/clients/{{
      _var_keycloak_clients_uuid | trim }}
    headers: "{{ _var_keycloak_clients_headers }}"
    ca_path: "{{ keycloak_clients_ca_file }}"

- name: groups | Grant each group the role it is missing
  when: >-
    _item_keycloak_clients_grant[0]['role'] not in
    (_item_keycloak_clients_grant[1]['json'] | map(attribute='name') | list)
  changed_when: true
  no_log: "{{ keycloak_clients_no_log | bool }}"
  loop: >-
    {{ _var_keycloak_clients_grants
       | zip(_reg_keycloak_clients_granted['results']) | list }}
  loop_control:
    loop_var: _item_keycloak_clients_grant
    label: >-
      {{ _item_keycloak_clients_grant[0]['group'] }} ->
      {{ _var_keycloak_clients_slug | trim }}:{{
      _item_keycloak_clients_grant[0]['role'] }}
  vars:
    _keycloak_clients_group_id: >-
      {{ (_reg_keycloak_clients_groups['json']
          | selectattr('name', 'equalto',
                       _item_keycloak_clients_grant[0]['group'])
          | list | first)['id'] }}
    _keycloak_clients_role: >-
      {{ _reg_keycloak_clients_roles['json']
         | selectattr('name', 'equalto',
                      _item_keycloak_clients_grant[0]['role'])
         | list }}
  ansible.builtin.uri:
    url: >-
      {{ _var_keycloak_clients_admin_api }}/groups/{{
      _keycloak_clients_group_id | trim }}/role-mappings/clients/{{
      _var_keycloak_clients_uuid | trim }}
    method: POST
    headers: "{{ _var_keycloak_clients_headers }}"
    ca_path: "{{ keycloak_clients_ca_file }}"
    body_format: json
    body: "{{ _keycloak_clients_role }}"
    status_code: [204]
