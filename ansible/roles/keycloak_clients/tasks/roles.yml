---

- name: roles | Read the roles the client already has
  changed_when: false
  no_log: "{{ keycloak_clients_no_log | bool }}"
  register: _reg_keycloak_clients_roles
  ansible.builtin.uri:
    url: >-
      {{ _var_keycloak_clients_admin_api }}/clients/{{
      _var_keycloak_clients_uuid | trim }}/roles
    headers: "{{ _var_keycloak_clients_headers }}"
    ca_path: "{{ keycloak_clients_ca_file }}"

- name: roles | Create the roles the client is missing
  when: >-
    _item_keycloak_clients_role['name'] not in
    (_reg_keycloak_clients_roles['json'] | map(attribute='name') | list)
  changed_when: true
  no_log: "{{ keycloak_clients_no_log | bool }}"
  loop: "{{ _var_keycloak_clients_roles }}"
  loop_control:
    loop_var: _item_keycloak_clients_role
    label: >-
      {{ _var_keycloak_clients_slug | trim }}:{{
      _item_keycloak_clients_role['name'] }}
  ansible.builtin.uri:
    url: >-
      {{ _var_keycloak_clients_admin_api }}/clients/{{
      _var_keycloak_clients_uuid | trim }}/roles
    method: POST
    headers: "{{ _var_keycloak_clients_headers }}"
    ca_path: "{{ keycloak_clients_ca_file }}"
    body_format: json
    body: "{{ _item_keycloak_clients_role }}"
    status_code: [201]

- name: roles | Re-read the client's roles now that they all exist
  changed_when: false
  no_log: "{{ keycloak_clients_no_log | bool }}"
  register: _reg_keycloak_clients_roles
  ansible.builtin.uri:
    url: >-
      {{ _var_keycloak_clients_admin_api }}/clients/{{
      _var_keycloak_clients_uuid | trim }}/roles
    headers: "{{ _var_keycloak_clients_headers }}"
    ca_path: "{{ keycloak_clients_ca_file }}"

- name: roles | Read the client's protocol mappers
  changed_when: false
  no_log: "{{ keycloak_clients_no_log | bool }}"
  register: _reg_keycloak_clients_mappers
  ansible.builtin.uri:
    url: >-
      {{ _var_keycloak_clients_admin_api }}/clients/{{
      _var_keycloak_clients_uuid | trim }}/protocol-mappers/models
    headers: "{{ _var_keycloak_clients_headers }}"
    ca_path: "{{ keycloak_clients_ca_file }}"

- name: roles | Add the mapper that writes the client roles into the token
  when: >-
    _var_keycloak_clients_role_mapper['name'] not in
    (_reg_keycloak_clients_mappers['json'] | map(attribute='name') | list)
  changed_when: true
  no_log: "{{ keycloak_clients_no_log | bool }}"
  ansible.builtin.uri:
    url: >-
      {{ _var_keycloak_clients_admin_api }}/clients/{{
      _var_keycloak_clients_uuid | trim }}/protocol-mappers/models
    method: POST
    headers: "{{ _var_keycloak_clients_headers }}"
    ca_path: "{{ keycloak_clients_ca_file }}"
    body_format: json
    body: "{{ _var_keycloak_clients_role_mapper }}"
    status_code: [201]

- name: roles | Correct an existing mapper that no longer matches
  when:
    - (_keycloak_clients_mapper | length) > 0

    - >-
      (_keycloak_clients_mapper[0]['config']
       | combine(_var_keycloak_clients_role_mapper['config']))
      != _keycloak_clients_mapper[0]['config']
  changed_when: true
  no_log: "{{ keycloak_clients_no_log | bool }}"
  vars:
    _keycloak_clients_mapper: >-
      {{ _reg_keycloak_clients_mappers['json']
         | selectattr('name', 'equalto',
                      _var_keycloak_clients_role_mapper['name']) | list }}
  ansible.builtin.uri:
    url: >-
      {{ _var_keycloak_clients_admin_api }}/clients/{{
      _var_keycloak_clients_uuid | trim }}/protocol-mappers/models/{{
      _keycloak_clients_mapper[0]['id'] }}
    method: PUT
    headers: "{{ _var_keycloak_clients_headers }}"
    ca_path: "{{ keycloak_clients_ca_file }}"
    body_format: json
    body: >-
      {{ _keycloak_clients_mapper[0]
         | combine(_var_keycloak_clients_role_mapper) }}
    status_code: [204]
