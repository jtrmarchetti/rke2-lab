---
argument_specs:
  main:
    short_description: Create an OIDC client and roles per application
    description:
      - Creates a confidential client, the roles admin and user, a protocol
        mapper that writes those roles into the token as a flat claim, and a
        grant from each matching FreeIPA group.
      - Takes the client secret rather than reading back a generated one, so
        that a workload reading its secret from the vault never waits on
        Keycloak to exist. See tasks/main.yml for the whole argument.
      - Grants are additive. A group may hold roles on clients this repository
        does not manage, and asserting an exact set would revoke them.
    options:
      keycloak_clients_enabled:
        type: bool
        default: true
        description: Whether the role does anything.
      keycloak_clients_url:
        type: str
        required: true
        description: Keycloak's base URL.
      keycloak_clients_ca_file:
        type: str
        description: CA bundle Keycloak's certificate is verified against.
      keycloak_clients_admin_user:
        type: str
        default: admin
        description: Keycloak's local administrator, always in master.
      keycloak_clients_admin_password:
        type: str
        required: true
        description: That administrator's password, from the vault.
      keycloak_clients_realm:
        type: str
        required: true
        description:
          - The application realm keycloak_realm created. Must not be master.
      keycloak_clients_applications:
        type: list
        elements: dict
        default: []
        description:
          - One entry per federated service.
        options:
          name:
            type: str
            required: true
            description:
              - Application slug. Becomes the client id, and with the suffixes
                below the FreeIPA group names, so it must match the slug
                ipa_sso_groups was given.
          description:
            type: str
            required: true
            description: What the service is, shown in the Keycloak console.
          redirect_uris:
            type: list
            elements: str
            required: true
            description:
              - Exact callback URIs. Never wildcarded; that is the classic OIDC
                open redirect and every service here has one fixed path.
          web_origins:
            type: list
            elements: str
            default: []
            description: CORS origins, where the service needs them.
          base_url:
            type: str
            description: Link offered by the Keycloak account console.
          client_secret:
            type: str
            required: true
            no_log: true
            description:
              - The shared secret, authored in env.sh rather than generated by
                Keycloak.
      keycloak_clients_admin_suffix:
        type: str
        default: admins
        description: Suffix of the administrator group. Matches ipa_sso_groups.
      keycloak_clients_user_suffix:
        type: str
        default: users
        description: Suffix of the user group. Matches ipa_sso_groups.
      keycloak_clients_admin_role:
        type: str
        default: admin
        description: Client role the administrator group is granted.
      keycloak_clients_user_role:
        type: str
        default: user
        description: Client role the user group is granted.
      keycloak_clients_roles_claim:
        type: str
        default: roles
        description:
          - Token claim the client's roles are written into. Read by Grafana's
            role_attribute_path and by OpenBao's groups_claim, so it is one
            fact written three times.
      keycloak_clients_no_log:
        type: bool
        default: true
        description:
          - Set false only when debugging; it prints every client secret.
