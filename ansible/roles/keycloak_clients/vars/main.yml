---
_var_keycloak_clients_headers:
  Authorization: >-
    Bearer {{ _reg_keycloak_clients_token['json']['access_token'] | default('') }}

_var_keycloak_clients_admin_api: >-
  {{ keycloak_clients_url }}/admin/realms/{{ keycloak_clients_realm }}

_var_keycloak_clients_slug: >-
  {{ _item_keycloak_clients_application['name'] }}
_var_keycloak_clients_admin_group: >-
  {{ _item_keycloak_clients_application['name'] }}-{{
  keycloak_clients_admin_suffix }}
_var_keycloak_clients_user_group: >-
  {{ _item_keycloak_clients_application['name'] }}-{{
  keycloak_clients_user_suffix }}

_var_keycloak_clients_matching: >-
  {{ _reg_keycloak_clients_existing['json'] | default([])
     | selectattr('clientId', 'equalto',
                  _item_keycloak_clients_application['name']) | list }}
_var_keycloak_clients_present: >-
  {{ (_var_keycloak_clients_matching | length) > 0 }}
_var_keycloak_clients_current: >-
  {{ _var_keycloak_clients_matching | first | default({}) }}
_var_keycloak_clients_existing_id: >-
  {{ (_var_keycloak_clients_matching | first)['id'] | default('') }}

_var_keycloak_clients_uuid: >-
  {{ (_reg_keycloak_clients_final['json'] | default([])
      | selectattr('clientId', 'equalto',
                   _item_keycloak_clients_application['name'])
      | list | first)['id'] | default('') }}

_var_keycloak_clients_definition:
  clientId: "{{ _item_keycloak_clients_application['name'] }}"
  name: "{{ _item_keycloak_clients_application['description'] }}"
  description: >-
    Managed by the keycloak_clients Ansible role. Access is granted through the
    FreeIPA groups {{ _var_keycloak_clients_admin_group | trim }} and
    {{ _var_keycloak_clients_user_group | trim }}, not in this console.
  enabled: true
  protocol: openid-connect
  publicClient: false
  standardFlowEnabled: true
  implicitFlowEnabled: false
  directAccessGrantsEnabled: false
  serviceAccountsEnabled: false
  redirectUris: "{{ _item_keycloak_clients_application['redirect_uris'] }}"
  webOrigins: >-
    {{ _item_keycloak_clients_application['web_origins'] | default([]) }}
  baseUrl: >-
    {{ _item_keycloak_clients_application['base_url'] | default('') }}
  secret: "{{ _item_keycloak_clients_application['client_secret'] }}"

_var_keycloak_clients_compared:
  - clientId
  - name
  - description
  - enabled
  - protocol
  - publicClient
  - standardFlowEnabled
  - implicitFlowEnabled
  - directAccessGrantsEnabled
  - serviceAccountsEnabled
  - redirectUris
  - webOrigins

_var_keycloak_clients_roles:
  - name: "{{ keycloak_clients_admin_role }}"
    description: >-
      Administers this service. Granted through the FreeIPA group
      {{ _var_keycloak_clients_admin_group | trim }}.
  - name: "{{ keycloak_clients_user_role }}"
    description: >-
      Ordinary use of this service. Granted through the FreeIPA group
      {{ _var_keycloak_clients_user_group | trim }}.

_var_keycloak_clients_role_mapper:
  name: client roles
  protocol: openid-connect
  protocolMapper: oidc-usermodel-client-role-mapper
  config:
    usermodel.clientRoleMapping.clientId: >-
      {{ _item_keycloak_clients_application['name'] }}
    claim.name: "{{ keycloak_clients_roles_claim }}"
    jsonType.label: String
    multivalued: "true"
    id.token.claim: "true"
    access.token.claim: "true"
    userinfo.token.claim: "true"

_var_keycloak_clients_grants:
  - group: "{{ _var_keycloak_clients_admin_group | trim }}"
    role: "{{ keycloak_clients_admin_role }}"
  - group: "{{ _var_keycloak_clients_user_group | trim }}"
    role: "{{ keycloak_clients_user_role }}"
