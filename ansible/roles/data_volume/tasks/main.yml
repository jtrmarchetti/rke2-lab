---
- name: main | Gather the current block device layout
  when: (data_volume_enabled | bool)
  ansible.builtin.setup:
    gather_subset:
      - "!all"
      - "!min"
      - hardware

- name: main | Assert the data volume device is present
  when: (data_volume_enabled | bool)
  ansible.builtin.assert:
    that:
      - data_volume_device is match('^/dev/[a-z0-9]+$')
      - (data_volume_device | basename) in ansible_facts['devices']
    fail_msg: >-
      Data volume device {{ data_volume_device }} is not present on this host.
      Confirm the VM definition in infra/pulumi/modules/vm_definitions.py
      attaches the second disk before running this role.
    quiet: true

- name: main | Ensure the data volume carries a filesystem
  when: (data_volume_enabled | bool)
  community.general.filesystem:
    dev: "{{ data_volume_device }}"
    fstype: "{{ data_volume_filesystem }}"
    opts: >-
      {{ _var_data_volume_mkfs_label_opt[data_volume_filesystem] }}
      {{ data_volume_label }}
    force: false
    state: present

- name: main | Ensure the data volume mount point exists
  when: (data_volume_enabled | bool)
  ansible.builtin.file:
    path: "{{ data_volume_mount_path }}"
    state: directory
    owner: "{{ data_volume_owner }}"
    group: "{{ data_volume_group }}"
    mode: "{{ data_volume_mode }}"

- name: main | Ensure the data volume is mounted and recorded in fstab
  when:
    - (data_volume_enabled | bool)
    - not ansible_check_mode
  ansible.posix.mount:
    path: "{{ data_volume_mount_path }}"
    src: "{{ _var_data_volume_mount_source }}"
    fstype: "{{ data_volume_filesystem }}"
    opts: "{{ data_volume_mount_options }}"
    state: mounted

- name: main | Refresh the mount facts after mounting the data volume
  when:
    - (data_volume_enabled | bool)
    - not ansible_check_mode
  ansible.builtin.setup:
    gather_subset:
      - "!all"
      - "!min"
      - hardware

- name: main | Ensure the mounted volume has the expected ownership
  when:
    - (data_volume_enabled | bool)
    - not ansible_check_mode
  ansible.builtin.file:
    path: "{{ data_volume_mount_path }}"
    state: directory
    owner: "{{ data_volume_owner }}"
    group: "{{ data_volume_group }}"
    mode: "{{ data_volume_mode }}"
