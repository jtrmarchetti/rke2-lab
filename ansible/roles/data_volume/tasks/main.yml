---
- name: main | Gather the current block device layout
  when: (data_volume_enabled | bool)
  ansible.builtin.setup:
    gather_subset:
      - "!all"
      - "!min"
      - hardware

# Failing here is much cheaper than letting the filesystem module operate on a
# device name that does not exist, or that points at the OS disk because the
# VM definition changed underneath the inventory.
- name: main | Assert the data volume device is present
  when: (data_volume_enabled | bool)
  ansible.builtin.assert:
    that:
      - data_volume_device is match('^/dev/[a-z0-9]+$')
      - (data_volume_device | basename) in ansible_facts['devices']
    fail_msg: >-
      Data volume device {{ data_volume_device }} is not present on this host.
      Confirm the VM definition in infra/pulumi/modules/vm_definitions.py
      attaches the second disk before running this role.
    quiet: true

# force is false so an already-formatted disk is left alone. Re-running this
# role must never be a way to destroy the artifact store.
- name: main | Ensure the data volume carries a filesystem
  when: (data_volume_enabled | bool)
  community.general.filesystem:
    dev: "{{ data_volume_device }}"
    fstype: "{{ data_volume_filesystem }}"
    opts: >-
      {{ _var_data_volume_mkfs_label_opt[data_volume_filesystem] }}
      {{ data_volume_label }}
    force: false
    state: present

- name: main | Ensure the data volume mount point exists
  when: (data_volume_enabled | bool)
  ansible.builtin.file:
    path: "{{ data_volume_mount_path }}"
    state: directory
    owner: "{{ data_volume_owner }}"
    group: "{{ data_volume_group }}"
    mode: "{{ data_volume_mode }}"

- name: main | Ensure the data volume is mounted and recorded in fstab
  when:
    - (data_volume_enabled | bool)
    - not ansible_check_mode
  ansible.posix.mount:
    path: "{{ data_volume_mount_path }}"
    src: "{{ _var_data_volume_mount_source }}"
    fstype: "{{ data_volume_filesystem }}"
    opts: "{{ data_volume_mount_options }}"
    state: mounted

# The play gathered facts before this role mounted anything, so
# ansible_facts['mounts'] still describes the host without the data volume.
# Later roles check that their data directory is on a real filesystem, and they
# would read the stale table and refuse to run on a host this role just fixed.
- name: main | Refresh the mount facts after mounting the data volume
  when:
    - (data_volume_enabled | bool)
    - not ansible_check_mode
  ansible.builtin.setup:
    gather_subset:
      - "!all"
      - "!min"
      - hardware

# Ownership is applied again after the mount because the pre-mount permissions
# belong to the underlying directory, not to the mounted filesystem's root.
- name: main | Ensure the mounted volume has the expected ownership
  when:
    - (data_volume_enabled | bool)
    - not ansible_check_mode
  ansible.builtin.file:
    path: "{{ data_volume_mount_path }}"
    state: directory
    owner: "{{ data_volume_owner }}"
    group: "{{ data_volume_group }}"
    mode: "{{ data_volume_mode }}"
