---
_var_gitlab_admin_token_api: "{{ gitlab_admin_token_url }}/api/v4"

# The recorded credential, as parsed. Only valid after the slurp has run, so
# resolve lazily; the decision in tasks/main.yml is what gates use of it.
_var_gitlab_admin_token_recorded: >-
  {{ _reg_gitlab_admin_token_recorded['content'] | b64decode | from_yaml }}

# The one GitLab operation with no REST equivalent: creating a personal access
# token for yourself requires a token you do not have yet. The snippet GitLab
# documents is a gitlab-rails runner call, scoped to `api`, expired in a day.
# Runs inside the gitlab container on the GitLab host, so it works even while
# the API is wedged — which is the state this role exists to repair.
#
# The mint's name carries no run identity: the file this role writes is the
# recording, and a minted token that is superseded before its day is out is
# simply left to expire.
_var_gitlab_admin_token_pat_script: |
  docker exec -i gitlab gitlab-rails runner - <<'RUBY'
  u = User.find_by_username("root")
  t = u.personal_access_tokens.create!(
    scopes: ["api"],
    name: "gitlab-admin-#{Time.now.to_i}",
    expires_at: 1.day.from_now)
  puts "#{t.id} #{t.token}"
  RUBY
