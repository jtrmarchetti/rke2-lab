---
argument_specs:
  main:
    short_description: Apt caching proxy inputs; never mirrors a repository.
    options:
      apt_proxy_enabled:
        type: bool
        required: false
      apt_proxy_bind_addresses:
        description: Addresses the proxy listens on. Internal and tunnel only.
        type: list
        elements: str
        required: false
      apt_proxy_bind_port:
        type: int
        required: false
      apt_proxy_cache_dir:
        description: On-demand cache location, placed on the data volume.
        type: str
        required: false
      apt_proxy_template:
        description: >-
          Path to the cacher override template, under the repo files tree.
        type: str
        required: false
