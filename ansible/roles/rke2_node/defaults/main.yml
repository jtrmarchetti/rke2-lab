---
rke2_node_enabled: true

# server or agent. Phase 4 installs servers; Phase 5 reuses this role with
# agent, which is the only difference between the two node types at this layer.
rke2_node_type: server

# The RKE2 release. Must equal the version rke2_publish uploaded to the package
# registry, because that is where the installer and binary are fetched from.
rke2_node_version: 1.35.7+rke2r1

# Where RKE2 keeps everything: the containerd image store, etcd, the static pod
# manifests, and the packaged chart state. Deliberately on the data volume —
# the image store grows with every image the cluster pulls and would eventually
# fill the 32 GB OS disk.
rke2_node_data_dir: /data1/rancher/rke2

# --- inotify --------------------------------------------------------------
#
# Both limits are per-UID, and on a Kubernetes node nearly every container runs
# as UID 0, so they share one allowance. The kernel default for instances is
# 128 and this cluster sat at 129 — kubelet, containerd, Flux's controllers,
# cert-manager, Longhorn, Grafana's sidecars and Alloy all watch files.
#
# Over the limit, a watcher allocation fails with EMFILE and the process
# reports "failed to create fsnotify watcher: too many open files", which names
# open files and sends you to ulimit, where nothing is wrong.
#
# 8192 instances and 524288 watches are the values Longhorn and the Flux
# documentation both ask for. The cost is kernel memory and it is small: an
# instance is a few hundred bytes and a watch about a kilobyte, so the ceiling
# here is well under a gigabyte on a node that would have to be in serious
# trouble to approach it. These are ceilings, not allocations.
rke2_node_inotify_max_user_instances: 8192
rke2_node_inotify_max_user_watches: 524288

# Scratch directory the installer runs against. Holds only the binary tarball
# and the release checksum file; see the note in install.yml about why the
# airgap image tarball is deliberately absent.
rke2_node_install_dir: /data1/rke2-install

# --- Tier 1: the domain CA -----------------------------------------------
#
# Fetched over plain HTTP from the Apache artifact host, which is the only path
# that does not already require the trust it is delivering. Installed before the
# container runtime first starts, because the runtime caches the trust pool at
# start.
rke2_node_ca_url: null
rke2_node_ca_system_path: null
rke2_node_ca_rke2_path: null

# --- Tier 2: the GitLab registries ---------------------------------------
rke2_node_gitlab_url: null
rke2_node_registry_host: null

# The generic package registry coordinates the installer and binary come from.
rke2_node_package_project: rke2/packages
rke2_node_package_name: rke2

# Containerd mirror rewrites. Each entry redirects one upstream registry host
# at the GitLab mirror and rewrites every repository path under it to where
# rke2_publish pushes: <upstream namespace>/<repo> -> rke2/images/<namespace>/<repo>.
#
# The rewrite is a per-host catch-all (^(.*)), not a per-namespace rule. RKE2
# regenerates containerd's hosts.toml from registries.yaml only at service
# start, so a per-namespace list made every new upstream namespace cost a
# rolling restart of the whole cluster. The catch-all costs exactly one
# one-time restart, and onboarding an image after that is push-to-GitLab plus
# a manifest entry -- no core config change, no node restart.
#
# The list is one entry per upstream *host*. Adding a new host (e.g.
# nvcr.io/nvidia) is the only thing that still costs a rolling restart; any
# namespace or repository under a host already listed here costs nothing.
#
# The replacement paths must stay equal to rke2_publish's group and images
# project, or a node will ask for a path nothing published.
rke2_node_registry_mirrors:
  # Docker Hub. Includes the official image namespace (library/*, what a bare
  # `postgres:18` resolves to), plus every upstream namespace published under
  # it: rancher, bitnami, longhornio, dxflrs, grafana, ...
  - upstream: docker.io
    pattern: "^(.*)"
    replacement: rke2/images/$1
  # Docker Hub's backend host. Named separately because some clients resolve
  # docker.io through registry-1.docker.io instead.
  - upstream: registry-1.docker.io
    pattern: "^(.*)"
    replacement: rke2/images/$1
  # GitHub Container Registry: kube-vip, fluxcd, external-secrets, ...
  - upstream: ghcr.io
    pattern: "^(.*)"
    replacement: rke2/images/$1
  # Google Container Registry, where Google's own images live.
  - upstream: gcr.io
    pattern: "^(.*)"
    replacement: rke2/images/$1
  # Quay: jetstack, openbao, keycloak, prometheus, prometheus-operator,
  # kiwigrid, oauth2-proxy, ...
  - upstream: quay.io
    pattern: "^(.*)"
    replacement: rke2/images/$1
  # Kubernetes' official registry; the one host already in use, which is the
  # proof the catch-all shape works in this cluster.
  - upstream: registry.k8s.io
    pattern: "^(.*)"
    replacement: rke2/images/$1
  # Microsoft Container Registry.
  - upstream: mcr.microsoft.com
    pattern: "^(.*)"
    replacement: rke2/images/$1
  # Red Hat's public registry, where UBI, UBI8/9 min, and Red Hat mirrors of
  # community images are served.
  - upstream: registry.redhat.io
    pattern: "^(.*)"
    replacement: rke2/images/$1
  # Red Hat's older access registry. Kept because existing manifests and
  # documentation reference it; the new images use registry.redhat.io.
  - upstream: registry.access.redhat.com
    pattern: "^(.*)"
    replacement: rke2/images/$1
  # Cloud Native Computing Foundation: cert-manager, KEDA, OpenZiti, ...
  - upstream: cgr.dev
    pattern: "^(.*)"
    replacement: rke2/images/$1
  # Amazon ECR public. AWS's public images live here.
  - upstream: public.ecr.aws
    pattern: "^(.*)"
    replacement: rke2/images/$1
  # IBM's registry: ibmcloud images and mirrors.
  - upstream: icr.io
    pattern: "^(.*)"
    replacement: rke2/images/$1
  # NVIDIA's registry: NGC images and the CUDA base images the GPU workloads
  # are built on.
  - upstream: nvcr.io
    pattern: "^(.*)"
    replacement: rke2/images/$1

# Read-only pull credential. No default: a node with an empty credential would
# get a 401 that reads like a broken mirror. The playbook reads it from the file
# rke2_publish recorded on the repo host.
# rke2_node_registry_username:
# rke2_node_registry_password:

# Bounds a single download from the package registry.
rke2_node_download_timeout: 600
