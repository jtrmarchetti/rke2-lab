---

# check_mode=true renders to nothing: `is_changed` says whether the file on
# disk already matches the template, so the real render (and the RKE2
# restart it notifies) runs only when the configuration actually moved.
- name: registries | Check whether the rendered configuration would change
  check_mode: true
  no_log: true
  register: _reg_rke2_node_registries_would_change
  ansible.builtin.template:
    src: "{{ rke2_node_registries_template }}"
    dest: /etc/rancher/rke2/registries.yaml
    owner: root
    group: root
    mode: "0600"

- name: registries | Render the containerd registry configuration
  when: >-
    _reg_rke2_node_registries_would_change is defined
    and _reg_rke2_node_registries_would_change is changed
  no_log: true
  notify: Restart RKE2
  ansible.builtin.template:
    src: "{{ rke2_node_registries_template }}"
    dest: /etc/rancher/rke2/registries.yaml
    owner: root
    group: root
    mode: "0600"

- name: registries | Prove the node can authenticate to the registry
  changed_when: false
  no_log: true
  vars:

    _rke2_node_pull_scope: >-
      repository:{{ rke2_node_registry_mirrors[0]['replacement'] | dirname
      }}:pull
  ansible.builtin.uri:
    url: >-
      {{ rke2_node_gitlab_url }}/jwt/auth?service=container_registry&scope={{
      _rke2_node_pull_scope }}
    url_username: "{{ rke2_node_registry_username }}"
    url_password: "{{ rke2_node_registry_password }}"
    force_basic_auth: true
    status_code: [200]
