---
# The binary comes from the GitLab generic package registry, not from Apache and
# not from the internet. This is the one thing a node needs before it has
# anything that can pull an image, which is why it is a package and not an
# image.

- name: install | Ensure the installer scratch directory exists
  ansible.builtin.file:
    path: "{{ rke2_node_install_dir }}"
    state: directory
    owner: root
    group: root
    mode: "0700"

# Only two files. install.sh looks for an rke2-images.<arch>.tar.* alongside
# them and, finding none, leaves AIRGAP_CHECKSUM_EXPECTED empty; both
# verify_airgap_tarball and install_airgap_tarball then return immediately. That
# is the supported shape for a registry-based air gap, and it is deliberate:
# seeding the image tarball here would leave containerd with every image already
# on local disk, so it would never contact the mirror and a broken mirror would
# pass this phase silently. See plan/PHASE4_IMPLEMENTATION.md.
- name: install | Fetch the installer and binary from the package registry
  no_log: true
  loop:
    - install.sh
    - rke2.linux-amd64.tar.gz
    - sha256sum-amd64.txt
  loop_control:
    loop_var: _item_rke2_node_package_file
    label: "{{ _item_rke2_node_package_file }}"
  ansible.builtin.get_url:
    url: >-
      {{ rke2_node_gitlab_url }}/api/v4/projects/{{
      rke2_node_package_project | replace('/', '%2F')
      }}/packages/generic/{{ rke2_node_package_name }}/{{
      rke2_node_version | urlencode }}/{{ _item_rke2_node_package_file }}
    dest: "{{ rke2_node_install_dir }}/{{ _item_rke2_node_package_file }}"
    url_username: "{{ rke2_node_registry_username }}"
    url_password: "{{ rke2_node_registry_password }}"
    force_basic_auth: true
    owner: root
    group: root
    mode: "0700"
    timeout: "{{ rke2_node_download_timeout }}"

# Verified against Rancher's own checksum file before the installer is trusted
# to run. install.sh checks the binary tarball itself, but nothing checks
# install.sh, and it runs as root.
- name: install | Read the checksum of the downloaded binary
  register: _reg_rke2_node_tarball
  ansible.builtin.stat:
    path: "{{ rke2_node_install_dir }}/rke2.linux-amd64.tar.gz"
    checksum_algorithm: sha256

- name: install | Read the release checksum file
  register: _reg_rke2_node_checksums
  ansible.builtin.slurp:
    src: "{{ rke2_node_install_dir }}/sha256sum-amd64.txt"

- name: install | Assert the binary matches the release checksum
  vars:
    _rke2_node_expected: >-
      {{ ((_reg_rke2_node_checksums['content'] | b64decode).splitlines()
          | select('search', 'rke2\.linux-amd64\.tar\.gz$')
          | first).split()[0] }}
  ansible.builtin.assert:
    that:
      - _reg_rke2_node_tarball['stat']['checksum'] == _rke2_node_expected
    fail_msg: >-
      rke2.linux-amd64.tar.gz from the package registry does not match the
      checksum the release publishes for it. The package registry is serving
      something other than what repo01 staged.
    quiet: true

- name: install | Check whether this version is already installed
  changed_when: false
  failed_when: false
  register: _reg_rke2_node_installed
  ansible.builtin.command:
    cmd: /usr/local/bin/rke2 --version

# `creates` is not usable here: the binary exists after any install, so it would
# make an upgrade a no-op. The version string is what actually decides.
- name: install | Run the installer
  when: >-
    _reg_rke2_node_installed['rc'] != 0
    or rke2_node_version.split('+')[0] not in _reg_rke2_node_installed['stdout']
  changed_when: true
  environment:
    INSTALL_RKE2_ARTIFACT_PATH: "{{ rke2_node_install_dir }}"
    INSTALL_RKE2_TYPE: "{{ rke2_node_type }}"
  notify: Restart RKE2
  ansible.builtin.command:
    cmd: sh install.sh
    chdir: "{{ rke2_node_install_dir }}"

- name: install | Ensure the RKE2 data directory exists
  ansible.builtin.file:
    path: "{{ rke2_node_data_dir }}"
    state: directory
    owner: root
    group: root
    # 0755, because RKE2's own components traverse this path as non-root and
    # because RKE2 sets it to this itself. A role that enforced 0700 here would
    # take the node down on its second run, which is the Phase 2 and Phase 3
    # lesson in a third service.
    mode: "0755"
