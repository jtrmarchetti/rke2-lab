---
- name: main | Ensure apt proxy config is present for internal hosts
  when:
    - (base_host_apt_proxy_enabled | bool)
    - (base_host_apt_proxy_url | length > 0)
  ansible.builtin.copy:
    dest: /etc/apt/apt.conf.d/99repo-proxy
    content: |
      Acquire::http::Proxy "{{ base_host_apt_proxy_url }}";
      Acquire::https::Proxy "{{ base_host_apt_proxy_url }}";
      Acquire::ftp::Proxy "{{ base_host_apt_proxy_url }}";
    mode: "0644"

- name: main | Ensure apt proxy config is absent when the host reaches upstream directly
  when: not (base_host_apt_proxy_enabled | bool)
  ansible.builtin.file:
    path: /etc/apt/apt.conf.d/99repo-proxy
    state: absent

- name: main | Ensure apt acquire tuning is present for proxy hosts
  when:
    - (base_host_apt_proxy_enabled | bool)
    - (base_host_apt_proxy_url | length > 0)
  ansible.builtin.copy:
    dest: /etc/apt/apt.conf.d/99repo-acquire
    content: |
      Acquire::Retries "{{ base_host_apt_acquire_retries }}";
      Acquire::http::Timeout "{{ base_host_apt_acquire_timeout }}";
      Acquire::https::Timeout "{{ base_host_apt_acquire_timeout }}";
      Acquire::http::Pipeline-Depth "{{ base_host_apt_acquire_pipeline_depth }}";
      Acquire::https::Pipeline-Depth "{{ base_host_apt_acquire_pipeline_depth }}";
    mode: "0644"

- name: main | Ensure apt acquire tuning is absent when the host reaches upstream directly
  when: not (base_host_apt_proxy_enabled | bool)
  ansible.builtin.file:
    path: /etc/apt/apt.conf.d/99repo-acquire
    state: absent

- name: main | Ensure split DNS netplan drop-in is present
  when:
    - (base_host_split_dns_enabled | bool)
    - (base_host_split_dns_interface | length > 0)
    - (base_host_split_dns_servers | length > 0)
  notify:
    - Apply netplan configuration
  ansible.builtin.template:
    src: "{{ _var_base_host_files_dir }}/split_dns_netplan.j2"
    dest: "{{ _var_base_host_split_dns_netplan_path }}"
    owner: root
    group: root
    mode: "0600"

- name: main | Ensure split DNS netplan drop-in is absent when disabled
  when: not (base_host_split_dns_enabled | bool)
  notify:
    - Apply netplan configuration
  ansible.builtin.file:
    path: "{{ _var_base_host_split_dns_netplan_path }}"
    state: absent

- name: main | Ensure periodic unattended upgrades are disabled in apt config
  when: not (base_host_apt_unattended_upgrade | bool)
  ansible.builtin.copy:

    dest: /etc/apt/apt.conf.d/00no-unattended-upgrades
    content: APT::Periodic::Unattended-Upgrade "0";
    mode: "0644"

- name: main | Ensure the apt-daily timer is stopped and disabled
  when: not (base_host_apt_unattended_upgrade | bool)
  ansible.builtin.systemd:
    name: apt-daily.timer
    state: stopped
    enabled: false

- name: main | Ensure the apt-daily-upgrade timer is stopped and disabled
  when: not (base_host_apt_unattended_upgrade | bool)
  ansible.builtin.systemd:
    name: apt-daily-upgrade.timer
    state: stopped
    enabled: false

- name: main | Ensure the unattended-upgrades shutdown hook is disabled
  when: not (base_host_apt_unattended_upgrade | bool)
  ansible.builtin.systemd:

    name: unattended-upgrades
    enabled: false

- name: main | Ensure apt cache is updated

  register: _reg_base_host_apt_update
  retries: "{{ base_host_apt_update_retries }}"
  delay: "{{ base_host_apt_update_delay }}"
  until: _reg_base_host_apt_update.rc == 0
  ansible.builtin.shell: |
    # flock on the dpkg frontend lock instead of killing apt
    # processes: a lock held by a live process clears itself when it
    # finishes, so the bounded retries below clear it without killing
    # anyone. -w caps the per-attempt wait; until/retries re-attempt.
    exec flock -w 120 /var/lib/dpkg/lock-frontend \
      timeout -k 30 "{{ base_host_apt_update_timeout }}" apt-get update

- name: main | Ensure base packages are installed
  ansible.builtin.apt:
    name: "{{ base_host_packages }}"
    state: present

- name: main | Ensure target hostname is configured
  when:
    - (base_host_manage_hostname | bool)
    - (base_host_target_hostname | length > 0)
  ansible.builtin.hostname:
    name: "{{ base_host_target_hostname }}"
