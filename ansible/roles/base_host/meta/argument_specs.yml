---
argument_specs:
  main:
    short_description: Base host preparation inputs.
    options:
      base_host_packages:
        type: list
        elements: str
        required: false
      base_host_apt_proxy_enabled:
        type: bool
        required: false
      base_host_apt_proxy_url:
        type: str
        required: false
      base_host_apt_acquire_retries:
        description: Acquire::Retries written to the repo-acquire drop-in.
        type: int
        required: false
      base_host_apt_acquire_timeout:
        description: Acquire http/https Timeout in seconds for the drop-in.
        type: int
        required: false
      base_host_apt_acquire_pipeline_depth:
        description: Acquire http/https Pipeline-Depth; 0 disables pipelining.
        type: int
        required: false
      base_host_apt_update_retries:
        description: Task-level retries on the apt cache update.
        type: int
        required: false
      base_host_apt_update_delay:
        description: Seconds between task-level cache-update retries.
        type: int
        required: false
      base_host_apt_update_timeout:
        description: >-
          Per-attempt wall-clock cap (seconds) on the apt-get update command
          itself (exec timeout -k 30 <cap> apt-get update). NOT a task-level
          timeout, which would bypass retries/until and kill the task.
          Sized 300s for the warm-store case: the apt_proxy pre-warm task
          fills the cacher store before any VM bursts, so a fetch is a
          small local download.
        type: int
        required: false
      base_host_manage_hostname:
        type: bool
        required: false
      base_host_target_hostname:
        type: str
        required: false
      base_host_split_dns_enabled:
        description: Route some domains to internal resolvers on one link.
        type: bool
        required: false
      base_host_split_dns_interface:
        description: Interface whose link carries the internal resolvers.
        type: str
        required: false
      base_host_split_dns_servers:
        description: Internal resolver addresses for the split-DNS domains.
        type: list
        elements: str
        required: false
      base_host_split_dns_domains:
        description: Domains routed to the internal resolvers.
        type: list
        elements: str
        required: false
