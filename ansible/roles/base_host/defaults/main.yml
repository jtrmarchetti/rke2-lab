---

base_host_packages:
  - ca-certificates
  - curl
  - gnupg
  - lsb-release
  - apt-transport-https
  - software-properties-common

base_host_apt_proxy_enabled: true
base_host_apt_proxy_url: null

base_host_apt_acquire_retries: 5
base_host_apt_acquire_timeout: 300
base_host_apt_acquire_pipeline_depth: 0

base_host_apt_update_retries: 3
base_host_apt_update_delay: 15

# Per-attempt wall-clock cap on the apt-get update command. Sized for the
# warm-store case: the apt_proxy pre-warm task fills repo01's cacher store
# before any VM bursts, so a VM's fetch is a small local download and 300s
# is ample. The old 1800s cap only existed to survive a poisoned-store
# stall, which the pre-warm now prevents.
base_host_apt_update_timeout: 300

base_host_manage_hostname: false
base_host_target_hostname: ""

base_host_apt_unattended_upgrade: false

base_host_split_dns_enabled: false
base_host_split_dns_interface: ""
base_host_split_dns_servers: []
base_host_split_dns_template: null
