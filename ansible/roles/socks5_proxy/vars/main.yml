---
_var_socks5_proxy_package: dante-server
_var_socks5_proxy_service: danted
_var_socks5_proxy_config_path: /etc/danted.conf

# Templates for this role live in ansible/files/socks5_proxy/ rather than
# inside the role, so the tree that renders a host's configuration can
# be read without opening the role.
_var_socks5_proxy_files_dir: "{{ role_path | dirname | dirname }}/files/socks5_proxy"
