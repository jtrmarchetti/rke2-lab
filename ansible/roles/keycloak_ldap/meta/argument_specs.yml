---
argument_specs:
  main:
    short_description: Federate Keycloak to FreeIPA over LDAP
    description:
      - Creates a read-only bind system account under cn=sysaccounts in
        FreeIPA, which has no POSIX identity and cannot log in anywhere.
      - Proves the account can read the user tree, because an account that
        exists and cannot search presents as a successful connection to an
        empty directory.
      - Configures Keycloak's user federation provider and asks Keycloak to
        test both the connection and the bind.
    options:
      keycloak_ldap_enabled:
        type: bool
        default: true
        description: Whether the role does anything.
      keycloak_ldap_ipa_host:
        type: str
        default: core01
        description: Inventory name of the identity host.
      keycloak_ldap_ipa_container:
        type: str
        default: freeipa-server
        description: Container the directory tools run in.
      keycloak_ldap_base_dn:
        type: str
        description: Base DN of the domain.
      keycloak_ldap_users_dn:
        type: str
        description: Subtree Keycloak reads users from.
      keycloak_ldap_groups_dn:
        type: str
        description:
          - Subtree Keycloak reads groups from. In FreeIPA this is
            cn=groups,cn=accounts, not beside the users.
      keycloak_ldap_bind_user:
        type: str
        default: keycloak
        description: uid of the bind system account.
      keycloak_ldap_dir_manager_password:
        type: str
        required: true
        description:
          - Directory Manager password. The only operation in this repository
            that needs it, because FreeIPA has no CLI for system accounts.
      keycloak_ldap_bind_password:
        type: str
        required: true
        description: Password set on, and used by, the bind account.
      keycloak_ldap_configure_keycloak:
        type: bool
        default: true
        description:
          - Set false to create and verify the bind account without touching
            Keycloak, for a cluster whose Keycloak is not yet running.
      keycloak_ldap_url:
        type: str
        description: Keycloak's base URL.
      keycloak_ldap_ca_file:
        type: str
        description: CA bundle Keycloak's certificate is verified against.
      keycloak_ldap_realm:
        type: str
        description:
          - Realm the federation is added to, created by keycloak_realm. Must
            not be master; federated end users do not belong in the realm that
            administers every other realm.
      keycloak_ldap_admin_user:
        type: str
        default: admin
        description: Keycloak admin account.
      keycloak_ldap_admin_password:
        type: str
        description: Keycloak admin password, from OpenBao.
      keycloak_ldap_provider_name:
        type: str
        default: freeipa
        description: Name of the federation provider in Keycloak.
      keycloak_ldap_connection_url:
        type: str
        description: LDAP URL of the directory.
      keycloak_ldap_first_name_mapper:
        type: str
        default: first name
        description: Name of the generated mapper to correct.
      keycloak_ldap_first_name_attribute:
        type: str
        default: givenName
        description:
          - Directory attribute holding the given name. Keycloak's rhds default
            is cn, which in FreeIPA is the full name.
      keycloak_ldap_email_verified_mapper_enabled:
        type: bool
        default: true
        description:
          - Mark federated users' addresses as verified. FreeIPA has no such
            attribute, so Keycloak imports every user with the flag false, and
            oauth2-proxy then refuses the login after authentication succeeds.
      keycloak_ldap_email_verified_mapper_name:
        type: str
        default: email verified
        description:
          - Name of the hardcoded-attribute mapper on the federation provider.
      keycloak_ldap_group_mapper_enabled:
        type: bool
        default: true
        description:
          - Federate FreeIPA's groups as well as its users. Without it Keycloak
            can say who someone is and nothing about what they may do.
      keycloak_ldap_group_mapper_name:
        type: str
        default: freeipa-groups
        description: Name of the group mapper on the federation provider.
      keycloak_ldap_group_sync:
        type: bool
        default: true
        description:
          - Import groups now rather than at a later synchronisation. Keycloak
            imports on sync and not on login, so a group created moments ago is
            otherwise invisible to keycloak_clients.
      keycloak_ldap_user_sync:
        type: bool
        default: true
        description:
          - Re-import users after the mappers are written. A mapper shapes a
            user only as they are imported, so without this a corrected mapper
            leaves every user already in the realm exactly as they were.
      keycloak_ldap_allow_master_realm:
        type: bool
        default: false
        description:
          - Permit federating the administrative realm. Only for a filtered
            provider that admits the administrator group's members; the role
            asserts both filters are set when the realm is master.
      keycloak_ldap_user_search_filter:
        type: str
        default: "(!(nsAccountLock=TRUE))"
        description:
          - LDAP filter limiting which entries the provider imports. The
            default excludes disabled accounts only.
      keycloak_ldap_groups_filter:
        type: str
        description:
          - LDAP filter limiting which groups the group mapper imports. Unset
            means every group under the groups DN.
      keycloak_ldap_clear_user_cache:
        type: bool
        default: true
        description:
          - Drop the realm's user cache after the syncs. Without it a group
            added to an existing user in the directory stays invisible to
            Keycloak, and the person is refused with every mapping correct.
      keycloak_ldap_manage_sysaccount:
        type: bool
        default: true
        description:
          - Create and verify the FreeIPA bind account. Set false on a second
            invocation against the same directory.
      keycloak_ldap_no_log:
        type: bool
        default: true
        description: Set false only when debugging; it prints credentials.
