---
keycloak_ldap_enabled: true

# --- the FreeIPA side ------------------------------------------------------
keycloak_ldap_ipa_host: core01
keycloak_ldap_ipa_container: freeipa-server
keycloak_ldap_base_dn: dc=dev,dc=lo
keycloak_ldap_users_dn: cn=users,cn=accounts,dc=dev,dc=lo
# Where FreeIPA keeps user groups. The authorisation half of the federation:
# ipa_sso_groups creates two groups per application under this subtree, and the
# group mapper below is what makes them visible to Keycloak.
keycloak_ldap_groups_dn: cn=groups,cn=accounts,dc=dev,dc=lo
keycloak_ldap_bind_user: keycloak

# Secrets, sourced from ~/.config/rke2lab/env.sh by the caller.
# keycloak_ldap_dir_manager_password:
# keycloak_ldap_bind_password:

# --- the Keycloak side -----------------------------------------------------
#
# Set false to create and verify the bind account without touching Keycloak,
# which is what a cluster whose Keycloak is not yet running needs.
keycloak_ldap_configure_keycloak: true

keycloak_ldap_url: null
keycloak_ldap_ca_file: /etc/ssl/certs/ca-certificates.crt
# The realm the federation is added to, created by keycloak_realm.
#
# No default, and specifically not `master`, which is what this was until the
# realm role existed. Federating end users into master puts them in the realm
# that administers every other realm and holds Keycloak's own break-glass
# administrator. A default of `master` is worse than no default at all: a
# caller that forgets to pass this would federate the domain into exactly the
# place it must not go, and would do it silently.
keycloak_ldap_realm: null

# Whether this invocation is allowed to federate `master`.
#
# False, and the assertion it guards is not paranoia about a typo — it is the
# whole reason keycloak_realm exists. What it permits when set true is one
# deliberate case: a **filtered** federation whose user search filter admits
# only the members of the group that administers Keycloak, so that master gains
# a handful of platform administrators rather than the domain. Keycloak's own
# guidance is that master holds administrators and not application users or
# business identities, and a filtered provider is on the right side of that
# line. An unfiltered one is not, which is why this flag is not enough on its
# own — see keycloak_ldap_user_search_filter.
keycloak_ldap_allow_master_realm: false

keycloak_ldap_admin_user: admin
# keycloak_ldap_admin_password:
keycloak_ldap_provider_name: freeipa

# Expected to be an `ldaps://` URL on port 636. The bind is `authType: simple`
# — a password sent as-is — so an unencrypted connection publishes a credential
# that can read the entire user tree to anything on the path. This was plain
# LDAP once; see the inventory for why the argument for that did not survive
# contact with what the connection actually crosses.
#
# Two things have to be true for it to work, and the second is not this role's
# to arrange: FreeIPA must serve LDAPS (it does, on 636, by default), and
# Keycloak must trust the domain CA. The manifest mounts it into
# `conf/truststores`; `useTruststoreSpi: always` below is what points the
# provider at it.
#
# `core.dev.lo`, not `core01.dev.lo`. The inventory calls this host core01 and
# the domain calls it core, and only the second is a name anything can resolve
# — Keycloak answered the first attempt with `UnknownHost`, which is a DNS
# failure wearing an LDAP error's clothes. Under LDAPS the same name must also
# match the certificate FreeIPA presents, which is issued for the host as the
# domain knows it.
keycloak_ldap_connection_url: null

# Keycloak's generated mapper for the `rhds` vendor takes the first name from
# cn, which in FreeIPA is the full name. givenName is where the given name
# actually lives.
keycloak_ldap_first_name_mapper: first name
keycloak_ldap_first_name_attribute: givenName

# Which directory entries this provider may import.
#
# The default excludes nothing but disabled accounts: FreeIPA marks one with
# nsAccountLock, and without this a user locked out of everything else keeps
# working through Keycloak.
#
# It is a parameter rather than a constant because the administrative realm
# needs a narrower one. Federating master unfiltered would put every account in
# the domain into the realm that administers every other realm; filtered to
# `(memberOf=cn=keycloak-admins,...)` it imports only the people who administer
# Keycloak, which is what master is for. FreeIPA answers a memberOf filter for
# the bind account — verified against this directory — even though it does not
# publish the attribute freely enough for the group mapper to rely on it, which
# is why that mapper still loads groups by member attribute.
keycloak_ldap_user_search_filter: "(!(nsAccountLock=TRUE))"

# Which directory groups the group mapper may import, as an LDAP filter.
#
# Empty by default, meaning every group under the groups DN — which is what the
# application realm wants. The administrative realm wants exactly one, so that
# master does not accumulate a copy of every group in the domain for the sake
# of the one that grants administration.
#
# Left unset rather than set to an empty string when it is empty: Keycloak
# discards config keys whose value is empty, so a mapper that declared one
# could never read back matching what was written and the role would report
# changed forever.
keycloak_ldap_groups_filter: null

# The email-verified mapper.
#
# FreeIPA has no notion of a "verified" address: an account's mail attribute is
# set by an administrator in the domain, which is a stronger assurance than the
# click-a-link flow the flag was invented for. Keycloak nonetheless imports
# every federated user with emailVerified false, because nothing in the
# directory says otherwise.
#
# That default is not cosmetic. oauth2-proxy refuses to complete a login when
# the ID token carries `email_verified: false`, and it does so *after* the user
# has authenticated at Keycloak — the callback returns HTTP 500 and the log
# says `email in id_token (someone@dev.lo) isn't verified`, which reads like a
# proxy fault rather than a directory attribute. `--email-domain=*` does not
# cover it; that flag filters which domains are acceptable and is a separate
# check from whether the address is verified at all.
#
# Fixed here rather than with the proxy's
# `--insecure-oidc-allow-unverified-email`, and the choice is deliberate. The
# flag is per-service, so every future service put behind a proxy meets the
# same wall; and it is named `insecure` because it tells a proxy to stop
# checking. This mapper instead makes the claim true at the source, once, for
# the whole realm — which is honest, because FreeIPA *is* the authority for
# these addresses.
#
# Applies at import. Users already in the realm keep the false they were
# imported with, so changing this is not enough on its own — see
# keycloak_ldap_user_sync.
keycloak_ldap_email_verified_mapper_enabled: true
keycloak_ldap_email_verified_mapper_name: email verified

# The group mapper.
#
# Without it Keycloak knows who someone is and nothing about what they may do,
# which is half a federation. With it, `ipa group-add-member grafana-users
# --users alice` is the whole of granting Alice access to Grafana — the group
# arrives in Keycloak, keycloak_clients has already bound it to a client role,
# and every service reads the role out of the token.
keycloak_ldap_group_mapper_enabled: true
keycloak_ldap_group_mapper_name: freeipa-groups

# Whether to ask the federation to import groups now rather than waiting.
#
# Keycloak imports groups on a synchronisation, not on the next login, so a
# group created in FreeIPA a minute ago is invisible to a client that reads the
# realm's groups — which is exactly what keycloak_clients does. Left to a
# periodic sync, the first run after adding an application fails on a group
# that plainly exists in the directory.
keycloak_ldap_group_sync: true

# Whether to re-import the directory's *users* after the mappers are in place.
#
# The group sync above walks the group subtree; this walks the user subtree,
# and it exists for the same reason: a mapper only shapes a user as they are
# imported. Adding the email-verified mapper to a realm that already holds
# imported users changes nothing about those users until something re-reads
# them from the directory, so the run that fixes the mapper is otherwise
# exactly the run that appears not to have fixed anything.
#
# `triggerFullSync` rather than `triggerChangedUsersSync`: the changed-users
# sync selects on the directory's modify timestamp, and correcting a mapper on
# Keycloak's side does not touch it. Every user would be skipped.
keycloak_ldap_user_sync: true

# Whether to drop Keycloak's user cache after the syncs above.
#
# True, and this is the step whose absence cost the most: a directory group
# added to a user who is already in the realm is **not** visible to Keycloak
# until the cache holding that user is dropped. Neither sync does it. The
# symptom is as misleading as it gets — the group reads back correctly through
# the admin API's group-members endpoint, which queries the directory, while
# the user's own group list and every role mapping derived from it stay as they
# were, so the person is refused with "You do not have permission to access
# this resource" against a realm where every mapping is visibly correct.
#
# The cache repopulates from the database and the directory on next read, so
# dropping it costs a little latency once and nothing else. Reported unchanged
# for that reason: it leaves no state behind.
keycloak_ldap_clear_user_cache: true

# Whether this invocation manages the FreeIPA bind account.
#
# True, because a federation without a bind account is not a federation. Set
# false on a second invocation against the same directory — the administrative
# realm's provider uses the account the application realm's provider already
# created, and creating it twice is two Directory Manager binds for one
# outcome.
keycloak_ldap_manage_sysaccount: true

keycloak_ldap_no_log: true
