---

- name: sysaccount | Look for the existing bind account
  changed_when: false
  delegate_to: "{{ keycloak_ldap_ipa_host }}"
  no_log: "{{ keycloak_ldap_no_log | bool }}"
  register: _reg_keycloak_ldap_existing
  ansible.builtin.shell:
    cmd: |
      docker exec -i {{ keycloak_ldap_ipa_container }} bash -c '
        ldapsearch -x -D "cn=Directory Manager" \
          -w "$(cat)" -b "{{ _var_keycloak_ldap_bind_dn }}" \
          -s base dn 2>&1 | grep -c "^dn: " || true'
    stdin: "{{ keycloak_ldap_dir_manager_password }}"

- name: sysaccount | Create the bind account
  when: "'1' not in _reg_keycloak_ldap_existing['stdout']"
  changed_when: true
  delegate_to: "{{ keycloak_ldap_ipa_host }}"
  no_log: "{{ keycloak_ldap_no_log | bool }}"
  ansible.builtin.shell:
    cmd: |
      docker exec -i {{ keycloak_ldap_ipa_container }} bash -c '
        read -r DM
        read -r BINDPW
        ldapmodify -x -D "cn=Directory Manager" -w "${DM}" <<LDIF
      dn: {{ _var_keycloak_ldap_bind_dn }}
      changetype: add
      objectClass: account
      objectClass: simpleSecurityObject
      uid: {{ keycloak_ldap_bind_user }}
      userPassword: ${BINDPW}
      passwordExpirationTime: 20380119031407Z
      nsIdleTimeout: 0
      LDIF'
    stdin: |
      {{ keycloak_ldap_dir_manager_password }}
      {{ keycloak_ldap_bind_password }}

- name: sysaccount | Prove the account can bind and read users
  changed_when: false
  delegate_to: "{{ keycloak_ldap_ipa_host }}"
  no_log: "{{ keycloak_ldap_no_log | bool }}"
  register: _reg_keycloak_ldap_probe
  ansible.builtin.shell:
    cmd: |
      docker exec -i {{ keycloak_ldap_ipa_container }} bash -c '
        ldapsearch -x -D "{{ _var_keycloak_ldap_bind_dn }}" -w "$(cat)" \
          -b "{{ keycloak_ldap_users_dn }}" \
          "(objectClass=person)" uid 2>&1 | grep -c "^uid: " || true'
    stdin: "{{ keycloak_ldap_bind_password }}"

- name: sysaccount | Assert the bind account can read the user tree
  ansible.builtin.assert:
    that:
      - (_reg_keycloak_ldap_probe['stdout'] | trim | int) > 0
    fail_msg: >-
      The bind account exists but returned no users from
      {{ keycloak_ldap_users_dn }}. Keycloak would report this as a successful
      connection with an empty directory, which is the least useful shape a
      failure can take.
    quiet: true
