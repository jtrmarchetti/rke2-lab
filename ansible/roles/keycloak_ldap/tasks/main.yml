---
# Federates Keycloak to FreeIPA over LDAP, so the domain stays the one place a
# person exists.
#
# The alternative — Keycloak holding its own users — would give this lab two
# identity stores that agree only as long as someone maintains both. FreeIPA is
# already the authority: it holds the users, the groups, the password policy
# and the CA. Keycloak's job here is to speak OIDC on top of that, not to
# become a second copy of it.
#
# Two halves, and they run against different hosts:
#
#   - A bind account in FreeIPA. A *system account* under cn=sysaccounts, not a
#     user: it has no POSIX identity, cannot log in anywhere, and exists only
#     to read the directory. FreeIPA has no CLI for these, so it is created
#     with ldapmodify as Directory Manager — the one operation in this
#     repository that needs that credential.
#   - A user federation provider in Keycloak, configured through the admin API,
#     read before written so a second run changes nothing.

- name: main | Assert the required inputs are present
  ansible.builtin.assert:
    that:
      - (keycloak_ldap_ipa_host | length) > 0
      - (keycloak_ldap_dir_manager_password | length) >= 8
      - (keycloak_ldap_bind_password | length) >= 12
      # default('', true) rather than a bare length, because the default is
      # now null: an unset realm has to reach the message below rather than
      # raising on `None | length` before anyone reads it.
      - not (keycloak_ldap_configure_keycloak | bool)
        or ((keycloak_ldap_realm | default('', true) | length) > 0
            and (keycloak_ldap_realm != 'master'
                 or (keycloak_ldap_allow_master_realm | bool)))
    fail_msg: >-
      keycloak_ldap needs the identity host, the Directory Manager password
      (FREEIPA_DIR_MANAGER_PASSWORD), and a bind password for the system
      account. All come from ~/.config/rke2lab/env.sh; see plan/SECRETS.md.
      When it is configuring Keycloak it also needs the realm, which must not
      be master unless keycloak_ldap_allow_master_realm is set — that realm
      administers every other realm and holds Keycloak's own break-glass
      administrator, so federated end users do not belong in it. See the
      keycloak_realm role.
    quiet: true

# Master unfiltered is the failure this exists to prevent, and it is not the
# same mistake as federating master at all. A filtered provider puts the people
# who administer Keycloak into the realm that administers Keycloak, which is
# what master is for. An unfiltered one puts every account in the domain there,
# which is what Keycloak's own guidance is about — and the flag above, on its
# own, does not distinguish the two.
- name: main | Assert a federation of the administrative realm is filtered
  when:
    - (keycloak_ldap_configure_keycloak | bool)
    - keycloak_ldap_realm == 'master'
  ansible.builtin.assert:
    that:
      - >-
        keycloak_ldap_user_search_filter !=
        (_var_keycloak_ldap_unfiltered_default)
      - (keycloak_ldap_groups_filter | default('', true) | length) > 0
    fail_msg: >-
      Federating master needs both a user search filter narrower than the
      default and a group filter. Without them this provider imports every
      account and every group in the domain into the realm that administers
      every other realm. Pass keycloak_ldap_user_search_filter restricted to
      the administrator group's members — a memberOf filter — and
      keycloak_ldap_groups_filter naming that one group.
    quiet: true

- name: main | Ensure the LDAP bind system account exists
  when: (keycloak_ldap_manage_sysaccount | bool)
  ansible.builtin.include_tasks: sysaccount.yml

- name: main | Configure the Keycloak user federation
  when: (keycloak_ldap_configure_keycloak | bool)
  ansible.builtin.include_tasks: federation.yml
