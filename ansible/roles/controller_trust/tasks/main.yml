---

- name: main | Install the domain certificate authority
  when: (controller_trust_enabled | bool)
  become: true
  register: _reg_controller_trust_ca
  ansible.builtin.get_url:
    url: "{{ controller_trust_ca_url }}"
    dest: "{{ controller_trust_ca_path }}"
    owner: root
    group: root
    mode: "0644"

- name: main | Rebuild the system trust bundle
  when:
    - (controller_trust_enabled | bool)
    - _reg_controller_trust_ca is changed
  changed_when: true
  become: true
  ansible.builtin.command:
    cmd: "{{ controller_trust_update_command }}"

- name: main | Prove the domain certificate now verifies
  when: (controller_trust_enabled | bool)
  changed_when: false
  ansible.builtin.uri:
    url: "{{ controller_trust_verify_url }}"
    method: HEAD
    ca_path: "{{ controller_trust_system_bundle }}"
    status_code: [200, 302, 401, 404]

- name: main | Record the host keys of every managed host
  when:
    - (controller_trust_enabled | bool)
    - (controller_trust_hosts | length) > 0
  loop: "{{ controller_trust_hosts }}"
  loop_control:
    loop_var: _item_controller_trust_host
    label: "{{ _item_controller_trust_host }}"
  ansible.builtin.known_hosts:
    name: "{{ _item_controller_trust_host }}"
    key: "{{ lookup('pipe', controller_trust_keyscan ~ ' ' ~ _item_controller_trust_host) }}"
    path: "{{ controller_trust_known_hosts }}"
    state: present
