---

- name: main | Assert the required inputs are present
  when: (keycloak_realm_admins_enabled | bool)
  ansible.builtin.assert:
    that:
      - (keycloak_realm_admins_url | length) > 0
      - (keycloak_realm_admins_realm | length) > 0
      - keycloak_realm_admins_realm != 'master'
        or (keycloak_realm_admins_allow_master_realm | bool)
      - (keycloak_realm_admins_group | length) > 0
      - (keycloak_realm_admins_roles | length) > 0
      - (keycloak_realm_admins_admin_password | length) > 0
    fail_msg: >-
      keycloak_realm_admins needs Keycloak's URL, the realm administration is
      delegated over — which must not be master unless
      keycloak_realm_admins_allow_master_realm is set — the directory group, at
      least one role, and the admin password (KEYCLOAK_ADMIN_PASSWORD). See
      plan/SECRETS.md.
    quiet: true

- name: main | Delegate administration of the realm to a directory group
  when:
    - (keycloak_realm_admins_enabled | bool)

    - not ansible_check_mode
  block:
    - name: main | Obtain an admin token
      no_log: "{{ keycloak_realm_admins_no_log | bool }}"
      register: _reg_keycloak_realm_admins_token
      ansible.builtin.uri:
        url: >-
          {{ keycloak_realm_admins_url }}/realms/{{
          keycloak_realm_admins_admin_realm
          }}/protocol/openid-connect/token
        method: POST
        ca_path: "{{ keycloak_realm_admins_ca_file }}"
        body_format: form-urlencoded
        body:
          grant_type: password
          client_id: admin-cli
          username: "{{ keycloak_realm_admins_admin_user }}"
          password: "{{ keycloak_realm_admins_admin_password }}"

    - name: main | Read the groups the realm has imported from the directory
      changed_when: false
      no_log: "{{ keycloak_realm_admins_no_log | bool }}"
      register: _reg_keycloak_realm_admins_groups
      ansible.builtin.uri:
        url: >-
          {{ _var_keycloak_realm_admins_admin_api
          }}/groups?briefRepresentation=true&max=1000
        headers: "{{ _var_keycloak_realm_admins_headers }}"
        ca_path: "{{ keycloak_realm_admins_ca_file }}"

    - name: main | Assert the directory group has been imported into the realm
      ansible.builtin.assert:
        that:
          - (_var_keycloak_realm_admins_group_id | length) > 0
        fail_msg: >-
          The realm {{ keycloak_realm_admins_realm }} has not imported the
          group '{{ keycloak_realm_admins_group }}'. Either ipa_sso_groups has
          not created it — it is an entry in
          ipa_sso_groups_admin_only_applications, not in the application list
          — or keycloak_ldap's group mapper has not synchronised since it was
          created. The federation imports groups on a sync, not on the next
          login. Re-run keycloak_ldap.
        quiet: true

    - name: main | Grant the roles the realm holds them as
      ansible.builtin.include_tasks: >-
        {{ 'client_roles.yml'
           if (keycloak_realm_admins_client | default('', true) | length) > 0
           else 'realm_roles.yml' }}

    - name: main | Report the delegation
      ansible.builtin.debug:
        msg: >-
          Members of the FreeIPA group '{{ keycloak_realm_admins_group }}'
          hold {{ keycloak_realm_admins_roles | join(', ') }} in the
          {{ keycloak_realm_admins_realm }} realm, at
          {{ keycloak_realm_admins_url }}/admin/{{
          keycloak_realm_admins_realm }}/console. Granting it is
          `ipa group-add-member {{ keycloak_realm_admins_group }} --users
          <name>`; nothing is added in this console.
        verbosity: 0
