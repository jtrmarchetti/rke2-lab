---

- name: promote | Read the realm's user profile
  changed_when: false
  no_log: "{{ keycloak_break_glass_no_log | bool }}"
  register: _reg_keycloak_break_glass_profile
  ansible.builtin.uri:
    url: "{{ _var_keycloak_break_glass_admin_api }}/users/profile"
    headers: "{{ _var_keycloak_break_glass_headers }}"
    ca_path: "{{ keycloak_break_glass_ca_file }}"

- name: promote | Clear the temporary marker
  block:

    - name: promote | Allow unmanaged attributes for the length of one write
      changed_when: false
      no_log: "{{ keycloak_break_glass_no_log | bool }}"
      ansible.builtin.uri:
        url: "{{ _var_keycloak_break_glass_admin_api }}/users/profile"
        method: PUT
        headers: "{{ _var_keycloak_break_glass_headers }}"
        ca_path: "{{ keycloak_break_glass_ca_file }}"
        body_format: json
        body: "{{ _var_keycloak_break_glass_profile_open }}"
        status_code: [200]

    - name: promote | Write the administrator without the temporary marker
      changed_when: true
      no_log: "{{ keycloak_break_glass_no_log | bool }}"
      ansible.builtin.uri:
        url: >-
          {{ _var_keycloak_break_glass_admin_api }}/users/{{
          _var_keycloak_break_glass_user_id | trim }}
        method: PUT
        headers: "{{ _var_keycloak_break_glass_headers }}"
        ca_path: "{{ keycloak_break_glass_ca_file }}"
        body_format: json
        body: >-
          {{ _var_keycloak_break_glass_current
             | combine({'attributes':
                        _var_keycloak_break_glass_kept_attributes}) }}
        status_code: [204]
  always:
    - name: promote | Restore the realm's user profile
      changed_when: false
      no_log: "{{ keycloak_break_glass_no_log | bool }}"
      ansible.builtin.uri:
        url: "{{ _var_keycloak_break_glass_admin_api }}/users/profile"
        method: PUT
        headers: "{{ _var_keycloak_break_glass_headers }}"
        ca_path: "{{ keycloak_break_glass_ca_file }}"
        body_format: json
        body: "{{ _var_keycloak_break_glass_profile }}"
        status_code: [200]
