---

- name: retention | Select the transit artifacts confirmed present in GitLab
  ansible.builtin.set_fact:
    _rke2_publish_retire: >-
      {{ rke2_publish_manifest
         | rejectattr('type', 'equalto', 'mirror')
         | selectattr('retention', 'defined')
         | selectattr('retention', 'equalto', 'transit')
         | selectattr('name', 'in', _var_rke2_publish_confirmed_names)
         | list }}

- name: retention | Report what is being retired from local storage
  ansible.builtin.debug:
    msg: >-
      {{ _rke2_publish_retire | length }} transit artifact(s) confirmed in
      GitLab and no longer needed on this host:
      {{ _rke2_publish_retire | map(attribute='name') | join(', ')
         | default('none', true) }}

- name: retention | Record the source each published artifact was staged from
  loop: "{{ _rke2_publish_retire }}"
  loop_control:
    loop_var: _item_rke2_publish_retire
    label: "{{ _item_rke2_publish_retire['name'] }}"
  vars:
    # The marker is named after the source the artifact was staged from
    # (the entry's url, or its image reference), reduced to characters
    # that are safe in a file name. artifact_stage only honours a marker
    # while the entry's current source matches the recorded one, so a
    # version bump re-stages the artifact instead of being skipped.
    _rke2_publish_retire_marker_source: >-
      {{ _item_rke2_publish_retire.get('url',
         _item_rke2_publish_retire.get('image', ''))
         | regex_replace('[^A-Za-z0-9._~-]', '') }}
  ansible.builtin.copy:
    content: ""
    force: false
    dest: >-
      {{ rke2_publish_artifact_root
         }}/{{ _item_rke2_publish_retire['dest']
         }}{{ _var_rke2_publish_published_suffix
         }}.{{ _rke2_publish_retire_marker_source }}
    owner: root
    group: root
    mode: "0644"
    # The marker is an empty file whose *name* records the source, so an
    # existing marker is byte-identical and the write is a no-op; touch
    # would bump the mtime and report changed on every run.

- name: retention | Remove the local copy of each published transit artifact
  loop: "{{ _rke2_publish_retire }}"
  loop_control:
    loop_var: _item_rke2_publish_retire
    label: "{{ _item_rke2_publish_retire['name'] }}"
  ansible.builtin.file:
    path: "{{ rke2_publish_artifact_root }}/{{ _item_rke2_publish_retire['dest'] }}"
    state: absent
