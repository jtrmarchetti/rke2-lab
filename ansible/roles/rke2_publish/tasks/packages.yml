---
# The generic package registry holds what a node needs before it has a container
# runtime that can talk to the image registry: the installer, the binary
# tarball, and the checksum file install.sh verifies the binary against.

- name: packages | Read the published package files
  no_log: "{{ rke2_publish_no_log | bool }}"
  register: _reg_rke2_publish_packages
  ansible.builtin.uri:
    timeout: "{{ rke2_publish_api_timeout }}"
    url: >-
      {{ _var_rke2_publish_api }}/projects/{{
      _reg_rke2_publish_packages_project_get['json']['id']
      }}/packages?package_name={{
      rke2_publish_package_name }}&package_type=generic&per_page={{
      _var_rke2_publish_page_size }}
    headers: "{{ _var_rke2_publish_headers }}"

- name: packages | Read the file list of the matching package version
  when: _item_rke2_publish_package['version'] == rke2_publish_package_version
  no_log: "{{ rke2_publish_no_log | bool }}"
  register: _reg_rke2_publish_package_files
  loop: "{{ _reg_rke2_publish_packages['json'] }}"
  loop_control:
    loop_var: _item_rke2_publish_package
    label: "{{ _item_rke2_publish_package['name'] }} {{ _item_rke2_publish_package['version'] }}"
  ansible.builtin.uri:
    timeout: "{{ rke2_publish_api_timeout }}"
    url: >-
      {{ _var_rke2_publish_api }}/projects/{{
      _reg_rke2_publish_packages_project_get['json']['id'] }}/packages/{{
      _item_rke2_publish_package['id'] }}/package_files?per_page={{ _var_rke2_publish_page_size }}
    headers: "{{ _var_rke2_publish_headers }}"

- name: packages | Report what is already published
  ansible.builtin.debug:
    msg: >-
      package {{ rke2_publish_package_name }}
      {{ rke2_publish_package_version }} holds
      {{ _var_rke2_publish_published_files | length }} files
    verbosity: 0

# GitLab keeps every upload as a new package file rather than replacing the
# previous one, so re-uploading a file that is already there does not overwrite
# it — it accumulates duplicates that the download endpoint then has to
# disambiguate. Skipping what is present is correctness here, not just speed.
- name: packages | Upload the missing package files
  when: _item_rke2_publish_package_file not in _var_rke2_publish_published_files
  no_log: "{{ rke2_publish_no_log | bool }}"
  loop: "{{ rke2_publish_package_files }}"
  loop_control:
    loop_var: _item_rke2_publish_package_file
    label: "{{ _item_rke2_publish_package_file }}"
  ansible.builtin.uri:
    url: >-
      {{ _var_rke2_publish_api }}/projects/{{
      _reg_rke2_publish_packages_project_get['json']['id']
      }}/packages/generic/{{ rke2_publish_package_name }}/{{
      rke2_publish_package_version | urlencode }}/{{ _item_rke2_publish_package_file }}
    method: PUT
    headers: "{{ _var_rke2_publish_headers }}"
    src: "{{ rke2_publish_artifact_dir }}/{{ _item_rke2_publish_package_file }}"
    remote_src: true
    timeout: "{{ rke2_publish_push_timeout }}"
    status_code: [200, 201]

- name: packages | Report the package download base
  ansible.builtin.debug:
    msg: >-
      packages available at {{ _var_rke2_publish_api }}/projects/{{
      _reg_rke2_publish_packages_project_get['json']['id']
      }}/packages/generic/{{ rke2_publish_package_name }}/{{
      rke2_publish_package_version }}/
    verbosity: 0
