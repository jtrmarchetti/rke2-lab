---

- name: image_set | Check for a tarball on disk
  ansible.builtin.stat:
    path: "{{ _var_rke2_publish_set_dir }}/{{ _item_rke2_publish_set['tarball'] }}"
  register: _reg_rke2_publish_set_tarball

- name: image_set | Check for an image list on disk
  when: _item_rke2_publish_set['list'] is defined
  ansible.builtin.stat:
    path: "{{ _var_rke2_publish_set_dir }}/{{ _item_rke2_publish_set['list'] }}"
  register: _reg_rke2_publish_set_list_stat

- name: image_set | Check for the list's source marker
  # The staging step records which URL the on-disk list came from in a
  # marker file next to it. Absence of that marker means the body may
  # still name the previous release, so the list is refetched even when
  # it exists: the tarball must contain what the list promises.
  when:
    - not ansible_check_mode
    - _item_rke2_publish_set['list'] is defined
    - >-
      (rke2_publish_manifest
       | selectattr('type', 'equalto', 'file')
       | selectattr('dest', 'equalto', (_var_rke2_publish_set_dir | basename ~ '/' ~ _item_rke2_publish_set['list']))
       | list | length) > 0
  ansible.builtin.stat:
    path: >-
      {{ _var_rke2_publish_set_dir }}/{{ _item_rke2_publish_set['list'] }}.published.{{ (rke2_publish_manifest
          | selectattr('type', 'equalto', 'file')
          | selectattr('dest', 'equalto', (_var_rke2_publish_set_dir | basename ~ '/' ~ _item_rke2_publish_set['list']))
          | first).url | regex_replace('[^A-Za-z0-9._~-]', '') }}
  register: _reg_rke2_publish_set_list_marker

- name: image_set | Check for the tarball's source marker
  when:
    - not ansible_check_mode
    - >-
      (rke2_publish_manifest
       | selectattr('type', 'equalto', 'file')
       | selectattr('dest', 'equalto', (_var_rke2_publish_set_dir | basename ~ '/' ~ _item_rke2_publish_set['tarball']))
       | list | length) > 0
  ansible.builtin.stat:
    path: >-
      {{ _var_rke2_publish_set_dir }}/{{ _item_rke2_publish_set['tarball'] }}.published.{{ (rke2_publish_manifest
          | selectattr('type', 'equalto', 'file')
          | selectattr('dest', 'equalto', (_var_rke2_publish_set_dir | basename ~ '/' ~ _item_rke2_publish_set['tarball']))
          | first).url | regex_replace('[^A-Za-z0-9._~-]', '') }}
  register: _reg_rke2_publish_set_tarball_marker

- name: image_set | Refetch the image list from its manifest URL
  # Retention deletes staged bodies after a successful push, so a set that
  # still publishes must re-fetch whatever it no longer has on disk. The
  # URL comes from the manifest entry named after the file: re-publishing
  # must not depend on whatever an earlier run happened to stage. force:
  # because an old on-disk copy is exactly the case this repairs —
  # Last-Modified would keep a stale list that still names the previous
  # release, and the set would then compute nothing missing.
  when:
    - not ansible_check_mode
    - _item_rke2_publish_set['list'] is defined
    - >-
      not (_reg_rke2_publish_set_list_stat.stat.exists | default(false))
      or not (_reg_rke2_publish_set_list_marker.stat.exists | default(false))
    - >-
      (rke2_publish_manifest
       | selectattr('type', 'equalto', 'file')
       | selectattr('dest', 'equalto', (_var_rke2_publish_set_dir | basename ~ '/' ~ _item_rke2_publish_set['list']))
       | list | length) > 0
  ansible.builtin.get_url:
    url: >-
      {{ (rke2_publish_manifest
          | selectattr('type', 'equalto', 'file')
          | selectattr('dest', 'equalto', (_var_rke2_publish_set_dir | basename ~ '/' ~ _item_rke2_publish_set['list']))
          | first).url }}
    dest: "{{ _var_rke2_publish_set_dir }}/{{ _item_rke2_publish_set['list'] }}"
    force: true

- name: image_set | Record the source the list was refetched from
  when:
    - not ansible_check_mode
    - _item_rke2_publish_set['list'] is defined
    - >-
      not (_reg_rke2_publish_set_list_stat.stat.exists | default(false))
      or not (_reg_rke2_publish_set_list_marker.stat.exists | default(false))
    - >-
      (rke2_publish_manifest
       | selectattr('type', 'equalto', 'file')
       | selectattr('dest', 'equalto', (_var_rke2_publish_set_dir | basename ~ '/' ~ _item_rke2_publish_set['list']))
       | list | length) > 0
  vars:
    _rke2_publish_list_marker: >-
      {{ _var_rke2_publish_set_dir }}/{{ _item_rke2_publish_set['list'] }}.published.{{ (rke2_publish_manifest
          | selectattr('type', 'equalto', 'file')
          | selectattr('dest', 'equalto', (_var_rke2_publish_set_dir | basename ~ '/' ~ _item_rke2_publish_set['list']))
          | first).url | regex_replace('[^A-Za-z0-9._~-]', '') }}
  ansible.builtin.copy:
    content: ""
    force: false
    dest: "{{ _rke2_publish_list_marker }}"
    owner: root
    group: root
    mode: "0644"
    # Writing the marker after the refetch is what makes the gate above
    # settle: once it exists, the next run sees a source-matched marker
    # and leaves the list alone, so a steady-state run reports no change.

- name: image_set | Read the release image list
  when: _item_rke2_publish_set['list'] is defined
  register: _reg_rke2_publish_set_list
  ansible.builtin.slurp:
    src: "{{ _var_rke2_publish_set_dir }}/{{ _item_rke2_publish_set['list'] }}"

- name: image_set | Determine what this set should publish
  ansible.builtin.set_fact:
    _rke2_publish_set_sources: >-
      {{ (_reg_rke2_publish_set_list['content'] | b64decode).splitlines()
         | map('trim') | select | list
         if _item_rke2_publish_set['list'] is defined
         else [_item_rke2_publish_set['image']] }}

- name: image_set | Assert every source image names its registry
  loop: "{{ _rke2_publish_set_sources }}"
  loop_control:
    loop_var: _item_rke2_publish_source
  ansible.builtin.assert:
    that:
      - (_item_rke2_publish_source.split('/') | length) > 2
      - _item_rke2_publish_source.split('/')[0] is search('[.:]')
      - (_item_rke2_publish_source.split('/') | last) is search(':')
    fail_msg: >-
      '{{ _item_rke2_publish_source }}' in set '{{ _item_rke2_publish_set['name'] }}' is not a fully
      qualified image reference. The registry host is stripped to build the
      GitLab path, and the containerd rewrite rule has to match what was
      pushed, so a bare name here would publish to a path no node asks for.
    quiet: true

- name: image_set | Determine what is missing from the registry
  ansible.builtin.set_fact:
    _rke2_publish_set_missing: >-
      {{ _rke2_publish_set_sources
         | zip(_rke2_publish_set_sources
               | map('regex_replace', '^[^/]+/(.*)$',
                     _var_rke2_publish_registry_prefix ~ '/\1')
               | list)
         | rejectattr(1, 'in', _var_rke2_publish_existing_refs)
         | map(attribute=0) | list }}

- name: image_set | Refetch the tarball from its manifest URL
  # Gated on missing images so a set that is already fully published does
  # not re-download a multi-GB body it no longer needs. When the tarball
  # exists but has no source marker matching the current manifest URL it
  # is equally refetched: a leftover from the previous release would fail
  # the "contains what the list promised" check below.
  when:
    - not ansible_check_mode
    - _rke2_publish_set_missing | length > 0
    - >-
      not (_reg_rke2_publish_set_tarball.stat.exists | default(false))
      or not (_reg_rke2_publish_set_tarball_marker.stat.exists | default(false))
    - >-
      (rke2_publish_manifest
       | selectattr('type', 'equalto', 'file')
       | selectattr('dest', 'equalto', (_var_rke2_publish_set_dir | basename ~ '/' ~ _item_rke2_publish_set['tarball']))
       | list | length) > 0
  ansible.builtin.get_url:
    url: >-
      {{ (rke2_publish_manifest
          | selectattr('type', 'equalto', 'file')
          | selectattr('dest', 'equalto', (_var_rke2_publish_set_dir | basename ~ '/' ~ _item_rke2_publish_set['tarball']))
          | first).url }}
    dest: "{{ _var_rke2_publish_set_dir }}/{{ _item_rke2_publish_set['tarball'] }}"
    force: true

- name: image_set | Record the source the tarball was refetched from
  when:
    - not ansible_check_mode
    - _rke2_publish_set_missing | length > 0
    - >-
      not (_reg_rke2_publish_set_tarball.stat.exists | default(false))
      or not (_reg_rke2_publish_set_tarball_marker.stat.exists | default(false))
    - >-
      (rke2_publish_manifest
       | selectattr('type', 'equalto', 'file')
       | selectattr('dest', 'equalto', (_var_rke2_publish_set_dir | basename ~ '/' ~ _item_rke2_publish_set['tarball']))
       | list | length) > 0
  vars:
    _rke2_publish_tarball_marker: >-
      {{ _var_rke2_publish_set_dir }}/{{ _item_rke2_publish_set['tarball'] }}.published.{{ (rke2_publish_manifest
          | selectattr('type', 'equalto', 'file')
          | selectattr('dest', 'equalto', (_var_rke2_publish_set_dir | basename ~ '/' ~ _item_rke2_publish_set['tarball']))
          | first).url | regex_replace('[^A-Za-z0-9._~-]', '') }}
  ansible.builtin.copy:
    content: ""
    force: false
    dest: "{{ _rke2_publish_tarball_marker }}"
    owner: root
    group: root
    mode: "0644"
    # The retention step writes this same marker before it deletes the
    # body, and the staging step writes it after a download: one byte-
    # identical scheme, three writers.

- name: image_set | Report this set
  ansible.builtin.debug:
    msg: >-
      {{ _item_rke2_publish_set['name'] }}:
      {{ _rke2_publish_set_missing | length }} of
      {{ _rke2_publish_set_sources | length }} images to publish
    verbosity: 0

- name: image_set | Load and push the missing images
  when: (_rke2_publish_set_missing | length) > 0
  block:
    - name: image_set | Log in to the registry with push rights
      no_log: "{{ rke2_publish_no_log | bool }}"
      community.docker.docker_login:
        registry_url: "{{ rke2_publish_registry_host }}"
        username: root
        password: "{{ rke2_publish_root_password }}"

    - name: image_set | Load the staged tarball
      register: _reg_rke2_publish_loaded
      community.docker.docker_image_load:
        path: >-
          {{ _var_rke2_publish_set_dir }}/{{ _item_rke2_publish_set['tarball'] }}

    - name: image_set | Assert the tarball contained what the list promised
      loop: "{{ _rke2_publish_set_missing }}"
      loop_control:
        loop_var: _item_rke2_publish_missing
      ansible.builtin.assert:
        that:
          - >-
            (_item_rke2_publish_missing | regex_replace('^docker\.io/', ''))
            in _reg_rke2_publish_loaded['image_names']
        fail_msg: >-
          {{ _item_rke2_publish_set['tarball'] }} does not contain '{{ _item_rke2_publish_missing }}',
          which its own list file names. The tarball and the list come from the
          same release and must agree; if they do not, one of them was staged
          against a different version.
        quiet: true

    - name: image_set | Publish each missing image
      loop: "{{ _rke2_publish_set_missing }}"
      loop_control:
        loop_var: _item_rke2_publish_image
        label: "{{ _item_rke2_publish_image }}"
      ansible.builtin.include_tasks: image_push.yml
