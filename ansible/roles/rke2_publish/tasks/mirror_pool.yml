---

- name: mirror_pool | Copy the missing images into the GitLab registry in bounded parallel # noqa: command-instead-of-module
  when: _rke2_publish_mirror_missing | length > 0
  no_log: "{{ rke2_publish_no_log | bool }}"
  register: _reg_rke2_publish_mirror_result
  retries: "{{ rke2_publish_mirror_task_retries }}"
  delay: "{{ rke2_publish_mirror_task_delay }}"
  until: _reg_rke2_publish_mirror_result['rc'] == 0
  ansible.builtin.shell:
    executable: /bin/bash
    cmd: |
      set -uo pipefail
      n="{{ rke2_publish_mirror_parallelism }}"
      [ "$n" -ge 1 ] || n=1
      prefix="{{ _var_rke2_publish_registry_prefix }}"
      work=$(mktemp -d /tmp/rke2-mirror.XXXXXX)
      trap 'rm -rf "$work"' EXIT
      images=(
        {% for m in _rke2_publish_mirror_missing %}
        "{{ m['image'] }}"
        {% endfor %}
      )
      total=0
      : > "$work/log"
      for (( w = 0; w < n; w++ )); do
        : > "$work/shard-$w"
      done
      for img in "${images[@]}"; do
        printf '%s %s\n' "$img" "$prefix/${img#*/}" >> "$work/shard-$(( total % n ))"
        total=$(( total + 1 ))
      done
      pids=()
      for (( w = 0; w < n; w++ )); do
        (
          while read -r s t; do
            if ! {{ rke2_publish_skopeo_binary }} copy --all --preserve-digests \
                  --retry-times {{ rke2_publish_mirror_retries }} \
                  --dest-creds root:{{ rke2_publish_root_password }} \
                  docker://"${s}" docker://"${t}" >> "$work/log" 2>&1; then
              echo "FAILED ${s} -> ${t}" >> "$work/log"
              exit 1
            fi
          done < "$work/shard-$w"
        ) &
        pids+=("$!")
      done
      rc=0
      for p in "${pids[@]}"; do
        if ! wait "$p"; then
          rc=1
        fi
      done
      cat "$work/log"
      exit "$rc"
