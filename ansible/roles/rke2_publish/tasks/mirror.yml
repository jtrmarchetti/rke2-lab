---

- name: mirror | Ensure skopeo is installed
  ansible.builtin.apt:
    name: "{{ rke2_publish_skopeo_package }}"
    state: present

- name: mirror | Determine which images are missing from the registry
  ansible.builtin.set_fact:
    _rke2_publish_mirror_missing: >-
      {{ rke2_publish_mirror_images
         | zip(rke2_publish_mirror_images | map(attribute='image')
               | map('regex_replace', '^[^/]+/(.*)$',
                     _var_rke2_publish_registry_prefix ~ '/\1')
               | list)
         | rejectattr(1, 'in', _var_rke2_publish_existing_refs)
         | map(attribute=0) | list }}

- name: mirror | Report what is being mirrored
  ansible.builtin.debug:
    msg: >-
      {{ _rke2_publish_mirror_missing | length }} of
      {{ rke2_publish_mirror_images | length }} mirrored images to copy
    verbosity: 0

- name: mirror | Copy the missing images into the registry in bounded parallel
  ansible.builtin.include_tasks: mirror_pool.yml
