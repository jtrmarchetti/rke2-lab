---
# Images copied registry to registry, without ever landing on this host.
#
# This is the second image path in the role, and the reason there are two is
# worth stating plainly, because "we have two mechanisms for the same thing" is
# usually a smell.
#
# The tarball path above exists for images that must be *served from Apache* —
# FreeIPA's and GitLab's own images arrive on hosts that have no registry to
# pull from, so a loadable file is the only delivery that works. It is also how
# RKE2's release image sets arrive, because the vendor publishes them as airgap
# tarball assets with their own list files.
#
# Everything else is a registry-to-registry transit: upstream registry to the
# GitLab mirror, consumed by nodes that can reach GitLab. Routing that through
# `docker pull` -> `docker save` -> `docker load` -> `docker push` was the
# original mechanism and it is strictly worse — four copies of the bytes, a
# multi-gigabyte staging tree, and a dependency on the local image store.
#
# It is also broken. Docker's containerd image store discards the compressed
# blobs once a layer is unpacked, so an image that pulls and runs perfectly
# cannot be exported: `docker save` writes a manifest with no layers and the
# push fails with "does not provide any platform" — an error that names the
# platform when the actual fault is missing content. This is moby/moby#52897
# and docker/cli#5476, and it is not a configuration mistake to be fixed here.
#
# skopeo copies by digest, streams the blobs, verifies the source digest, and
# needs neither a local image store nor a byte of local disk.

- name: mirror | Ensure skopeo is installed
  ansible.builtin.apt:
    name: "{{ rke2_publish_skopeo_package }}"
    state: present

- name: mirror | Determine which images are missing from the registry
  ansible.builtin.set_fact:
    _rke2_publish_mirror_missing: >-
      {{ rke2_publish_mirror_images
         | zip(rke2_publish_mirror_images | map(attribute='image')
               | map('regex_replace', '^[^/]+/(.*)$',
                     _var_rke2_publish_registry_prefix ~ '/\1')
               | list)
         | rejectattr(1, 'in', _var_rke2_publish_existing_refs)
         | map(attribute=0) | list }}

- name: mirror | Report what is being mirrored
  ansible.builtin.debug:
    msg: >-
      {{ _rke2_publish_mirror_missing | length }} of
      {{ rke2_publish_mirror_images | length }} mirrored images to copy
    verbosity: 0

- name: mirror | Copy each missing image into the registry
  loop: "{{ _rke2_publish_mirror_missing }}"
  loop_control:
    loop_var: _item_rke2_publish_mirror
    label: "{{ _item_rke2_publish_mirror['image'] }}"
  ansible.builtin.include_tasks: mirror_copy.yml
