---
- name: main | Assert the required inputs are present
  when: (rke2_publish_enabled | bool)
  ansible.builtin.assert:
    that:
      - (rke2_publish_root_password | default('') | length) > 0
      - (rke2_publish_artifact_dir | length) > 0
      - (rke2_publish_package_version | length) > 0
    fail_msg: >-
      rke2_publish needs rke2_publish_root_password, an artifact directory, and
      a package version. The password comes from GITLAB_ROOT_PASSWORD in
      ~/.config/rke2lab/env.sh; see plan/SECRETS.md.
    quiet: true

- name: main | Publish the RKE2 artifact set into GitLab
  when:
    - (rke2_publish_enabled | bool)
    - not ansible_check_mode
  block:
    # Every API call below needs a GitLab admin credential. One per run for
    # the whole role set rather than one per role: the gitlab_admin_token
    # role proves the token recorded on this host still authenticates and
    # pays the gitlab-rails mint only when none is recorded, or the
    # recorded one has outlived its day. A credential that outlives the run
    # is the design now — bounded by the token's one-day expiry rather than
    # by a revoke at the end of every role, which is what left the revoke
    # loop on a failed run.
    - name: main | Ensure the GitLab admin token
      ansible.builtin.include_role:
        name: gitlab_admin_token
        apply:
          vars:
            gitlab_admin_token_url: "{{ rke2_publish_gitlab_url }}"
            gitlab_admin_token_file: "{{ rke2_publish_admin_token_file }}"
            gitlab_admin_token_no_log: "{{ rke2_publish_no_log }}"

    # The role wrote it on this host; the slurp is the handoff, the same
    # shape the gitops roles use against the deploy token file.
    - name: main | Read the recorded admin token
      no_log: "{{ rke2_publish_no_log | bool }}"
      register: _reg_rke2_publish_admin_token
      ansible.builtin.slurp:
        src: "{{ rke2_publish_admin_token_file }}"

    - name: main | Ensure the GitLab group and projects exist
      ansible.builtin.include_tasks: gitlab_project.yml

    - name: main | Ensure the read-only deploy token exists
      ansible.builtin.include_tasks: deploy_token.yml

    - name: main | Publish the container images
      ansible.builtin.include_tasks: images.yml

    - name: main | Mirror the registry-to-registry images
      when: (rke2_publish_mirror_images | length) > 0
      ansible.builtin.include_tasks: mirror.yml

    - name: main | Publish the Helm charts
      when: (rke2_publish_chart_sets | length) > 0
      ansible.builtin.include_tasks: charts.yml

    - name: main | Publish the generic packages
      ansible.builtin.include_tasks: packages.yml

    # Last, and only after both publishing steps have returned. Retiring a
    # local copy before its destination is confirmed would delete the only
    # copy that exists.
    - name: main | Retire the local copies of published transit artifacts
      when: (rke2_publish_apply_retention | bool)
      ansible.builtin.include_tasks: retention.yml
