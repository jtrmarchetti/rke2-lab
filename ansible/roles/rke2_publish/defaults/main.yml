---
rke2_publish_enabled: true

rke2_publish_gitlab_url: null
rke2_publish_registry_host: null

rke2_publish_group: rke2
rke2_publish_images_project: images
rke2_publish_packages_project: packages

rke2_publish_charts_project: charts

rke2_publish_deploy_token_name: rke2-nodes

rke2_publish_deploy_token_scopes:
  - read_registry
  - read_package_registry

rke2_publish_deploy_token_file: /data1/gitlab/rke2-deploy-token.yml

rke2_publish_deploy_token_username: ""
rke2_publish_deploy_token_value: ""

rke2_publish_admin_token_file: /data1/gitlab/admin-token.yml

rke2_publish_artifact_dir: /data1/artifacts/rke2

rke2_publish_manifest: null
rke2_publish_artifact_root: null

rke2_publish_image_sets:
  - name: core
    tarball: rke2-images-core.linux-amd64.tar.zst
    list: rke2-images-core.linux-amd64.txt
  - name: cilium
    tarball: rke2-images-cilium.linux-amd64.tar.zst
    list: rke2-images-cilium.linux-amd64.txt

  - name: traefik
    tarball: rke2-images-traefik.linux-amd64.tar.zst
    list: rke2-images-traefik.linux-amd64.txt

rke2_publish_extra_images:
  - name: kube-vip
    tarball: kube-vip-v1.2.3.tar
    image: ghcr.io/kube-vip/kube-vip:v1.2.3

rke2_publish_mirror_images: "{{ _var_rke2_publish_manifest_mirrors }}"
rke2_publish_skopeo_package: skopeo
rke2_publish_skopeo_binary: /usr/bin/skopeo

rke2_publish_mirror_retries: 3

rke2_publish_mirror_task_retries: 3
rke2_publish_mirror_task_delay: 30
rke2_publish_mirror_parallelism: 3

rke2_publish_chart_sets: []

rke2_publish_helm_binary: /usr/local/bin/helm

rke2_publish_package_name: rke2
rke2_publish_package_version: 1.35.7+rke2r1
rke2_publish_package_files:
  - install.sh
  - rke2.linux-amd64.tar.gz
  - sha256sum-amd64.txt

rke2_publish_push_timeout: 900

rke2_publish_apply_retention: true

rke2_publish_no_log: true

rke2_publish_api_timeout: 180

rke2_publish_api_retries: 3
rke2_publish_api_delay: 10
