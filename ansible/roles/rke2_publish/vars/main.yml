---
_var_rke2_publish_api: "{{ rke2_publish_gitlab_url }}/api/v4"

_var_rke2_publish_registry_prefix: >-
  {{ rke2_publish_registry_host }}/{{ rke2_publish_group }}/{{
  rke2_publish_images_project }}

_var_rke2_publish_admin_token: >-
  {{ _reg_rke2_publish_admin_token['content'] | b64decode | from_yaml }}
_var_rke2_publish_headers:
  PRIVATE-TOKEN: "{{ _var_rke2_publish_admin_token['token'] }}"

_var_rke2_publish_charts_prefix: >-
  {{ rke2_publish_registry_host }}/{{ rke2_publish_group }}/{{
  rke2_publish_charts_project }}

_var_rke2_publish_group_path: "{{ rke2_publish_group | urlencode }}"
_var_rke2_publish_images_path: >-
  {{ (rke2_publish_group ~ '/' ~ rke2_publish_images_project)
     | replace('/', '%2F') }}
_var_rke2_publish_packages_path: >-
  {{ (rke2_publish_group ~ '/' ~ rke2_publish_packages_project)
     | replace('/', '%2F') }}
_var_rke2_publish_charts_path: >-
  {{ (rke2_publish_group ~ '/' ~ rke2_publish_charts_project)
     | replace('/', '%2F') }}

_var_rke2_publish_token_override: >-
  {{ (rke2_publish_deploy_token_username | length) > 0
     and (rke2_publish_deploy_token_value | length) > 0 }}

_var_rke2_publish_deploy_username: >-
  {{ rke2_publish_deploy_token_username
     if (_var_rke2_publish_token_override | bool)
     else (_reg_rke2_publish_token_new['json']['username']
           if (_reg_rke2_publish_token_new is defined
               and _reg_rke2_publish_token_new is not skipped
               and 'json' in _reg_rke2_publish_token_new)
           else (_reg_rke2_publish_token_recorded['content']
                 | b64decode | from_yaml)['username']) }}
_var_rke2_publish_deploy_token: >-
  {{ rke2_publish_deploy_token_value
     if (_var_rke2_publish_token_override | bool)
     else (_reg_rke2_publish_token_new['json']['token']
           if (_reg_rke2_publish_token_new is defined
               and _reg_rke2_publish_token_new is not skipped
               and 'json' in _reg_rke2_publish_token_new)
           else (_reg_rke2_publish_token_recorded['content']
                 | b64decode | from_yaml)['token']) }}

_var_rke2_publish_token_match: >-
  {{ _reg_rke2_publish_token_list['json']
     | selectattr('name', 'equalto', rke2_publish_deploy_token_name) | list }}

_var_rke2_publish_page_size: 100

_var_rke2_publish_existing_refs: >-
  {{ _reg_rke2_publish_existing['json'] | map(attribute='tags') | flatten
     | map(attribute='location') | list }}

_var_rke2_publish_chart_refs: >-
  {{ _reg_rke2_publish_charts_existing['json'] | map(attribute='tags') | flatten
     | map(attribute='location') | list }}

_var_rke2_publish_manifest_mirrors: >-
  {{ rke2_publish_manifest
     | selectattr('type', 'defined')
     | selectattr('type', 'equalto', 'mirror') | list }}

_var_rke2_publish_mirror_source: >-
  {{ _item_rke2_publish_mirror['image'] }}
_var_rke2_publish_mirror_target: >-
  {{ _item_rke2_publish_mirror['image']
     | regex_replace('^[^/]+/(.*)$', _var_rke2_publish_registry_prefix ~ '/\1') }}

_var_rke2_publish_chart_file: >-
  {{ rke2_publish_artifact_root }}/{{ _item_rke2_publish_chart['dest'] }}

_var_rke2_publish_published_files: >-
  {{ _reg_rke2_publish_package_files['results'] | default([])
     | rejectattr('skipped', 'defined')
     | map(attribute='json') | flatten
     | map(attribute='file_name') | list }}

_var_rke2_publish_image_target: >-
  {{ _item_rke2_publish_image
     | regex_replace('^[^/]+/(.*)$', _var_rke2_publish_registry_prefix ~ '/\1') }}

_var_rke2_publish_image_local: >-
  {{ _item_rke2_publish_image | regex_replace('^docker\.io/', '') }}

_var_rke2_publish_set_dir: >-
  {{ _item_rke2_publish_set['artifact_dir'] | default(rke2_publish_artifact_dir) }}

_var_rke2_publish_published_suffix: .published

_var_rke2_publish_published_basenames: >-
  {{ (rke2_publish_image_sets | map(attribute='tarball') | list)
     + (rke2_publish_extra_images | map(attribute='tarball') | list)
     + (rke2_publish_chart_sets | map(attribute='dest')
        | map('basename') | list)
     + rke2_publish_package_files }}

_var_rke2_publish_confirmed_names: >-
  {{ rke2_publish_manifest
     | rejectattr('type', 'equalto', 'mirror')
     | selectattr('retention', 'defined')
     | selectattr('retention', 'equalto', 'transit')
     | selectattr('dest', 'search',
                  '(' ~ (_var_rke2_publish_published_basenames
                         | map('regex_escape') | join('|')) ~ ')$')
     | map(attribute='name') | list }}
