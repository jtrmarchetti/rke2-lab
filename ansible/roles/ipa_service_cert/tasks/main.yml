---
- name: main | Assert the signing host and credentials are available
  when: (ipa_service_cert_enabled | bool)
  ansible.builtin.assert:
    that:
      - ipa_service_cert_ipa_host | length > 0
      - ipa_service_cert_admin_password | length >= 8
    fail_msg: >-
      ipa_service_cert needs the inventory name of the FreeIPA server and the
      IPA admin password. The password comes from ~/.config/rke2lab/env.sh; run
      `source ~/.config/rke2lab/env.sh` first.
    quiet: true

- name: main | Ensure certificate tooling is installed
  when: (ipa_service_cert_enabled | bool)
  ansible.builtin.apt:
    name: "{{ _var_ipa_service_cert_packages }}"
    state: present

# World-readable: it holds public certificates and the CA. The private keys
# written into it below carry their own 0640 mode.
- name: main | Ensure the certificate directory exists
  when: (ipa_service_cert_enabled | bool)
  ansible.builtin.file:
    path: "{{ ipa_service_cert_dir }}"
    state: directory
    owner: root
    group: root
    mode: "0755"

# Read from the IPA server rather than fetched over HTTP from ipa-ca.dev.lo:
# this host has no reason to trust that endpoint yet, and the file on the
# server is the same material without the bootstrapping problem.
- name: main | Read the domain CA certificate from the identity server
  when: (ipa_service_cert_enabled | bool)
  changed_when: false
  delegate_to: "{{ ipa_service_cert_ipa_host }}"
  register: _reg_ipa_service_cert_ca
  ansible.builtin.command:
    cmd: >-
      docker exec {{ ipa_service_cert_ipa_container }}
      cat /etc/ipa/ca.crt

- name: main | Ensure the domain CA certificate is present
  when: (ipa_service_cert_enabled | bool)
  ansible.builtin.copy:
    content: "{{ _reg_ipa_service_cert_ca.stdout }}\n"
    dest: "{{ ipa_service_cert_ca_file }}"
    owner: root
    group: root
    mode: "0644"

- name: main | Ensure the domain CA is in the host trust store
  when:
    - (ipa_service_cert_enabled | bool)
    - (ipa_service_cert_trust_ca | bool)
  register: _reg_ipa_service_cert_trust
  ansible.builtin.copy:
    content: "{{ _reg_ipa_service_cert_ca.stdout }}\n"
    dest: "{{ ipa_service_cert_trust_ca_path }}"
    owner: root
    group: root
    mode: "0644"

# No module wraps update-ca-certificates, and it must run for the copied file to
# reach the bundle everything actually reads. Guarded on the copy reporting
# changed, so a steady-state run does not report change forever.
- name: main | Rebuild the host trust store
  when:
    - (ipa_service_cert_enabled | bool)
    - (ipa_service_cert_trust_ca | bool)
    - (_reg_ipa_service_cert_trust.changed | default(false))
    - not ansible_check_mode
  changed_when: true
  register: _reg_ipa_service_cert_trust_update
  ansible.builtin.command:
    cmd: update-ca-certificates

- name: main | Publish the domain CA certificate to the artifact host
  when:
    - (ipa_service_cert_enabled | bool)
    - (ipa_service_cert_ca_publish_path | length > 0)
  ansible.builtin.copy:
    content: "{{ _reg_ipa_service_cert_ca.stdout }}\n"
    dest: "{{ ipa_service_cert_ca_publish_path }}"
    owner: root
    group: root
    mode: "0644"

- name: main | Issue each service certificate
  when: (ipa_service_cert_enabled | bool)
  loop: "{{ ipa_service_cert_names }}"
  loop_control:
    loop_var: _item_ipa_service_cert_entry
    label: "{{ _item_ipa_service_cert_entry['name'] }}"
  ansible.builtin.include_tasks: issue.yml
