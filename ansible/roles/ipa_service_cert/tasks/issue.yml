---
- name: issue | Check whether a certificate already exists
  register: _reg_ipa_service_cert_existing
  ansible.builtin.stat:
    path: "{{ _var_ipa_service_cert_crt }}"

- name: issue | Read the existing certificate
  when: (_reg_ipa_service_cert_existing.stat.exists | bool)
  register: _reg_ipa_service_cert_info
  community.crypto.x509_certificate_info:
    path: "{{ _var_ipa_service_cert_crt }}"
    valid_at:
      renewal: "+{{ ipa_service_cert_renew_before_days }}d"

# Reissue when there is no certificate, when the key that goes with it is gone,
# or when it will expire inside the renewal window. Presence alone is not
# enough: a certificate that only gets checked for existence expires silently.
- name: issue | Determine whether the certificate must be issued
  ansible.builtin.set_fact:
    _ipa_service_cert_needed: >-
      {{
        (not _reg_ipa_service_cert_existing.stat.exists)
        or (not (_reg_ipa_service_cert_info.valid_at['renewal'] | default(false)))
      }}

- name: issue | Report the certificate decision
  ansible.builtin.debug:
    msg: >-
      {{ _item_ipa_service_cert_entry['name'] }}: issue required =
      {{ _ipa_service_cert_needed }}
    verbosity: 2

- name: issue | Issue the certificate from the domain certificate authority
  when: (_ipa_service_cert_needed | bool)
  block:
    - name: issue | Ensure the private key is present
      community.crypto.openssl_privatekey:
        path: "{{ _var_ipa_service_cert_key }}"
        size: "{{ ipa_service_cert_key_size | int }}"
        type: RSA
        owner: root
        group: root
        mode: "0640"

    # The SAN carries the same single name as the CN. FreeIPA validates every
    # SAN against a principal the requester may manage, so one name per
    # certificate keeps the request to one principal.
    - name: issue | Ensure the signing request is present
      community.crypto.openssl_csr:
        path: "{{ _var_ipa_service_cert_csr }}"
        privatekey_path: "{{ _var_ipa_service_cert_key }}"
        common_name: "{{ _item_ipa_service_cert_entry['name'] }}"
        subject_alt_name:
          - "DNS:{{ _item_ipa_service_cert_entry['name'] }}"
        owner: root
        group: root
        mode: "0644"

    - name: issue | Read the signing request
      register: _reg_ipa_service_cert_csr_content
      ansible.builtin.slurp:
        src: "{{ _var_ipa_service_cert_csr }}"

    # One shell step because the whole exchange is a single Kerberos session:
    # the ticket kinit obtains lives in the credential cache of that process
    # tree, and splitting the steps across tasks would discard it. There is no
    # module for `ipa cert-request`, and this host is deliberately not enrolled,
    # so the ipa_* modules are not an option either.
    #
    # The request arrives on stdin and is written to the container's /tmp,
    # rather than being placed with `docker cp`. The FreeIPA container runs
    # read_only, which is the shape upstream documents and a Phase 2 decision;
    # `docker cp` into it fails with "container rootfs is marked read-only"
    # however writable the target path is. /tmp is a tmpfs the container itself
    # can write, so the copy has to happen from inside.
    #
    # A literal block, not a folded one: folding joins the lines with spaces and
    # collapses the script into a single unparseable command. The password
    # crosses as base64 so no character in it can terminate a quote.
    - name: issue | Sign the request against the domain certificate authority
      changed_when: true
      delegate_to: "{{ ipa_service_cert_ipa_host }}"
      no_log: "{{ ipa_service_cert_no_log | bool }}"
      register: _reg_ipa_service_cert_signed
      ansible.builtin.shell:
        cmd: |
          docker exec -i {{ ipa_service_cert_ipa_container }} bash -c '
            set -e
            cat > {{ _var_ipa_service_cert_remote_csr | trim }}
            echo "{{ ipa_service_cert_admin_password | b64encode }}" |
              base64 -d | kinit {{ ipa_service_cert_admin_user }} >/dev/null
            ipa host-show {{ _item_ipa_service_cert_entry["name"] }} \
              >/dev/null 2>&1 ||
              ipa host-add {{ _item_ipa_service_cert_entry["name"] }} >/dev/null
            ipa cert-request {{ _var_ipa_service_cert_remote_csr | trim }} \
              --principal {{ _var_ipa_service_cert_principal | trim }} \
              --add --chain \
              --certificate-out={{ _var_ipa_service_cert_remote_crt | trim }} \
              >/dev/null
            cat {{ _var_ipa_service_cert_remote_crt | trim }}'
        stdin: "{{ _reg_ipa_service_cert_csr_content['content'] | b64decode }}"

    - name: issue | Ensure the issued certificate is present
      ansible.builtin.copy:
        content: "{{ _reg_ipa_service_cert_signed.stdout }}\n"
        dest: "{{ _var_ipa_service_cert_crt }}"
        owner: root
        group: root
        mode: "0644"

  always:
    # Public material, but it is scratch space inside a container that outlives
    # the request. Left behind it accumulates one file per issuance.
    - name: issue | Remove the request material from the signing container
      changed_when: false
      delegate_to: "{{ ipa_service_cert_ipa_host }}"
      ansible.builtin.command:
        cmd: >-
          docker exec {{ ipa_service_cert_ipa_container }}
          rm -f {{ _var_ipa_service_cert_remote_csr | trim }}
          {{ _var_ipa_service_cert_remote_crt | trim }}
