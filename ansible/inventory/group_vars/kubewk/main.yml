---

ansible_user: "{{ lookup('env', 'VM_USERNAME') | default('root', true) }}"
ansible_password: "{{ lookup('env', 'VM_USER_PASSWORD') }}"
ansible_ssh_common_args: >-
  -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null

inventory_base_host_manage_hostname: true
inventory_base_host_target_hostname: "{{ inventory_hostname }}.dev.lo"

inventory_base_host_apt_proxy_enabled: true
inventory_base_host_apt_proxy_url: http://192.168.2.99:3142

inventory_base_host_split_dns_enabled: false

inventory_time_sync_enabled: true
inventory_time_sync_source_directive: server
inventory_time_sync_sources:
  - 192.168.2.4 iburst

inventory_data_volume_enabled: true
inventory_data_volume_device: /dev/sdb
inventory_data_volume_filesystem: ext4
inventory_data_volume_label: data1
inventory_data_volume_mount_path: /data1

inventory_kubewk_csi_volume_device: /dev/sdc
inventory_kubewk_csi_volume_filesystem: ext4
inventory_kubewk_csi_volume_label: longhorn
inventory_kubewk_csi_volume_mount_path: /var/lib/longhorn

inventory_rke2_node_enabled: true
inventory_rke2_node_type: agent
inventory_rke2_node_version: 1.36.3+rke2r1
inventory_rke2_node_data_dir: /data1/rancher/rke2

# Workers keep no kubeconfig here: the agent's kubeconfig lands under the
# data-dir override, and the CLI on workers is completion-only.
inventory_kube_cli_node_kubeconfig: ""
inventory_rke2_node_ca_url: http://192.168.2.99/certs/dev.lo-ca.crt
inventory_rke2_node_gitlab_url: https://gitlab.dev.lo
inventory_rke2_node_registry_host: registry.gitlab.dev.lo
inventory_rke2_node_package_project: rke2/packages

inventory_rke2_agent_enabled: true

inventory_rke2_agent_token: "{{ lookup('env', 'RKE2_TOKEN') }}"
inventory_rke2_agent_node_ip: "{{ ansible_host }}"
inventory_rke2_agent_data_dir: "{{ inventory_rke2_node_data_dir }}"

inventory_rke2_agent_server_address: 192.168.2.20
inventory_rke2_agent_supervisor_port: 9345

inventory_rke2_agent_expose_metrics: true

inventory_rke2_agent_config_template: >-
  {{ inventory_files_base }}/rke2_agent/config.yaml.j2

inventory_longhorn_node_blacklist_template: >-
  {{ inventory_files_base }}/longhorn_node/longhorn-blacklist.conf.j2

inventory_base_host_split_dns_domains:
  - dev.lo

inventory_rke2_node_ca_system_path: /usr/local/share/ca-certificates/dev.lo.crt
inventory_rke2_node_ca_rke2_path: /etc/rancher/rke2/dev.lo-ca.crt
