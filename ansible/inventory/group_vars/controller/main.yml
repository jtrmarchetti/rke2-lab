---

inventory_split_dns_enabled: true
inventory_split_dns_upstream_servers:
  - 192.168.1.1
inventory_split_dns_listen_addresses:
  - 127.0.0.1
inventory_split_dns_cache_size: 1000
inventory_split_dns_forward_zones:
  - domain: dev.lo
    server: 192.168.2.4

  - domain: 2.168.192.in-addr.arpa
    server: 192.168.2.4
inventory_split_dns_search_domain: dev.lo

inventory_split_dns_verify_zones: false

inventory_controller_wireguard_enabled: true
inventory_controller_wireguard_interface: wg0
inventory_controller_wireguard_address: 10.66.66.2/30
inventory_controller_wireguard_listen_port: 51821

inventory_controller_wireguard_private_key: >-
  {{ lookup('env', 'WIREGUARD_CONTROLLER_PRIVATE_KEY') }}
inventory_controller_wireguard_peer_private_key: >-
  {{ lookup('env', 'WIREGUARD_REPO_PRIVATE_KEY') }}
inventory_controller_wireguard_peer_endpoint: 192.168.1.20:51820
inventory_controller_wireguard_peer_allowed_ips:
  - 10.66.66.1/32
  - 192.168.2.0/24
inventory_controller_wireguard_peer_persistent_keepalive: 25
inventory_controller_wireguard_route_subnets:
  - 192.168.2.0/24

inventory_controller_wireguard_validate_address: 192.168.2.99
inventory_controller_wireguard_validate_port: 22

inventory_controller_runtime_env_template: >-
  {{ inventory_files_base }}/controller_runtime/controller-env.sh.j2
inventory_controller_runtime_venv: /home/claw/.venvs/rke2lab
inventory_controller_runtime_collections_path: /home/claw/.ansible/collections
inventory_controller_runtime_pulumi_bin: /home/claw/.pulumi/bin

inventory_controller_tunnel_wg_template: >-
  {{ inventory_files_base }}/controller_tunnel/wg_controller.conf.j2

inventory_controller_runtime_pulumi_url: >-
  {{ inventory_controller_artifacts['pulumi-cli']['url'] }}
inventory_controller_runtime_pulumi_version: >-
  {{ inventory_controller_artifacts['pulumi-cli']['version'] }}

inventory_controller_trust_ca_url: http://192.168.2.99/certs/dev.lo-ca.crt
inventory_controller_trust_ca_path: /usr/local/share/ca-certificates/dev.lo-ca.crt

inventory_controller_trust_verify_url: https://gitlab.dev.lo/

inventory_gitops_bootstrap_gitlab_url: https://gitlab.dev.lo

inventory_gitops_bootstrap_domain_ca_file: >-
  /usr/local/share/ca-certificates/dev.lo-ca.crt

inventory_gitops_bootstrap_files_dir: >-
  {{ inventory_files_base }}/gitops_bootstrap

inventory_gitops_bootstrap_sealing_key_file: >-
  {{ lookup('env', 'HOME') }}/.config/rke2lab/sealed-secrets-key.yaml

inventory_gitops_source_templates_dir: "{{ inventory_files_base }}/gitops_source"

inventory_gitops_source_gitlab_url: https://gitlab.dev.lo
inventory_gitops_source_domain: dev.lo

inventory_gitops_source_cluster_domain: k8s.dev.lo

inventory_gitops_source_keycloak_realm: dev-lo
inventory_gitops_source_registry_host: registry.gitlab.dev.lo
inventory_gitops_source_charts_repo: rke2/charts

inventory_gitops_source_lb_range: 192.168.2.40-192.168.2.52
inventory_gitops_source_dns_address: 192.168.2.40
inventory_gitops_source_ingress_address: 192.168.2.41

inventory_gitops_source_domain_ca_file: >-
  /usr/local/share/ca-certificates/dev.lo-ca.crt
inventory_gitops_source_ca_common_name: k8s-ca.dev.lo
inventory_gitops_source_commit_email: automation@dev.lo

inventory_ipa_sub_ca_common_name: k8s-ca.dev.lo
inventory_ipa_sub_ca_realm: DEV.LO
inventory_ipa_sub_ca_validity_days: 1825
inventory_ipa_sub_ca_ocsp_url: http://ipa-ca.dev.lo/ca/ocsp
inventory_ipa_sub_ca_crl_url: http://ipa-ca.dev.lo/ipa/crl/MasterCRL.bin

inventory_ipa_sub_ca_profile_id: subCA
inventory_ipa_sub_ca_profile_description: >-
  Subordinate CA for the RKE2 cluster, path length 0

inventory_ipa_sub_ca_profile_template: >-
  {{ inventory_files_base }}/ipa_sub_ca/subca-profile.cfg.j2

inventory_ipa_sub_ca_publish_host: repo01
inventory_ipa_sub_ca_publish_dir: /data1/artifacts/certs

inventory_keycloak_realm_name: dev-lo
inventory_keycloak_realm_display_name: dev.lo
inventory_keycloak_realm_issuer: https://sso.k8s.dev.lo/realms/dev-lo

inventory_keycloak_applications:
  - name: grafana
    description: Grafana, the observability front end
    base_url: https://grafana.k8s.dev.lo
    redirect_uris:
      - https://grafana.k8s.dev.lo/login/generic_oauth
    client_secret: "{{ lookup('env', 'OIDC_CLIENT_SECRET_GRAFANA') }}"

  - name: longhorn
    description: The Longhorn storage UI, behind an authenticating proxy
    base_url: https://longhorn.k8s.dev.lo
    redirect_uris:
      - https://longhorn.k8s.dev.lo/oauth2/callback
    client_secret: "{{ lookup('env', 'OIDC_CLIENT_SECRET_LONGHORN') }}"

  - name: openbao
    description: OpenBao, the secrets vault
    base_url: https://bao.k8s.dev.lo
    redirect_uris:
      - https://bao.k8s.dev.lo/ui/vault/auth/oidc/oidc/callback
      - http://localhost:8250/oidc/callback
    client_secret: "{{ lookup('env', 'OIDC_CLIENT_SECRET_OPENBAO') }}"

  - name: gitlab
    description: GitLab, the artifact and GitOps source host
    base_url: https://gitlab.dev.lo
    redirect_uris:
      - https://gitlab.dev.lo/users/auth/openid_connect/callback
    client_secret: "{{ lookup('env', 'OIDC_CLIENT_SECRET_GITLAB') }}"

inventory_keycloak_admin_only_applications:
  - name: keycloak
    description: Keycloak itself, the single sign-on service

inventory_keycloak_admins_group: keycloak-admins

inventory_keycloak_admin_user_filter: >-
  (&(!(nsAccountLock=TRUE))(memberOf=cn=keycloak-admins,cn=groups,cn=accounts,dc=dev,dc=lo))
inventory_keycloak_admin_groups_filter: (cn=keycloak-admins)

inventory_keycloak_break_glass_allowed_federation:
  - freeipa

inventory_keycloak_master_admin_roles:
  - admin

inventory_ipa_sso_groups_ipa_host: core01
inventory_ipa_sso_groups_ipa_container: freeipa-server
inventory_ipa_sso_groups_admin_password: >-
  {{ lookup('env', 'FREEIPA_ADMIN_PASSWORD') }}

inventory_openbao_oidc_url: https://bao.k8s.dev.lo
inventory_openbao_oidc_client_secret: >-
  {{ lookup('env', 'OIDC_CLIENT_SECRET_OPENBAO') }}

inventory_openbao_oidc_discovery_ca_file: >-
  /usr/local/share/ca-certificates/dev.lo-ca.crt

inventory_keycloak_ldap_url: https://sso.k8s.dev.lo

inventory_keycloak_ldap_groups_dn: cn=groups,cn=accounts,dc=dev,dc=lo

inventory_keycloak_ldap_connection_url: ldaps://core.dev.lo:636

inventory_kube_cli_controller_k9s_url: >-
  {{ inventory_controller_artifacts['k9s']['url'] }}
inventory_kube_cli_controller_k9s_version: >-
  {{ inventory_controller_artifacts['k9s']['version'] }}
inventory_kube_cli_controller_flux_url: >-
  {{ inventory_controller_artifacts['flux-cli']['url'] }}
inventory_kube_cli_controller_flux_version: >-
  {{ inventory_controller_artifacts['flux-cli']['version'] }}
inventory_kube_cli_controller_kubeseal_url: >-
  {{ inventory_controller_artifacts['kubeseal']['url'] }}
inventory_kube_cli_controller_kubeseal_version: >-
  {{ inventory_controller_artifacts['kubeseal']['version'] }}

inventory_kube_cli_controller_alias: k
inventory_kube_cli_controller_bin_dir: /home/claw/.local/bin
inventory_kube_cli_controller_config_dir: /home/claw/.config/rke2lab
inventory_kube_cli_controller_kubeconfig: /home/claw/.kube/dev-lo.config

inventory_kube_cli_controller_shell_template: >-
  {{ inventory_files_base }}/kube_cli_controller/kube-env.sh.j2

inventory_openbao_config_url: https://bao.k8s.dev.lo

inventory_openbao_secrets_url: https://bao.k8s.dev.lo
