[defaults]
inventory = ./inventory/hosts.yml
roles_path = ./roles
host_key_checking = False
retry_files_enabled = False
stdout_callback = ansible.builtin.default
result_format = yaml
interpreter_python = auto_silent
log_path = ./ansible.log
# Timing callbacks: per-task durations + top-N summary (profile_tasks),
# per-role durations (profile_roles), total play duration (timer).
# All are aggregate callbacks, so they coexist with the default stdout.
callbacks_enabled = ansible.posix.profile_tasks, ansible.posix.profile_roles, ansible.posix.timer

[callback_profile_tasks]
task_output_limit = 20

[privilege_escalation]
become = False
become_method = sudo
become_ask_pass = False
