---
# The tunnel the controller reaches 192.168.2.0/24 through, both ends in one
# pass, as plan/SECRETS.md's rotation procedure assumes.
#
# Three plays, and the split is what makes validation possible at all: the
# gateway does not exist when this end is written, so a handshake cannot be
# proved in the same pass that writes the interface.
#
#   1. This end of the tunnel, configured but not yet proved.
#   2. The gateway end, reached over 192.168.1.20 — deliberately not over the
#      tunnel, so configuring the tunnel never depends on the tunnel.
#   3. This end again, validation only, now that there is something to
#      handshake with.
#
# Neither public key appears in inventory any more. Both are derived from the
# private keys in ~/.config/rke2lab/env.sh by roles/controller_tunnel, and the
# gateway play takes the controller's key from the fact that role set. Until
# 2026-08-17 each was a literal pasted into the other host's group_vars, which
# made rotating a private key a three-step manual procedure whose missed step
# produces a tunnel that comes up and never carries a packet.

- name: Verify required secrets are present
  ansible.builtin.import_playbook: preflight_secrets.yml
  vars:
    _preflight_required_env:
      - WIREGUARD_CONTROLLER_PRIVATE_KEY
      - WIREGUARD_REPO_PRIVATE_KEY

- name: Configure the controller's end of the tunnel
  hosts: controller
  gather_facts: true
  become: true
  tasks:
    - name: tunnel_controller_access | Include the controller tunnel role
      tags:
        - controller_tunnel
      vars:
        controller_tunnel_address: "{{ inventory_controller_wireguard_address }}"
        controller_tunnel_enabled: >-
          {{ inventory_controller_wireguard_enabled }}
        controller_tunnel_interface: >-
          {{ inventory_controller_wireguard_interface }}
        controller_tunnel_listen_port: >-
          {{ inventory_controller_wireguard_listen_port }}
        controller_tunnel_peer_allowed_ips: >-
          {{ inventory_controller_wireguard_peer_allowed_ips }}
        controller_tunnel_peer_endpoint: >-
          {{ inventory_controller_wireguard_peer_endpoint }}
        controller_tunnel_peer_persistent_keepalive: >-
          {{ inventory_controller_wireguard_peer_persistent_keepalive }}
        controller_tunnel_peer_private_key: >-
          {{ inventory_controller_wireguard_peer_private_key }}
        controller_tunnel_private_key: >-
          {{ inventory_controller_wireguard_private_key }}
        controller_tunnel_route_subnets: >-
          {{ inventory_controller_wireguard_route_subnets }}
        # Nothing to handshake with yet. Play three does this.
        controller_tunnel_validate_enabled: false
      ansible.builtin.include_role:
        name: controller_tunnel
        apply:
          tags:
            - controller_tunnel

- name: Configure the gateway's end of the tunnel
  hosts: repo
  gather_facts: true
  become: true
  tasks:
    - name: tunnel_controller_access | Include wireguard gateway role
      tags:
        - wireguard_gateway
      vars:
        wireguard_gateway_address: "{{ inventory_wireguard_gateway_address }}"
        wireguard_gateway_enabled: "{{ inventory_wireguard_gateway_enabled }}"
        wireguard_gateway_interface: "{{ inventory_wireguard_gateway_interface }}"
        wireguard_gateway_internal_subnet: >-
          {{ inventory_wireguard_gateway_internal_subnet }}
        wireguard_gateway_ip_forward_enabled: >-
          {{ inventory_wireguard_gateway_ip_forward_enabled }}
        wireguard_gateway_listen_port: >-
          {{ inventory_wireguard_gateway_listen_port }}
        wireguard_gateway_manage_firewall_nat: >-
          {{ inventory_wireguard_gateway_manage_firewall_nat }}
        wireguard_gateway_nat_out_interface: >-
          {{ inventory_wireguard_gateway_nat_out_interface }}
        wireguard_gateway_nat_source_cidr: >-
          {{ inventory_wireguard_gateway_nat_source_cidr }}
        wireguard_gateway_peer_allowed_ips: >-
          {{ inventory_wireguard_gateway_peer_allowed_ips }}
        wireguard_gateway_peer_endpoint: >-
          {{ inventory_wireguard_gateway_peer_endpoint }}
        wireguard_gateway_peer_persistent_keepalive: >-
          {{ inventory_wireguard_gateway_peer_persistent_keepalive }}
        # Derived on the controller from the key in the environment, not
        # pasted here. controller_tunnel set this fact in the play above.
        wireguard_gateway_peer_public_key: >-
          {{ hostvars[inventory_wireguard_gateway_controller_host]
             ['controller_tunnel_local_public_key'] }}
        wireguard_gateway_private_key: >-
          {{ inventory_wireguard_gateway_private_key }}
      ansible.builtin.include_role:
        name: wireguard_gateway
        apply:
          tags:
            - wireguard_gateway

# plan/PROXMOX.md asked for this in Phase 1 and nothing delivered it until now.
# What it catches is a gateway that is up but not forwarding, which otherwise
# surfaces as every later playbook timing out against an internal host with an
# error that names the host and says nothing about the path to it.
- name: Prove the tunnel reaches the internal network
  hosts: controller
  gather_facts: true
  become: true
  tasks:
    - name: tunnel_controller_access | Validate the controller tunnel
      tags:
        - controller_tunnel
        - validate
      vars:
        controller_tunnel_configure_enabled: false
        controller_tunnel_enabled: >-
          {{ inventory_controller_wireguard_enabled }}
        controller_tunnel_interface: >-
          {{ inventory_controller_wireguard_interface }}
        controller_tunnel_peer_private_key: >-
          {{ inventory_controller_wireguard_peer_private_key }}
        controller_tunnel_private_key: >-
          {{ inventory_controller_wireguard_private_key }}
        controller_tunnel_validate_address: >-
          {{ inventory_controller_wireguard_validate_address }}
        controller_tunnel_validate_port: >-
          {{ inventory_controller_wireguard_validate_port }}
      ansible.builtin.include_role:
        name: controller_tunnel
        apply:
          tags:
            - controller_tunnel
            - validate
