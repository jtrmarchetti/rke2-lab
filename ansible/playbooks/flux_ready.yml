---

# Strike window 3: the gate itself is the longest open window of the
# build (up to the 50m budget), so a wedge can strike during it. A
# wedged control plane leaves its releases permanently not-Ready and the
# gate would time out with nothing left to absorb the wedge, so the
# gate play is preceded by the self-detecting etcd_rejoin role: a no-op
# on a healthy cluster, and a 3-minute heal on a strike, before the
# survey starts. The gate then runs on the controller, which already
# holds the kubectl and flux CLIs the survey uses.
- name: Resettle the control plane before the Flux readiness gate
  hosts: kubecp
  gather_facts: false
  become: true
  tasks:

    - name: flux_ready | Heal control plane nodes wedged out of etcd
      tags:
        - etcd_rejoin
      vars:
        etcd_rejoin_api_port: "{{ inventory_rke2_server_api_port }}"
        etcd_rejoin_candidate_addresses: >-
          {{ ([inventory_rke2_server_api_address]
              + (groups['kubecp']
                 | map('extract', hostvars, 'inventory_rke2_server_node_ip')
                 | reject('equalto', inventory_rke2_server_node_ip)
                 | list)) }}
        etcd_rejoin_data_dir: "{{ inventory_rke2_server_data_dir }}"
        etcd_rejoin_kubectl: >-
          {{ inventory_rke2_server_data_dir }}/bin/kubectl
          --kubeconfig /etc/rancher/rke2/rke2.yaml
        etcd_rejoin_supervisor_port: "{{ inventory_rke2_server_supervisor_port }}"
      ansible.builtin.include_role:
        name: etcd_rejoin
        apply:
          tags:
            - etcd_rejoin

- name: Gate the build on every HelmRelease reporting Ready
  hosts: controller
  gather_facts: true
  become: false
  tasks:

    - name: flux_ready | Wait for the whole release set to converge
      tags:
        - flux_ready
      ansible.builtin.include_role:
        name: flux_ready
        apply:
          tags:
            - flux_ready
