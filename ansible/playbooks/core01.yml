---
- name: Verify required secrets are present
  ansible.builtin.import_playbook: preflight_secrets.yml
  vars:
    _preflight_required_env:
      - FREEIPA_ADMIN_PASSWORD
      - FREEIPA_DIR_MANAGER_PASSWORD

- name: Configure phase2 core01 services
  hosts: core
  gather_facts: true
  become: true
  tasks:
    - name: core01 | Include base host role
      tags:
        - base_host
      vars:
        base_host_apt_proxy_enabled: "{{ inventory_base_host_apt_proxy_enabled }}"
        base_host_apt_proxy_url: "{{ inventory_base_host_apt_proxy_url }}"
        base_host_manage_hostname: "{{ inventory_base_host_manage_hostname }}"
        base_host_split_dns_enabled: "{{ inventory_base_host_split_dns_enabled }}"
        base_host_split_dns_interface: >-
          {{ inventory_base_host_split_dns_interface }}
        base_host_split_dns_servers: >-
          {{ inventory_base_host_split_dns_servers }}
        base_host_split_dns_template: >-
          {{ inventory_base_host_split_dns_template }}
        base_host_target_hostname: "{{ inventory_base_host_target_hostname }}"
      ansible.builtin.include_role:
        name: base_host
        apply:
          tags:
            - base_host

    - name: core01 | Include time synchronization role
      tags:
        - time_sync
      vars:
        time_sync_enabled: "{{ inventory_time_sync_enabled }}"
        time_sync_sources: "{{ inventory_time_sync_sources }}"
        time_sync_template: "{{ inventory_time_sync_template }}"
      ansible.builtin.include_role:
        name: time_sync
        apply:
          tags:
            - time_sync

    - name: core01 | Include data volume role
      tags:
        - data_volume
      ansible.builtin.include_role:
        name: data_volume
        apply:
          tags:
            - data_volume

    - name: core01 | Include container storage role
      tags:
        - container_storage
      vars:
        container_storage_graceful_compose_dirs:
          - "{{ inventory_freeipa_server_compose_dir }}"
        container_storage_containerd_root: >-
          {{ inventory_container_storage_containerd_root }}
        container_storage_docker_root: >-
          {{ inventory_container_storage_docker_root }}
        container_storage_docker_template: >-
          {{ inventory_container_storage_docker_template }}
        container_storage_containerd_template: >-
          {{ inventory_container_storage_containerd_template }}
      ansible.builtin.include_role:
        name: container_storage
        apply:
          tags:
            - container_storage

    - name: core01 | Include FreeIPA server role
      tags:
        - freeipa_server
      vars:
        freeipa_server_admin_password: >-
          {{ inventory_freeipa_server_admin_password }}
        freeipa_server_compose_dir: "{{ inventory_freeipa_server_compose_dir }}"
        freeipa_server_container_image: >-
          {{ inventory_freeipa_server_container_image }}
        freeipa_server_container_name: >-
          {{ inventory_freeipa_server_container_name }}
        freeipa_server_data_dir: "{{ inventory_freeipa_server_data_dir }}"
        freeipa_server_directory_manager_password: >-
          {{ inventory_freeipa_server_directory_manager_password }}
        freeipa_server_dns_forward_zones: >-
          {{ inventory_freeipa_server_dns_forward_zones }}
        freeipa_server_dns_records: "{{ inventory_freeipa_server_dns_records }}"
        freeipa_server_dns_zones: "{{ inventory_freeipa_server_dns_zones }}"
        freeipa_server_domain: "{{ inventory_freeipa_server_domain }}"
        freeipa_server_enabled: "{{ inventory_freeipa_server_enabled }}"
        freeipa_server_hostname: "{{ inventory_freeipa_server_hostname }}"
        freeipa_server_image_tarball_url: >-
          {{ inventory_freeipa_server_image_tarball_url }}
        freeipa_server_ip_address: "{{ inventory_freeipa_server_ip_address }}"
        freeipa_server_resolv_template: >-
          {{ inventory_freeipa_server_resolv_template }}
        freeipa_server_env_template: "{{ inventory_freeipa_server_env_template }}"
        freeipa_server_compose_template: >-
          {{ inventory_freeipa_server_compose_template }}
        freeipa_server_named_options_template: >-
          {{ inventory_freeipa_server_named_options_template }}
      ansible.builtin.include_role:
        name: freeipa_server
        apply:
          tags:
            - freeipa_server

- name: Point repository host resolvers at the identity domain
  hosts: repo
  gather_facts: true
  become: true
  tasks:
    - name: core01 | Include split DNS role
      tags:
        - split_dns
      vars:
        split_dns_enabled: "{{ inventory_split_dns_enabled }}"
        split_dns_forward_zones: "{{ inventory_split_dns_forward_zones }}"
        split_dns_config_template: >-
          {{ inventory_files_base }}/split_dns/split_dns.conf.j2
        split_dns_resolver_template: >-
          {{ inventory_files_base }}/split_dns/resolv.conf.j2
      ansible.builtin.include_role:
        name: split_dns
        apply:
          tags:
            - split_dns
