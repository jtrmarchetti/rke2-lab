---

- name: Validate phase1 repo01 services
  hosts: repo
  gather_facts: true
  become: true
  vars:
    _validate_artifact_manifest: >-
      {{ inventory_artifact_stage_manifest
         | selectattr('dest', 'defined') | list }}
  tasks:
    - name: validate_phase1 | Gather service facts
      ansible.builtin.service_facts:

    - name: validate_phase1 | Validate the data volume is mounted
      when: (inventory_data_volume_enabled | bool)
      vars:
        _validate_mounts: >-
          {{ ansible_facts['mounts'] | selectattr('mount', 'equalto',
             inventory_data_volume_mount_path) | list }}
      ansible.builtin.assert:
        that:
          - _validate_mounts | length == 1
          - _validate_mounts[0]['device'] is defined
        fail_msg: >-
          {{ inventory_data_volume_mount_path }} is not mounted. Artifacts and the apt
          cache would be written to the OS disk.
        quiet: true

    - name: validate_phase1 | Validate apt proxy listener on the internal address
      when: (inventory_apt_proxy_enabled | bool)
      loop: "{{ inventory_apt_proxy_bind_addresses }}"
      loop_control:
        loop_var: _item_validate_bind_address
      ansible.builtin.wait_for:
        host: "{{ _item_validate_bind_address }}"
        port: "{{ inventory_apt_proxy_bind_port }}"
        timeout: 5

    - name: validate_phase1 | Validate SOCKS5 listener
      when: (inventory_socks5_proxy_enabled | bool)
      ansible.builtin.wait_for:
        host: 127.0.0.1
        port: "{{ inventory_socks5_proxy_listen_port }}"
        timeout: 5

    - name: validate_phase1 | Validate apt-cacher-ng service state
      when: (inventory_apt_proxy_enabled | bool)
      ansible.builtin.assert:
        that:
          - "'apt-cacher-ng.service' in ansible_facts['services']"
          - >-
            ansible_facts['services']['apt-cacher-ng.service']['state']
            == 'running'
        fail_msg: apt-cacher-ng is not running as expected.
        quiet: true

    - name: validate_phase1 | Validate danted service state
      when: (inventory_socks5_proxy_enabled | bool)
      ansible.builtin.assert:
        that:
          - "'danted.service' in ansible_facts['services']"
          - ansible_facts['services']['danted.service']['state'] == 'running'
        fail_msg: danted is not running as expected.
        quiet: true

    - name: validate_phase1 | Validate Apache service state
      when: (inventory_artifact_host_enabled | bool)
      ansible.builtin.assert:
        that:
          - "'apache2.service' in ansible_facts['services']"
          - ansible_facts['services']['apache2.service']['state'] == 'running'
        fail_msg: Apache is not running as expected.
        quiet: true

    - name: validate_phase1 | Validate the apt cache is on the data volume
      when: (inventory_apt_proxy_enabled | bool)
      register: _reg_validate_apt_cache
      ansible.builtin.stat:
        path: "{{ inventory_apt_proxy_cache_dir }}"
        get_checksum: false

    - name: validate_phase1 | Assert the apt cache directory exists on the data volume
      when: (inventory_apt_proxy_enabled | bool)
      ansible.builtin.assert:
        that:
          - _reg_validate_apt_cache['stat']['exists']
          - _reg_validate_apt_cache['stat']['isdir']
          - inventory_apt_proxy_cache_dir is match(inventory_data_volume_mount_path + '/')
        fail_msg: >-
          The apt cache is not on {{ inventory_data_volume_mount_path }}; it would grow
          on the OS disk.
        quiet: true

    # Mirror entries proxy images and publish nothing, so they have no
    # destination path; only entries that carry a dest are checked here.
    # An entry counts as published when either its body or its source-named
    # marker exists: bootstrap-retention bodies are kept on disk forever
    # (no marker is written for them), while transit-retention bodies are
    # deleted after their consuming phase and only the marker remains, the
    # same published signal the staging roles use.
    - name: validate_phase1 | Note each manifest artifact's body
      when: _validate_artifact_manifest | length > 0
      register: _reg_validate_artifact_bodies
      loop: "{{ _validate_artifact_manifest }}"
      loop_control:
        loop_var: _item_validate_artifact
        label: "{{ _item_validate_artifact['dest'] }}"
      ansible.builtin.stat:
        path: >-
          {{ inventory_artifact_host_document_root
          }}/{{ _item_validate_artifact['dest'] }}
        get_checksum: false

    - name: validate_phase1 | Note each manifest artifact's published marker
      when: _validate_artifact_manifest | length > 0
      register: _reg_validate_artifact_markers
      loop: "{{ _validate_artifact_manifest }}"
      loop_control:
        loop_var: _item_validate_artifact
        label: "{{ _item_validate_artifact['dest'] }}"
      vars:
        _validate_artifact_marker_source: >-
          {{ _item_validate_artifact.get('url',
             _item_validate_artifact.get('image', ''))
             | regex_replace('[^A-Za-z0-9._~-]', '') }}
      ansible.builtin.stat:
        path: >-
          {{ inventory_artifact_host_document_root }}/{{
          _item_validate_artifact['dest'] }}.published.{{
          _validate_artifact_marker_source }}
        get_checksum: false

    - name: validate_phase1 | Assert every manifest artifact is published
      when: _validate_artifact_manifest | length > 0
      vars:
        _validate_artifact_pairs: >-
          {{ _reg_validate_artifact_bodies['results'] | zip(
             _reg_validate_artifact_markers['results'] | default([])) | list }}
      loop: "{{ _validate_artifact_pairs }}"
      loop_control:
        loop_var: _item_validate_artifact_pair
        label: >-
          {{ _item_validate_artifact_pair[0]['_item_validate_artifact']['dest'] }}
        extended: true
      ansible.builtin.assert:
        that:
          - _item_validate_artifact_pair[0]['stat']['exists']
            or _item_validate_artifact_pair[1]['stat']['exists']
        fail_msg: >-
          {{ _item_validate_artifact_pair[0]['_item_validate_artifact']['name'] }}
          is not published: neither its body nor its published marker is in
          {{ inventory_artifact_host_document_root }}.
        quiet: true

    - name: validate_phase1 | Validate write methods are refused by the artifact host
      when:
        - (inventory_artifact_host_enabled | bool)
        - (inventory_artifact_stage_manifest | length > 0)
      loop:
        - POST
        - PUT
        - DELETE
      loop_control:
        loop_var: _item_validate_method
      vars:
        _validate_artifact_url: >-
          http://{{ inventory_apt_proxy_bind_addresses | first }}/{{
          (inventory_artifact_stage_manifest | first)['dest'] }}
      ansible.builtin.uri:
        url: "{{ _validate_artifact_url }}"
        method: "{{ _item_validate_method }}"
        status_code:
          - 403

    - name: validate_phase1 | Validate the apt proxy is not reachable on the external address
      when: (inventory_apt_proxy_enabled | bool)
      ansible.builtin.wait_for:
        host: "{{ ansible_facts['default_ipv4']['address'] }}"
        port: "{{ inventory_apt_proxy_bind_port }}"
        timeout: 5
        state: stopped

    - name: validate_phase1 | Validate CONNECT to a non-Ubuntu host is refused by the proxy
      when: (inventory_apt_proxy_enabled | bool)
      failed_when: _reg_validate_connect['status'] | default(0) == 200
      environment:
        https_proxy: >-
          http://{{ inventory_apt_proxy_bind_addresses | first }}:{{
          inventory_apt_proxy_bind_port }}
      register: _reg_validate_connect
      ansible.builtin.uri:
        url: https://github.com
        use_proxy: true
        status_code:
          - -1
        timeout: 15

    - name: validate_phase1 | Validate an upstream name resolves
      changed_when: false
      register: _reg_validate_upstream_dns
      ansible.builtin.command:
        cmd: getent hosts archive.ubuntu.com

    - name: validate_phase1 | Check whether the internal resolver is deployed yet
      when: (inventory_base_host_split_dns_enabled | bool)
      failed_when: false
      register: _reg_validate_internal_resolver
      ansible.builtin.wait_for:
        host: "{{ inventory_base_host_split_dns_servers | first }}"
        port: 53
        timeout: 5

    - name: validate_phase1 | Validate an internal name resolves through the internal resolver
      when:
        - (inventory_base_host_split_dns_enabled | bool)
        - not (_reg_validate_internal_resolver['failed'] | default(true))
      changed_when: false
      failed_when: _reg_validate_internal_dns['rc'] not in [0, 2]
      register: _reg_validate_internal_dns
      ansible.builtin.command:
        cmd: >-
          getent hosts {{ inventory_base_host_split_dns_domains | first }}

- name: Validate controller tunnel and artifact access
  hosts: controller
  gather_facts: false
  become: false
  vars:
    _validate_repo_internal_address: 192.168.2.99
    _validate_repo_external_address: 192.168.1.20
    _validate_repo_tunnel_address: 10.66.66.1
  tasks:
    - name: validate_phase1 | Validate controller can reach repo WireGuard endpoint address
      changed_when: false
      ansible.builtin.command:
        cmd: ping -c 1 -W 2 {{ _validate_repo_tunnel_address }}

    - name: validate_phase1 | Validate controller route to internal subnet target
      changed_when: false
      ansible.builtin.command:
        cmd: ping -c 1 -W 2 {{ _validate_repo_internal_address }}

    - name: validate_phase1 | Fetch a published artifact over the tunnel
      when: hostvars['repo01']['inventory_artifact_stage_manifest'] | length > 0
      register: _reg_validate_fetch
      vars:
        _validate_artifact: >-
          {{ hostvars['repo01']['inventory_artifact_stage_manifest'] | first }}
      ansible.builtin.uri:
        url: >-
          http://{{ _validate_repo_internal_address }}/{{ _validate_artifact['dest'] }}
        # No return_content: the first manifest entry is a multi-hundred-MB
        # tarball, and registering its body would overflow the task result.
        status_code:
          - 200

    - name: validate_phase1 | Validate Apache refuses requests from outside the allowed networks
      register: _reg_validate_forbidden
      ansible.builtin.uri:
        url: "http://{{ _validate_repo_external_address }}/"
        status_code:
          - 403

- name: Validate internal nodes have no internet path
  hosts: core
  gather_facts: false
  become: false
  tasks:

    - name: validate_phase1 | Check whether this internal host is reachable yet
      failed_when: false
      register: _reg_validate_internal_reachable
      ansible.builtin.wait_for_connection:
        timeout: 10

    - name: validate_phase1 | Validate a direct upstream fetch from an internal node fails
      when: not (_reg_validate_internal_reachable['failed'] | default(true))
      failed_when: _reg_validate_egress['status'] | default(0) == 200
      register: _reg_validate_egress
      ansible.builtin.uri:
        url: https://archive.ubuntu.com
        use_proxy: false
        timeout: 15
        status_code:
          - -1
