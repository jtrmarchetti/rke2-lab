---
# Shared preflight: fail fast when a required secret is missing from the
# environment.
#
# Secrets live outside the repo in ~/.config/rke2lab/env.sh; see
# plan/SECRETS.md.
# Without this check, an unset variable resolves to an empty string and the roles
# quietly skip every task guarded by `| length > 0`, which looks like success.
#
# Include with:
#   - name: Verify required secrets are present
#     ansible.builtin.import_playbook: preflight_secrets.yml
#     vars:
#       _preflight_required_env:
#         - FREEIPA_ADMIN_PASSWORD

- name: Verify required secrets are present in the environment
  hosts: localhost
  gather_facts: false
  connection: local
  vars:
    _preflight_required_env: []
  tasks:
    - name: preflight_secrets | Assert each required environment variable is set and non-empty
      loop: "{{ _preflight_required_env }}"
      loop_control:
        loop_var: _item_preflight_variable
      ansible.builtin.assert:
        that:
          - lookup('env', _item_preflight_variable) | default('', true) | length > 0
        fail_msg: >-
          Required secret '{{ _item_preflight_variable }}' is not set.
          Run: source ~/.config/rke2lab/env.sh
        success_msg: "{{ _item_preflight_variable }} is set"
        quiet: true
