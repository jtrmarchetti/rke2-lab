---

- name: Verify required secrets are present
  ansible.builtin.import_playbook: preflight_secrets.yml
  vars:
    _preflight_required_env:
      - RKE2_TOKEN

- name: Join the RKE2 workers to the cluster
  hosts: kubewk
  gather_facts: true
  become: true

  serial: "{{ kubewk_serial | default(2) }}"
  force_handlers: true
  tasks:
    - name: kubewk | Include base host role
      tags:
        - base_host
      vars:
        base_host_apt_proxy_enabled: "{{ inventory_base_host_apt_proxy_enabled }}"
        base_host_apt_proxy_url: "{{ inventory_base_host_apt_proxy_url }}"
        base_host_manage_hostname: "{{ inventory_base_host_manage_hostname }}"
        base_host_split_dns_domains: "{{ inventory_base_host_split_dns_domains }}"
        base_host_split_dns_enabled: "{{ inventory_base_host_split_dns_enabled }}"
        base_host_target_hostname: "{{ inventory_base_host_target_hostname }}"
      ansible.builtin.include_role:
        name: base_host
        apply:
          tags:
            - base_host

    - name: kubewk | Include data volume role for the RKE2 data directory
      tags:
        - data_volume
      vars:
        data_volume_device: "{{ inventory_data_volume_device }}"
        data_volume_enabled: "{{ inventory_data_volume_enabled }}"
        data_volume_filesystem: "{{ inventory_data_volume_filesystem }}"
        data_volume_label: "{{ inventory_data_volume_label }}"
        data_volume_mount_path: "{{ inventory_data_volume_mount_path }}"
      ansible.builtin.include_role:
        name: data_volume
        apply:
          tags:
            - data_volume

    - name: kubewk | Include data volume role for the CSI disk
      tags:
        - data_volume
        - csi_volume
      vars:
        data_volume_device: "{{ inventory_data_volume_device }}"
        data_volume_enabled: "{{ inventory_data_volume_enabled }}"
        data_volume_filesystem: "{{ inventory_data_volume_filesystem }}"
        data_volume_label: "{{ inventory_data_volume_label }}"
        data_volume_mount_path: "{{ inventory_data_volume_mount_path }}"
        inventory_data_volume_device: "{{ inventory_kubewk_csi_volume_device }}"
        inventory_data_volume_filesystem: >-
          {{ inventory_kubewk_csi_volume_filesystem }}
        inventory_data_volume_label: "{{ inventory_kubewk_csi_volume_label }}"
        inventory_data_volume_mount_path: >-
          {{ inventory_kubewk_csi_volume_mount_path }}
      ansible.builtin.include_role:
        name: data_volume
        apply:
          tags:
            - data_volume
            - csi_volume

    - name: kubewk | Include time synchronization role
      tags:
        - time_sync
      vars:
        time_sync_enabled: "{{ inventory_time_sync_enabled }}"
        time_sync_source_directive: "{{ inventory_time_sync_source_directive }}"
        time_sync_sources: "{{ inventory_time_sync_sources }}"
      ansible.builtin.include_role:
        name: time_sync
        apply:
          tags:
            - time_sync

    - name: kubewk | Read the registry deploy token from the repository host
      delegate_to: "{{ groups['repo'] | first }}"
      no_log: true
      register: _reg_kubewk_deploy_token
      tags:
        - always
      ansible.builtin.slurp:
        src: /data1/gitlab/rke2-deploy-token.yml

    - name: kubewk | Include RKE2 node preparation role
      tags:
        - rke2_node
      vars:
        rke2_node_ca_rke2_path: "{{ inventory_rke2_node_ca_rke2_path }}"
        rke2_node_ca_system_path: "{{ inventory_rke2_node_ca_system_path }}"
        rke2_node_ca_url: "{{ inventory_rke2_node_ca_url }}"
        rke2_node_data_dir: "{{ inventory_rke2_node_data_dir }}"
        rke2_node_enabled: "{{ inventory_rke2_node_enabled }}"
        rke2_node_gitlab_url: "{{ inventory_rke2_node_gitlab_url }}"
        rke2_node_package_project: "{{ inventory_rke2_node_package_project }}"
        rke2_node_registry_host: "{{ inventory_rke2_node_registry_host }}"
        rke2_node_registry_mirrors: "{{ inventory_rke2_node_registry_mirrors }}"
        rke2_node_registry_username: >-
          {{ (_reg_kubewk_deploy_token['content'] | b64decode
              | from_yaml)['username'] }}
        rke2_node_type: "{{ inventory_rke2_node_type }}"
        rke2_node_version: "{{ inventory_rke2_node_version }}"
        rke2_node_registry_password: >-
          {{ (_reg_kubewk_deploy_token['content'] | b64decode
              | from_yaml)['token'] }}
      ansible.builtin.include_role:
        name: rke2_node
        apply:
          tags:
            - rke2_node

    - name: kubewk | Include RKE2 agent role
      tags:
        - rke2_agent
      vars:
        rke2_agent_control_host: "{{ inventory_kubewk_control_host }}"
        rke2_agent_data_dir: "{{ inventory_rke2_agent_data_dir }}"
        rke2_agent_enabled: "{{ inventory_rke2_agent_enabled }}"
        rke2_agent_expose_metrics: >-
          {{ inventory_rke2_agent_expose_metrics }}
        rke2_agent_node_ip: "{{ inventory_rke2_agent_node_ip }}"
        rke2_agent_server_address: "{{ inventory_rke2_agent_server_address }}"
        rke2_agent_supervisor_port: "{{ inventory_rke2_agent_supervisor_port }}"
        rke2_agent_token: "{{ inventory_rke2_agent_token }}"
      ansible.builtin.include_role:
        name: rke2_agent
        apply:
          tags:
            - rke2_agent

    - name: kubewk | Include the node CLI role
      tags:
        - kube_cli
      vars:
        kube_cli_node_data_dir: "{{ inventory_rke2_node_data_dir }}"
        kube_cli_node_kubeconfig: ""
      ansible.builtin.include_role:
        name: kube_cli_node
        apply:
          tags:
            - kube_cli

- name: Label the workers and taint the control plane
  hosts: kubecp
  gather_facts: false
  become: true
  vars:

    _kubewk_kubectl: >-
      /data1/rancher/rke2/bin/kubectl
      --kubeconfig /etc/rancher/rke2/rke2.yaml
    _kubewk_worker_label: node-role.kubernetes.io/worker=true
    _kubewk_control_plane_taint: CriticalAddonsOnly=true:NoExecute
  tasks:
    - name: kubewk | Apply the cluster-level changes from one server

      run_once: true
      block:

        - name: kubewk | Label each worker with its node role
          changed_when: "'not labeled' not in _reg_kubewk_label['stdout']"
          register: _reg_kubewk_label
          loop: "{{ groups['kubewk'] }}"
          loop_control:
            loop_var: _item_kubewk_worker
          tags:
            - node_labels
          ansible.builtin.command:
            cmd: >-
              {{ _kubewk_kubectl }} label node {{ _item_kubewk_worker }}.dev.lo
              {{ _kubewk_worker_label }} --overwrite

        - name: kubewk | Count the workers that have registered
          changed_when: false
          register: _reg_kubewk_registered
          tags:
            - control_plane_taint
          ansible.builtin.command:
            cmd: >-
              {{ _kubewk_kubectl }} get nodes
              -l {{ _kubewk_worker_label }} --no-headers

        - name: kubewk | Wait for every registered worker to report Ready
          changed_when: false
          failed_when: false
          register: _reg_kubewk_ready
          tags:
            - control_plane_taint
          ansible.builtin.command:
            cmd: >-
              {{ _kubewk_kubectl }} wait --for=condition=Ready
              node -l {{ _kubewk_worker_label }} --timeout=300s

        - name: kubewk | Assert every worker is Ready before tainting anything
          tags:
            - control_plane_taint
          ansible.builtin.assert:
            that:
              - _reg_kubewk_registered['stdout_lines'] | length
                == groups['kubewk'] | length
              - _reg_kubewk_ready['rc'] == 0
            fail_msg: >-
              Not every worker is Ready, so the control plane must not be tainted.
              CriticalAddonsOnly is NoExecute: applying it now would evict CoreDNS
              and metrics-server with nowhere to reschedule, and cluster DNS would
              stop. Fix the workers first — see the runbook in
              plan/PHASE5_IMPLEMENTATION.md.
            quiet: true

        - name: kubewk | Taint the control plane CriticalAddonsOnly
          changed_when: _reg_kubewk_taint['rc'] == 0
          failed_when:
            - _reg_kubewk_taint['rc'] != 0
            - "'already has' not in _reg_kubewk_taint['stderr']"
          register: _reg_kubewk_taint
          loop: "{{ groups['kubecp'] }}"
          loop_control:
            loop_var: _item_kubewk_server
          tags:
            - control_plane_taint
          ansible.builtin.command:
            cmd: >-
              {{ _kubewk_kubectl }} taint node {{ _item_kubewk_server }}.dev.lo
              {{ _kubewk_control_plane_taint }}
