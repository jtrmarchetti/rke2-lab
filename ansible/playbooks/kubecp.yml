---

- name: Verify required secrets are present
  ansible.builtin.import_playbook: preflight_secrets.yml
  vars:
    _preflight_required_env:
      - GITLAB_ROOT_PASSWORD
      - RKE2_TOKEN

- name: Publish the RKE2 artifact set from the repo host into GitLab
  hosts: repo
  gather_facts: true
  become: true
  force_handlers: true
  tasks:

    - name: kubecp | Include artifact staging role
      tags:
        - artifact_stage
      vars:
        artifact_stage_enabled: "{{ inventory_artifact_stage_enabled }}"
        artifact_stage_manifest: "{{ inventory_artifact_stage_manifest }}"
        artifact_stage_root: "{{ inventory_artifact_stage_root }}"
      ansible.builtin.include_role:
        name: artifact_stage
        apply:
          tags:
            - artifact_stage

    - name: kubecp | Include RKE2 publishing role
      tags:
        - rke2_publish
      vars:
        rke2_publish_artifact_dir: "{{ inventory_rke2_publish_artifact_dir }}"
        rke2_publish_artifact_root: "{{ inventory_artifact_stage_root }}"

        rke2_publish_chart_sets: []
        rke2_publish_deploy_token_username: >-
          {{ inventory_rke2_publish_deploy_token_username }}
        rke2_publish_deploy_token_value: >-
          {{ inventory_rke2_publish_deploy_token_value }}
        rke2_publish_enabled: "{{ inventory_rke2_publish_enabled }}"
        rke2_publish_extra_images: "{{ inventory_rke2_publish_extra_images }}"
        rke2_publish_gitlab_url: "{{ inventory_rke2_publish_gitlab_url }}"
        rke2_publish_group: "{{ inventory_rke2_publish_group }}"
        rke2_publish_images_project: "{{ inventory_rke2_publish_images_project }}"
        rke2_publish_manifest: "{{ inventory_artifact_stage_manifest }}"
        rke2_publish_package_version: >-
          {{ inventory_rke2_publish_package_version }}
        rke2_publish_packages_project: >-
          {{ inventory_rke2_publish_packages_project }}
        rke2_publish_registry_host: "{{ inventory_rke2_publish_registry_host }}"
        rke2_publish_root_password: "{{ inventory_rke2_publish_root_password }}"
      ansible.builtin.include_role:
        name: rke2_publish
        apply:
          tags:
            - rke2_publish

- name: Form the RKE2 control plane
  hosts: kubecp
  gather_facts: true
  become: true

  # One control plane node in the heavy fetch/unpack/image-pull/etcd-join
  # window at a time. A 2-wide join burst saturates repo01's GitLab registry
  # and the shared PVE LVM, which is what turns a CNI image extract into a
  # partial write that RKE2's .extracted marker then locks in permanently.
  # serial:1 keeps the window single-node; the knob stays overridable.
  serial: "{{ kubecp_serial | default(1) }}"
  force_handlers: true
  tasks:

    - name: kubecp | Assert the bootstrap server is named explicitly
      tags:
        - always
      ansible.builtin.assert:
        that:
          - inventory_kubecp_bootstrap_host in groups['kubecp']
        fail_msg: >-
          inventory_kubecp_bootstrap_host must name a host in the kubecp group. It
          decides which server starts the cluster and which servers join it.
        quiet: true

    - name: kubecp | Include base host role
      tags:
        - base_host
      vars:
        base_host_apt_proxy_enabled: "{{ inventory_base_host_apt_proxy_enabled }}"
        base_host_apt_proxy_url: "{{ inventory_base_host_apt_proxy_url }}"
        base_host_manage_hostname: "{{ inventory_base_host_manage_hostname }}"
        base_host_split_dns_enabled: "{{ inventory_base_host_split_dns_enabled }}"
        base_host_split_dns_interface: >-
          {{ inventory_base_host_split_dns_interface }}
        base_host_split_dns_servers: >-
          {{ inventory_base_host_split_dns_servers }}
        base_host_split_dns_template: >-
          {{ inventory_base_host_split_dns_template }}
        base_host_target_hostname: "{{ inventory_base_host_target_hostname }}"
      ansible.builtin.include_role:
        name: base_host
        apply:
          tags:
            - base_host

    - name: kubecp | Include data volume role
      tags:
        - data_volume
      vars:
        data_volume_device: "{{ inventory_data_volume_device }}"
        data_volume_enabled: "{{ inventory_data_volume_enabled }}"
        data_volume_filesystem: "{{ inventory_data_volume_filesystem }}"
        data_volume_label: "{{ inventory_data_volume_label }}"
        data_volume_mount_path: "{{ inventory_data_volume_mount_path }}"
      ansible.builtin.include_role:
        name: data_volume
        apply:
          tags:
            - data_volume

    - name: kubecp | Include time synchronization role
      tags:
        - time_sync
      vars:
        time_sync_enabled: "{{ inventory_time_sync_enabled }}"
        time_sync_sources: "{{ inventory_time_sync_sources }}"
        time_sync_template: "{{ inventory_time_sync_template }}"
      ansible.builtin.include_role:
        name: time_sync
        apply:
          tags:
            - time_sync

    - name: kubecp | Read the registry deploy token from the repository host
      delegate_to: "{{ groups['repo'] | first }}"
      no_log: true
      register: _reg_kubecp_deploy_token
      tags:
        - always
      ansible.builtin.slurp:
        src: /data1/gitlab/rke2-deploy-token.yml

    - name: kubecp | Include RKE2 node preparation role
      tags:
        - rke2_node
      vars:
        rke2_node_ca_rke2_path: "{{ inventory_rke2_node_ca_rke2_path }}"
        rke2_node_ca_system_path: "{{ inventory_rke2_node_ca_system_path }}"
        rke2_node_ca_url: "{{ inventory_rke2_node_ca_url }}"
        rke2_node_data_dir: "{{ inventory_rke2_node_data_dir }}"
        rke2_node_enabled: "{{ inventory_rke2_node_enabled }}"
        rke2_node_gitlab_url: "{{ inventory_rke2_node_gitlab_url }}"
        rke2_node_inotify_template: "{{ inventory_rke2_node_inotify_template }}"
        rke2_node_package_project: "{{ inventory_rke2_node_package_project }}"
        rke2_node_registries_template: >-
          {{ inventory_rke2_node_registries_template }}
        rke2_node_registry_mirrors: "{{ inventory_rke2_node_registry_mirrors }}"
        rke2_node_registry_username: >-
          {{ (_reg_kubecp_deploy_token['content'] | b64decode
              | from_yaml)['username'] }}
        rke2_node_type: "{{ inventory_rke2_node_type }}"
        rke2_node_version: "{{ inventory_rke2_node_version }}"
        rke2_node_registry_password: >-
          {{ (_reg_kubecp_deploy_token['content'] | b64decode
              | from_yaml)['token'] }}
      ansible.builtin.include_role:
        name: rke2_node
        apply:
          tags:
            - rke2_node

    - name: kubecp | Include RKE2 server role
      tags:
        - rke2_server
      vars:
        rke2_server_api_address: "{{ inventory_rke2_server_api_address }}"
        rke2_server_api_name: "{{ inventory_rke2_server_api_name }}"
        rke2_server_api_port: "{{ inventory_rke2_server_api_port }}"

        rke2_server_bootstrap: >-
          {{ inventory_hostname == inventory_kubecp_bootstrap_host }}
        rke2_server_config_template: "{{ inventory_rke2_server_config_template }}"
        rke2_server_data_dir: "{{ inventory_rke2_server_data_dir }}"
        rke2_server_enabled: "{{ inventory_rke2_server_enabled }}"
        rke2_server_ingress_controller: >-
          {{ inventory_rke2_server_ingress_controller }}
        rke2_server_kube_vip_enabled: >-
          {{ inventory_rke2_server_kube_vip_enabled }}
        rke2_server_kube_vip_template: >-
          {{ inventory_rke2_server_kube_vip_template }}
        rke2_server_node_ip: "{{ inventory_rke2_server_node_ip }}"
        rke2_server_tls_san: "{{ inventory_rke2_server_tls_san }}"
        rke2_server_token: "{{ inventory_rke2_server_token }}"
        rke2_server_traefik_template: >-
          {{ inventory_rke2_server_traefik_template }}
        rke2_server_kubeconfig_dest: >-
          {{ lookup('env', 'HOME') }}/.kube/dev-lo.config
      ansible.builtin.include_role:
        name: rke2_server
        apply:
          tags:
            - rke2_server

    - name: kubecp | Include the node CLI role
      tags:
        - kube_cli
      vars:
        kube_cli_node_cli_template: "{{ inventory_kube_cli_node_cli_template }}"
        kube_cli_node_crictl_template: >-
          {{ inventory_kube_cli_node_crictl_template }}
        kube_cli_node_data_dir: "{{ inventory_rke2_node_data_dir }}"
        kube_cli_node_kubeconfig: "{{ inventory_kube_cli_node_kubeconfig }}"
      ansible.builtin.include_role:
        name: kube_cli_node
        apply:
          tags:
            - kube_cli

- name: Settle the control plane etcd cluster into a live quorum
  hosts: kubecp
  gather_facts: false
  become: true
  tasks:

    - name: etcd_rejoin | Heal control plane nodes wedged out of etcd
      tags:
        - etcd_rejoin
      vars:
        etcd_rejoin_api_port: "{{ inventory_rke2_server_api_port }}"
        etcd_rejoin_candidate_addresses: >-
          {{ ([inventory_rke2_server_api_address]
              + (groups['kubecp']
                 | map('extract', hostvars, 'inventory_rke2_server_node_ip')
                 | reject('equalto', inventory_rke2_server_node_ip)
                 | list)) }}
        etcd_rejoin_data_dir: "{{ inventory_rke2_server_data_dir }}"
        etcd_rejoin_kubectl: >-
          {{ inventory_rke2_server_data_dir }}/bin/kubectl
          --kubeconfig /etc/rancher/rke2/rke2.yaml
        etcd_rejoin_supervisor_port: "{{ inventory_rke2_server_supervisor_port }}"
      ansible.builtin.include_role:
        name: etcd_rejoin
        apply:
          tags:
            - etcd_rejoin

    - name: etcd_stability | Include the etcd stability gate
      tags:
        - etcd_stability
      vars:
        etcd_stability_api_address: "{{ inventory_rke2_server_api_address }}"
        etcd_stability_bootstrap: >-
          {{ inventory_hostname == inventory_kubecp_bootstrap_host }}
        etcd_stability_cp_hostnames: "{{ groups['kubecp'] }}"
        etcd_stability_kubectl: >-
          {{ inventory_rke2_server_data_dir }}/bin/kubectl
          --kubeconfig /etc/rancher/rke2/rke2.yaml
      ansible.builtin.include_role:
        name: etcd_stability
        apply:
          tags:
            - etcd_stability
