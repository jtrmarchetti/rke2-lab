---

- name: Render the cluster state and push it into GitLab
  hosts: controller
  gather_facts: true
  become: false
  tasks:

    - name: gitops | Re-read the OpenBao unseal keys from the recorded file
      vars:
        _gitops_env_sh_text: >-
          {{ lookup('file', ansible_facts['env']['HOME'] + '/.config/rke2lab/env.sh')
             | default('', true) }}

        _gitops_unseal_keys_from_file: >-
          {{ _gitops_env_sh_text
             | regex_search('^export OPENBAO_UNSEAL_KEYS=.*$', multiline=True)
             | default('', true)
             | replace('export OPENBAO_UNSEAL_KEYS=', '')
             | replace('"', '')
             | replace("'", '')
             | trim }}
      ansible.builtin.set_fact:
        gitops_openbao_unseal_keys: >-
          {{ _gitops_unseal_keys_from_file
             if _gitops_unseal_keys_from_file | length > 0
             else lookup('env', 'OPENBAO_UNSEAL_KEYS') }}

    - name: gitops | Include the GitOps source role
      tags:
        - gitops_source
      vars:
        gitops_source_ca_common_name: >-
          {{ inventory_gitops_source_ca_common_name }}
        gitops_source_cluster_domain: >-
          {{ inventory_gitops_source_cluster_domain }}
        gitops_source_commit_email: "{{ inventory_gitops_source_commit_email }}"
        gitops_source_dns_address: "{{ inventory_gitops_source_dns_address }}"
        gitops_source_domain: "{{ inventory_gitops_source_domain }}"
        gitops_source_domain_ca_file: >-
          {{ inventory_gitops_source_domain_ca_file }}
        gitops_source_gitlab_url: "{{ inventory_gitops_source_gitlab_url }}"
        gitops_source_keycloak_realm: >-
          {{ inventory_gitops_source_keycloak_realm }}
        gitops_source_ingress_address: >-
          {{ inventory_gitops_source_ingress_address }}
        gitops_source_lb_range: "{{ inventory_gitops_source_lb_range }}"
        gitops_source_registry_host: "{{ inventory_gitops_source_registry_host }}"

        gitops_source_gitlab_host: "{{ groups['repo'] | first }}"
        gitops_source_openbao_unseal_keys: >-
          {{ gitops_openbao_unseal_keys }}
      ansible.builtin.include_role:
        name: gitops_source
        apply:
          tags:
            - gitops_source

- name: Attach the cluster to the cluster-state repository
  hosts: controller
  gather_facts: true
  become: false
  tags:
    - gitops_bootstrap
  tasks:
    - name: gitops | Include the GitOps bootstrap role
      tags:
        - gitops_bootstrap
      vars:
        gitops_bootstrap_domain_ca_file: >-
          {{ inventory_gitops_bootstrap_domain_ca_file }}
        gitops_bootstrap_gitlab_url: "{{ inventory_gitops_bootstrap_gitlab_url }}"
        gitops_bootstrap_gitlab_host: "{{ groups['repo'] | first }}"
      ansible.builtin.include_role:
        name: gitops_bootstrap
        apply:
          tags:
            - gitops_bootstrap
