---
# Phase 6b/6c — the parts of the cluster services that can only run once Flux
# has deployed them.
#
# Split out of `cluster_services.yml`, and the seam is the GitOps push. That
# playbook stages artifacts, publishes them into GitLab, and refreshes each
# node's registry rewrites — all of which must happen *before* Flux is pointed
# at the cluster-state repository, because they are what makes the images the
# repository names resolvable. Everything here runs *after*, because it drives
# services that Flux is what creates.
#
# Keeping them in one playbook meant a full rebuild could not run in order: the
# vault cannot be initialised before the vault exists, and the vault is
# deployed from the repository `gitops.yml` pushes. See site.yml for the
# resulting sequence.
#
# See plan/PHASE6_IMPLEMENTATION.md.

- name: Verify required secrets are present
  ansible.builtin.import_playbook: preflight_secrets.yml
  vars:
    _preflight_required_env:
      # Federates the domain's directory into Keycloak.
      - FREEIPA_DIR_MANAGER_PASSWORD
      - KEYCLOAK_LDAP_BIND_PASSWORD
      # Written into OpenBao by the openbao_secrets role, which is where every
      # workload now reads them from. They moved here from gitops.yml on
      # 2026-08-16, when they stopped being sealed into the cluster-state
      # repository.
      #
      # GARAGE_S3_* are deliberately absent, for the same reason
      # OPENBAO_UNSEAL_KEYS is absent from gitops.yml: Garage mints that key
      # itself, so on a cold rebuild it does not exist yet.
      - KEYCLOAK_ADMIN_PASSWORD
      - KEYCLOAK_DB_PASSWORD
      - GRAFANA_ADMIN_PASSWORD
      - GARAGE_ADMIN_TOKEN
      - GARAGE_METRICS_TOKEN
      - GARAGE_RPC_SECRET
      # Single sign-on. Every one of these is an OIDC client secret authored by
      # hand rather than generated by Keycloak, which is what lets the two ends
      # of each federation be configured independently — see
      # roles/keycloak_clients/tasks/main.yml. Two of them are written into the
      # vault for workloads to read; the other two are consumed here, by this
      # playbook, and never enter the cluster.
      - OIDC_CLIENT_SECRET_GRAFANA
      - OIDC_CLIENT_SECRET_LONGHORN
      - OIDC_CLIENT_SECRET_OPENBAO
      - OIDC_CLIENT_SECRET_GITLAB
      # Not an OIDC credential: the key oauth2-proxy encrypts its session
      # cookie with. 16, 24 or 32 bytes, asserted by openbao_secrets.
      - OAUTH2_PROXY_COOKIE_SECRET
      # The FreeIPA groups that authorise every federated service are created
      # as the domain administrator.
      - FREEIPA_ADMIN_PASSWORD

# After the artifact plays, the node plays, and the GitOps push, because the
# vault it initialises is deployed by Flux from the repository that push
# writes and from images those plays published. It fails cleanly against a
# cluster where OpenBao is not yet running — reporting the pod missing, which
# is a clearer outcome than initialising something that is not there.
- name: Initialise the vault once and record its keys
  hosts: controller
  gather_facts: true
  become: false
  tags:
    - openbao_init
    - openbao_config
    - openbao_secrets
    - garage_init
    - ipa_sso_groups
    - keycloak_break_glass
    - keycloak_realm
    - keycloak_ldap
    - keycloak_ldap_master
    - keycloak_clients
    - keycloak_realm_admins
    - keycloak_realm_admins_master
    - openbao_oidc
  tasks:
    - name: cluster_init | Include the OpenBao initialisation role
      tags:
        - openbao_init
      ansible.builtin.include_role:
        name: openbao_init
        apply:
          tags:
            - openbao_init

    # openbao_init wrote the root token to env.sh on disk, but the roles below
    # resolve OPENBAO_ROOT_TOKEN through lookup('env', ...), which is the
    # environment this ansible-playbook process started with — stale on a cold
    # build, when openbao_init just minted the token, and empty on a true one.
    # Re-read it from the file openbao_init writes into, so the config,
    # secrets and oidc roles consume the key the vault on this host holds.
    #
    # The line as written by the blockinfile: export OPENBAO_ROOT_TOKEN="<token>".
    # Fallback to the process env keeps this play usable where the file does
    # not carry the line yet (the very first lines of env.sh.example are
    # written by the bootstrap before openbao_init has a chance to run).
    - name: cluster_init | Re-read the OpenBao root token from the recorded file
      tags:
        - openbao_init
      vars:
        # openbao_init_env_file is a role default, not visible at play level;
        # use the same path the role writes to (see openbao_init/defaults/main.yml).
        _openbao_env_sh_text: >-
          {{ lookup('file', ansible_facts['env']['HOME'] + '/.config/rke2lab/env.sh')
             | default('', true) }}
        # No capture group in the pattern: without backrefs this filter hands
        # back the whole match as a string, which is what the replace below
        # strips the prefix and quotes from.
        _openbao_root_token_from_file: >-
          {{ _openbao_env_sh_text
             | regex_search('^export OPENBAO_ROOT_TOKEN=.*$', multiline=True)
             | default('', true)
             | replace('export OPENBAO_ROOT_TOKEN=', '')
             | replace('"', '')
             | replace("'", '')
             | trim }}
      ansible.builtin.set_fact:
        cluster_init_openbao_root_token: >-
          {{ _openbao_root_token_from_file
             if _openbao_root_token_from_file | length > 0
             else lookup('env', 'OPENBAO_ROOT_TOKEN') }}

    # The vault's TLS, established before any of the roles below open a
    # connection. All of them verify against a CA file, and what they must
    # verify against is the certificate the ingress *is serving*. Early in a
    # cold build that is not yet the certificate cert-manager issued for the
    # Ingress: Traefik has been up since the control plane configured it, and
    # until it knows about the `openbao-tls` Secret it answers the host name
    # with its own self-signed default. Verifying that default against the
    # domain CA fails with `self-signed certificate`, and that is exactly the
    # `CERTIFICATE_VERIFY_FAILED` the first openbao task of a rebuild that
    # runs fast enough hits — the vault pod has just come up, initialisation
    # has run, and the ingress certificate is issued seconds after the first
    # uri task connected.
    #
    # The prerequisite is therefore stated here as code rather than assumed,
    # and polled the way openbao_init polls the pod itself: the
    # unauthenticated /v1/sys/health endpoint, verified against the domain CA.
    # Any answer that TLS accepted means the ingress certificate is in place
    # and chains; until then, keep waiting.
    - name: cluster_init | Wait for the ingress to serve the vault's certificate
      tags:
        - openbao_config
      # uri has no dry run, and a probe that connects in check mode would
      # touch the running vault for nothing. Same gate the openbao_secrets
      # and openbao_oidc roles use on their uri blocks.
      when: not ansible_check_mode
      register: _reg_openbao_ingress_ready
      until: >-
        (_reg_openbao_ingress_ready['status'] | default(0))
        in [200, 403, 429, 472, 473, 503]
      retries: 20
      delay: 15
      changed_when: false
      failed_when: false
      ansible.builtin.uri:
        url: "{{ inventory_openbao_config_url }}/v1/sys/health"
        method: GET
        # The domain CA, where controller_trust keeps it current: the
        # cluster's intermediate rides along in the served chain, and the
        # root is the link that has to be anchored on this host. Same
        # authority the Keycloak probe below verifies against.
        ca_path: "{{ inventory_gitops_bootstrap_domain_ca_file }}"
        status_code: [200, 403, 429, 472, 473, 503]

    # A probe that gives up does not skip the vault on this run: configuring
    # it is why this play exists, and a run that pretends the certificate
    # came up when it did not is the failure that hides. In check mode the
    # probe itself is skipped, which is why the failure is looked at only
    # when it was not.
    - name: cluster_init | Report that the ingress certificate does not verify
      tags:
        - openbao_config
      when:
        - not (_reg_openbao_ingress_ready is skipped)
        - (_reg_openbao_ingress_ready['status'] | default(0))
          not in [200, 403, 429, 472, 473, 503]
      ansible.builtin.assert:
        that:
          - (_reg_openbao_ingress_ready['status'] | default(0))
            in [200, 403, 429, 472, 473, 503]
        fail_msg: >-
          {{ inventory_openbao_config_url }} still did not verify against
          {{ inventory_gitops_bootstrap_domain_ca_file }} after
          {{ 20 * 15 }}s of waiting. cert-manager has not issued the
          openbao-tls Secret, or Traefik is still serving its default
          certificate, and every vault role in this play fails on TLS until
          it has. Look at the openbao-tls Secret and Certificate in the
          openbao namespace, and the k8s-ca Secret in cert-manager.
        quiet: true

    # Configuration, not initialisation, and separate because it is the part
    # that is safe to re-run and to change. The root token it needs was written
    # to env.sh by the role above; the fact set just above re-reads it from
    # disk rather than trusting the (stale) process environment.
    - name: cluster_init | Include the OpenBao configuration role
      tags:
        - openbao_config
      vars:
        openbao_config_url: "{{ inventory_openbao_config_url }}"
        openbao_config_root_token: "{{ cluster_init_openbao_root_token }}"
      ansible.builtin.include_role:
        name: openbao_config
        apply:
          tags:
            - openbao_config

    # Immediately after the store is built, and before anything that needs a
    # workload to be running, because from 2026-08-16 this is what makes those
    # workloads able to start: Keycloak, Garage and Grafana read their
    # credentials out of the vault through External Secrets rather than from a
    # SealedSecret in Git. An empty vault leaves all three waiting on a Secret
    # that never syncs.
    - name: cluster_init | Include the OpenBao runtime secrets role
      tags:
        - openbao_secrets
      vars:
        openbao_secrets_url: "{{ inventory_openbao_secrets_url }}"
        openbao_secrets_root_token: "{{ cluster_init_openbao_root_token }}"
        openbao_secrets_keycloak_admin_password: >-
          {{ lookup('env', 'KEYCLOAK_ADMIN_PASSWORD') }}
        openbao_secrets_keycloak_db_password: >-
          {{ lookup('env', 'KEYCLOAK_DB_PASSWORD') }}
        openbao_secrets_grafana_admin_password: >-
          {{ lookup('env', 'GRAFANA_ADMIN_PASSWORD') }}
        openbao_secrets_garage_admin_token: >-
          {{ lookup('env', 'GARAGE_ADMIN_TOKEN') }}
        openbao_secrets_garage_metrics_token: >-
          {{ lookup('env', 'GARAGE_METRICS_TOKEN') }}
        openbao_secrets_garage_rpc_secret: >-
          {{ lookup('env', 'GARAGE_RPC_SECRET') }}
        # Empty until Garage has minted them, which is the play below. This
        # pass therefore omits the garage-s3 entry on the run that mints the
        # key; the second pass after garage_init re-reads the values from
        # env.sh and writes the entry, so no second run is needed.
        openbao_secrets_garage_s3_access_key: >-
          {{ lookup('env', 'GARAGE_S3_ACCESS_KEY') }}
        openbao_secrets_garage_s3_secret_key: >-
          {{ lookup('env', 'GARAGE_S3_SECRET_KEY') }}
        # The two OIDC secrets a *workload* reads. Neither is optional the way
        # Garage's S3 key is, and that is the point: they are authored rather
        # than generated, so they can be written on the first pass of a cold
        # rebuild and Grafana and the Longhorn proxy start without waiting for
        # Keycloak to exist.
        #
        # OpenBao's and GitLab's client secrets are deliberately absent.
        # Neither reaches its consumer through External Secrets — OpenBao keeps
        # its own inside its auth configuration, GitLab in gitlab.rb on repo01
        # — and the vault holds what a running workload reads.
        openbao_secrets_grafana_oidc_client_secret: >-
          {{ lookup('env', 'OIDC_CLIENT_SECRET_GRAFANA') }}
        openbao_secrets_longhorn_oidc_client_secret: >-
          {{ lookup('env', 'OIDC_CLIENT_SECRET_LONGHORN') }}
        openbao_secrets_longhorn_cookie_secret: >-
          {{ lookup('env', 'OAUTH2_PROXY_COOKIE_SECRET') }}
      ansible.builtin.include_role:
        name: openbao_secrets
        apply:
          tags:
            - openbao_secrets

    - name: cluster_init | Include the Garage initialisation role
      tags:
        - garage_init
      ansible.builtin.include_role:
        name: garage_init
        apply:
          tags:
            - garage_init

    # Garage just minted the S3 key above and recorded it in env.sh on disk,
    # but this process's environment was snapshotted at start, so the first
    # pass of openbao_secrets (run before Garage existed) could not see it and
    # correctly omitted the garage-s3 entry. Re-read the two values from the
    # file and run the role a second time to write just that entry. The role
    # reads the vault before it writes, so on any later run both values are
    # already present and this is a no-op, not a rewrite.
    - name: cluster_init | Re-read the Garage S3 credentials from the recorded file
      tags:
        - openbao_secrets
        - garage_init
      vars:
        # Same path as openbao_init writes to (see its defaults); the role
        # default is not visible at play level.
        _cluster_init_env_sh_text: >-
          {{ lookup('file', ansible_facts['env']['HOME'] + '/.config/rke2lab/env.sh')
             | default('', true) }}
        # No capture group: without a backref the filter hands back the whole
        # match as a string, which the replace filters below strip the prefix
        # and any quoting from. The values are written unquoted, so the quote
        # removal is a harmless no-op here.
        _cluster_init_garage_s3_access_key_from_file: >-
          {{ _cluster_init_env_sh_text
             | regex_search('^export GARAGE_S3_ACCESS_KEY=.*$', multiline=True)
             | default('', true)
             | replace('export GARAGE_S3_ACCESS_KEY=', '')
             | replace('"', '')
             | replace("'", '')
             | trim }}
        _cluster_init_garage_s3_secret_key_from_file: >-
          {{ _cluster_init_env_sh_text
             | regex_search('^export GARAGE_S3_SECRET_KEY=.*$', multiline=True)
             | default('', true)
             | replace('export GARAGE_S3_SECRET_KEY=', '')
             | replace('"', '')
             | replace("'", '')
             | trim }}
      ansible.builtin.set_fact:
        cluster_init_garage_s3_access_key: >-
          {{ _cluster_init_garage_s3_access_key_from_file
             if _cluster_init_garage_s3_access_key_from_file | length > 0
             else lookup('env', 'GARAGE_S3_ACCESS_KEY') }}
        cluster_init_garage_s3_secret_key: >-
          {{ _cluster_init_garage_s3_secret_key_from_file
             if _cluster_init_garage_s3_secret_key_from_file | length > 0
             else lookup('env', 'GARAGE_S3_SECRET_KEY') }}

    - name: cluster_init | Write the Garage S3 entry to the vault (second pass)
      tags:
        - openbao_secrets
        - garage_init
      vars:
        openbao_secrets_url: "{{ inventory_openbao_secrets_url }}"
        openbao_secrets_root_token: "{{ cluster_init_openbao_root_token }}"
        # The S3 keys come from the file just written; every other value is
        # already in the vault from the first pass, and passing them again is
        # a read-compare-write that is a no-op when they are unchanged.
        openbao_secrets_keycloak_admin_password: >-
          {{ lookup('env', 'KEYCLOAK_ADMIN_PASSWORD') }}
        openbao_secrets_keycloak_db_password: >-
          {{ lookup('env', 'KEYCLOAK_DB_PASSWORD') }}
        openbao_secrets_grafana_admin_password: >-
          {{ lookup('env', 'GRAFANA_ADMIN_PASSWORD') }}
        openbao_secrets_garage_admin_token: >-
          {{ lookup('env', 'GARAGE_ADMIN_TOKEN') }}
        openbao_secrets_garage_metrics_token: >-
          {{ lookup('env', 'GARAGE_METRICS_TOKEN') }}
        openbao_secrets_garage_rpc_secret: >-
          {{ lookup('env', 'GARAGE_RPC_SECRET') }}
        openbao_secrets_garage_s3_access_key: >-
          {{ cluster_init_garage_s3_access_key }}
        openbao_secrets_garage_s3_secret_key: >-
          {{ cluster_init_garage_s3_secret_key }}
        openbao_secrets_grafana_oidc_client_secret: >-
          {{ lookup('env', 'OIDC_CLIENT_SECRET_GRAFANA') }}
        openbao_secrets_longhorn_oidc_client_secret: >-
          {{ lookup('env', 'OIDC_CLIENT_SECRET_LONGHORN') }}
        openbao_secrets_longhorn_cookie_secret: >-
          {{ lookup('env', 'OAUTH2_PROXY_COOKIE_SECRET') }}
      ansible.builtin.include_role:
        name: openbao_secrets
        apply:
          tags:
            - openbao_secrets

    # --- Single sign-on ---------------------------------------------------
    #
    # Seven roles, and the order between them is the only thing here that is
    # not free to change:
    #
    #   1. ipa_sso_groups creates the groups, in the domain, where identity
    #      already lives. It runs whatever the cluster is doing, because
    #      FreeIPA is up long before Keycloak.
    #   2. keycloak_break_glass makes Keycloak's own administrator permanent —
    #      the account bootstrap creates is marked temporary — and clears the
    #      administrative realm of federation. First of the Keycloak roles,
    #      because it is the account every one of them authenticates as.
    #   3. keycloak_realm creates the realm the clients live in — not master,
    #      which administers every other realm and holds that administrator.
    #   4. keycloak_ldap federates the directory into that realm and imports
    #      the groups from it. It runs a second time against `master`, with a
    #      user filter admitting only the members of `keycloak-admins` and a
    #      group filter naming only that group — which is what makes
    #      administering Keycloak itself a domain group rather than a shared
    #      password, without putting the domain in the administrative realm.
    #   5. keycloak_clients creates a client per service and binds each group
    #      to a client role. It needs the groups to have been imported, which
    #      is why keycloak_ldap forces a synchronisation rather than waiting
    #      for a periodic one.
    #   6. keycloak_realm_admins grants the directory's `keycloak-admins`
    #      group administration of that realm, so that administering Keycloak
    #      is a domain group like every other grant rather than a shared local
    #      password. It needs the group imported, so it follows the
    #      federation for the same reason keycloak_clients does. It too runs
    #      twice: `realm-admin` on the application realm's
    #      `realm-management` client, and the `admin` realm role in master,
    #      which has no such client.
    #   7. openbao_oidc adds a sign-in path to the vault, beside the root
    #      token and never instead of it.
    #
    # What is *not* in this ordering is any dependency on a client secret being
    # generated. Every one is authored in env.sh, written into the vault by the
    # role above, and set on the client here — so the workloads that read them
    # never wait for this play, and nothing needs a second pass.
    #
    # Everything from 2 onward is gated on Keycloak being reachable. The gate
    # used to be a fact nothing in the repository set — a manual switch from
    # the era when the VM's CPU model kept Keycloak from starting, and a
    # rebuild skipped the whole SSO path until someone remembered to pass it.
    # The CPU fix now ships inside the Pulumi VM, so the fact is a live probe:
    # wait for the admin API to answer, and if it still has not by the time
    # the probe gives up, the run reports it rather than pretending it ran.
    - name: cluster_init | Probe whether Keycloak's admin API answers
      register: _reg_keycloak_ready_probe
      until: _reg_keycloak_ready_probe['status'] == 200
      retries: 40
      delay: 15
      changed_when: false
      failed_when: false
      ansible.builtin.uri:
        url: "{{ inventory_keycloak_ldap_url }}/realms/master"
        method: GET
        # Same CA the role above fetches and trusts: the python interpreter
        # this runs under does not point at the system trust store, so without
        # this the probe verifies against the wrong root and reports not ready
        # for the only reason it can be reached by name.
        ca_path: "{{ inventory_gitops_bootstrap_domain_ca_file }}"
        status_code: [200, 502, 503]

    - name: cluster_init | Record whether Keycloak is ready
      ansible.builtin.set_fact:
        keycloak_ready: >-
          {{ _reg_keycloak_ready_probe['status'] | default(0) == 200 }}

    - name: cluster_init | Report that Keycloak was not reachable
      when: not (keycloak_ready | bool)
      ansible.builtin.debug:
        msg: >-
          Keycloak at {{ inventory_keycloak_ldap_url }} did not answer after
          {{ 40 * 15 }}s; the Keycloak-gated roles skipped. Re-run
          cluster_init.yml once Keycloak is serving.

    - name: cluster_init | Include the application group role
      tags:
        - ipa_sso_groups
      vars:
        ipa_sso_groups_admin_password: >-
          {{ inventory_ipa_sso_groups_admin_password }}
        ipa_sso_groups_applications: "{{ inventory_keycloak_applications }}"
        ipa_sso_groups_admin_only_applications: >-
          {{ inventory_keycloak_admin_only_applications }}
        ipa_sso_groups_ipa_container: >-
          {{ inventory_ipa_sso_groups_ipa_container }}
        ipa_sso_groups_ipa_host: "{{ inventory_ipa_sso_groups_ipa_host }}"
      ansible.builtin.include_role:
        name: ipa_sso_groups
        apply:
          tags:
            - ipa_sso_groups

    - name: cluster_init | Include the Keycloak break-glass role
      when: (keycloak_ready | default(false) | bool)
      tags:
        - keycloak_break_glass
      vars:
        keycloak_break_glass_admin_password: >-
          {{ lookup('env', 'KEYCLOAK_ADMIN_PASSWORD') }}
        keycloak_break_glass_allowed_federation: >-
          {{ inventory_keycloak_break_glass_allowed_federation }}
        keycloak_break_glass_url: "{{ inventory_keycloak_ldap_url }}"
      ansible.builtin.include_role:
        name: keycloak_break_glass
        apply:
          tags:
            - keycloak_break_glass

    - name: cluster_init | Include the Keycloak realm role
      when: (keycloak_ready | default(false) | bool)
      tags:
        - keycloak_realm
      vars:
        keycloak_realm_admin_password: >-
          {{ lookup('env', 'KEYCLOAK_ADMIN_PASSWORD') }}
        keycloak_realm_display_name: >-
          {{ inventory_keycloak_realm_display_name }}
        keycloak_realm_name: "{{ inventory_keycloak_realm_name }}"
        keycloak_realm_url: "{{ inventory_keycloak_ldap_url }}"
      ansible.builtin.include_role:
        name: keycloak_realm
        apply:
          tags:
            - keycloak_realm

    # The identity federation. Its FreeIPA half runs whatever the cluster is
    # doing; its Keycloak half is gated, because Keycloak does not start on
    # the current VM CPU model — see plan/PHASE6_IMPLEMENTATION.md.
    - name: cluster_init | Include the Keycloak LDAP federation role
      tags:
        - keycloak_ldap
      vars:
        keycloak_ldap_connection_url: >-
          {{ inventory_keycloak_ldap_connection_url }}
        keycloak_ldap_dir_manager_password: >-
          {{ lookup('env', 'FREEIPA_DIR_MANAGER_PASSWORD') }}
        keycloak_ldap_groups_dn: "{{ inventory_keycloak_ldap_groups_dn }}"
        keycloak_ldap_realm: "{{ inventory_keycloak_realm_name }}"
        keycloak_ldap_url: "{{ inventory_keycloak_ldap_url }}"
        keycloak_ldap_bind_password: >-
          {{ lookup('env', 'KEYCLOAK_LDAP_BIND_PASSWORD') }}
        keycloak_ldap_admin_password: >-
          {{ lookup('env', 'KEYCLOAK_ADMIN_PASSWORD') }}
        keycloak_ldap_configure_keycloak: >-
          {{ keycloak_ready | default(false) }}
      ansible.builtin.include_role:
        name: keycloak_ldap
        apply:
          tags:
            - keycloak_ldap

    # The same role, the same directory, the administrative realm — and two
    # filters, which are the whole difference between delegating
    # administration of Keycloak and federating the domain into the realm that
    # administers every other realm. The role refuses master without both.
    #
    # `keycloak_ldap_manage_sysaccount: false` because the bind account is the
    # one the invocation above already created; creating it twice is two
    # Directory Manager binds for one outcome.
    - name: cluster_init | Include the Keycloak LDAP federation role for master
      when: (keycloak_ready | default(false) | bool)
      tags:
        - keycloak_ldap_master
      vars:
        keycloak_ldap_allow_master_realm: true
        keycloak_ldap_admin_password: >-
          {{ lookup('env', 'KEYCLOAK_ADMIN_PASSWORD') }}
        keycloak_ldap_bind_password: >-
          {{ lookup('env', 'KEYCLOAK_LDAP_BIND_PASSWORD') }}
        keycloak_ldap_connection_url: >-
          {{ inventory_keycloak_ldap_connection_url }}
        keycloak_ldap_dir_manager_password: >-
          {{ lookup('env', 'FREEIPA_DIR_MANAGER_PASSWORD') }}
        keycloak_ldap_groups_dn: "{{ inventory_keycloak_ldap_groups_dn }}"
        keycloak_ldap_groups_filter: >-
          {{ inventory_keycloak_admin_groups_filter }}
        keycloak_ldap_manage_sysaccount: false
        keycloak_ldap_realm: master
        keycloak_ldap_url: "{{ inventory_keycloak_ldap_url }}"
        keycloak_ldap_user_search_filter: >-
          {{ inventory_keycloak_admin_user_filter | trim }}
      ansible.builtin.include_role:
        name: keycloak_ldap
        apply:
          tags:
            - keycloak_ldap_master

    - name: cluster_init | Include the Keycloak client role
      when: (keycloak_ready | default(false) | bool)
      tags:
        - keycloak_clients
      vars:
        keycloak_clients_admin_password: >-
          {{ lookup('env', 'KEYCLOAK_ADMIN_PASSWORD') }}
        keycloak_clients_applications: >-
          {{ inventory_keycloak_applications }}
        keycloak_clients_realm: "{{ inventory_keycloak_realm_name }}"
        keycloak_clients_url: "{{ inventory_keycloak_ldap_url }}"
      ansible.builtin.include_role:
        name: keycloak_clients
        apply:
          tags:
            - keycloak_clients

    - name: cluster_init | Include the Keycloak realm administrator role
      when: (keycloak_ready | default(false) | bool)
      tags:
        - keycloak_realm_admins
      vars:
        keycloak_realm_admins_admin_password: >-
          {{ lookup('env', 'KEYCLOAK_ADMIN_PASSWORD') }}
        keycloak_realm_admins_group: "{{ inventory_keycloak_admins_group }}"
        keycloak_realm_admins_realm: "{{ inventory_keycloak_realm_name }}"
        keycloak_realm_admins_url: "{{ inventory_keycloak_ldap_url }}"
      ansible.builtin.include_role:
        name: keycloak_realm_admins
        apply:
          tags:
            - keycloak_realm_admins

    # Administering master, which is a realm role rather than a role on a
    # client — master has no `realm-management`, because administering it is
    # not administering an application.
    #
    # This is the grant that lets a member of `keycloak-admins` create realms
    # and edit master itself. It also means such an account can disable the
    # local break-glass administrator, which is the cost of the arrangement and
    # is recorded in the role's defaults rather than left to be discovered.
    - name: cluster_init | Include the Keycloak master administrator role
      when: (keycloak_ready | default(false) | bool)
      tags:
        - keycloak_realm_admins_master
      vars:
        keycloak_realm_admins_admin_password: >-
          {{ lookup('env', 'KEYCLOAK_ADMIN_PASSWORD') }}
        keycloak_realm_admins_allow_master_realm: true
        keycloak_realm_admins_client: ""
        keycloak_realm_admins_group: "{{ inventory_keycloak_admins_group }}"
        keycloak_realm_admins_realm: master
        keycloak_realm_admins_roles: >-
          {{ inventory_keycloak_master_admin_roles }}
        keycloak_realm_admins_url: "{{ inventory_keycloak_ldap_url }}"
      ansible.builtin.include_role:
        name: keycloak_realm_admins
        apply:
          tags:
            - keycloak_realm_admins_master

    # Last, because it is the one that has to be reasoned about rather than
    # ordered: the vault holds Keycloak's own database password, so this adds a
    # second way in and never replaces the first. The role asserts as much
    # before it finishes.
    - name: cluster_init | Include the OpenBao single sign-on role
      when: (keycloak_ready | default(false) | bool)
      tags:
        - openbao_oidc
      vars:
        openbao_oidc_client_secret: >-
          {{ inventory_openbao_oidc_client_secret }}
        openbao_oidc_discovery_ca_file: >-
          {{ inventory_openbao_oidc_discovery_ca_file }}
        openbao_oidc_issuer: "{{ inventory_keycloak_realm_issuer }}"
        openbao_oidc_root_token: "{{ cluster_init_openbao_root_token }}"
        openbao_oidc_url: "{{ inventory_openbao_oidc_url }}"
      ansible.builtin.include_role:
        name: openbao_oidc
        apply:
          tags:
            - openbao_oidc

# Secrets minted during this run, and how each is re-read.
#
# `lookup('env', ...)` reads the environment this ansible-playbook process
# started with, which on a cold build predates every value written to env.sh
# during the run. The roles that mint a value (openbao_init, garage_init)
# record it to env.sh on disk; the roles that consume it therefore re-read the
# file after the write rather than trusting the process environment:
#
#   OPENBAO_ROOT_TOKEN   written by openbao_init, re-read before
#                        openbao_config / openbao_secrets / openbao_oidc.
#   GARAGE_S3_*          written by garage_init, re-read before a second
#                        pass of openbao_secrets. The first pass runs before
#                        Garage exists and correctly omits the garage-s3
#                        entry; the second writes just that entry, and is a
#                        no-op on every later run.
#   OPENBAO_UNSEAL_KEYS  written by openbao_init, re-read the same way in
#                        gitops.yml before the gitops_source include.
