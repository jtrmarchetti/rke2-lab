---

- name: Verify required secrets are present
  ansible.builtin.import_playbook: preflight_secrets.yml
  vars:
    _preflight_required_env:

      - FREEIPA_ADMIN_PASSWORD

      - GITLAB_ROOT_PASSWORD

      - OIDC_CLIENT_SECRET_GITLAB

- name: Configure phase3 GitLab platform on the repository host
  hosts: repo
  gather_facts: true
  become: true

  force_handlers: true
  tasks:

    - name: gitlab | Include the service certificate role
      tags:
        - ipa_service_cert
      vars:
        ipa_service_cert_admin_password: >-
          {{ inventory_ipa_service_cert_admin_password }}
        ipa_service_cert_ca_file: "{{ inventory_ipa_service_cert_ca_file }}"
        ipa_service_cert_ca_publish_path: >-
          {{ inventory_ipa_service_cert_ca_publish_path }}
        ipa_service_cert_dir: "{{ inventory_ipa_service_cert_dir }}"
        ipa_service_cert_enabled: "{{ inventory_ipa_service_cert_enabled }}"
        ipa_service_cert_ipa_host: "{{ inventory_ipa_service_cert_ipa_host }}"
        ipa_service_cert_names: "{{ inventory_ipa_service_cert_names }}"
        ipa_service_cert_trust_ca_path: >-
          {{ inventory_ipa_service_cert_trust_ca_path }}
      ansible.builtin.include_role:
        name: ipa_service_cert
        apply:
          tags:
            - ipa_service_cert

    - name: gitlab | Include the GitLab role
      tags:
        - gitlab
      vars:
        gitlab_compose_dir: "{{ inventory_gitlab_compose_dir }}"
        gitlab_container_image: "{{ inventory_gitlab_container_image }}"
        gitlab_container_name: "{{ inventory_gitlab_container_name }}"
        gitlab_data_root: "{{ inventory_gitlab_data_root }}"
        gitlab_enabled: "{{ inventory_gitlab_enabled }}"
        gitlab_external_hostname: "{{ inventory_gitlab_external_hostname }}"
        gitlab_external_url: "{{ inventory_gitlab_external_url }}"
        gitlab_https_port: "{{ inventory_gitlab_https_port }}"
        gitlab_image_tarball_url: "{{ inventory_gitlab_image_tarball_url }}"
        gitlab_env_template: "{{ inventory_gitlab_env_template }}"
        gitlab_compose_template: "{{ inventory_gitlab_compose_template }}"
        gitlab_oidc_ca_source_file: >-
          {{ inventory_gitlab_oidc_ca_source_file }}
        gitlab_oidc_client_secret: "{{ inventory_gitlab_oidc_client_secret }}"
        gitlab_oidc_enabled: "{{ inventory_gitlab_oidc_enabled }}"
        gitlab_oidc_issuer: "{{ inventory_gitlab_oidc_issuer }}"
        gitlab_registry_enabled: "{{ inventory_gitlab_registry_enabled }}"
        gitlab_registry_external_url: >-
          {{ inventory_gitlab_registry_external_url }}
        gitlab_registry_hostname: "{{ inventory_gitlab_registry_hostname }}"
        gitlab_root_password: "{{ inventory_gitlab_root_password }}"
        gitlab_ssl_source_dir: "{{ inventory_gitlab_ssl_source_dir }}"
      ansible.builtin.include_role:
        name: gitlab
        apply:
          tags:
            - gitlab
