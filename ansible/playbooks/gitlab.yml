---
# Phase 3: GitLab on repo01, becoming Tier 2 of the artifact model.
#
# Depends on Phase 2 rather than only on Phase 1: the certificates are issued by
# the FreeIPA CA and the service names are published in dev.lo, so this cannot
# run against an environment where core01 is not serving.

- name: Verify required secrets are present
  ansible.builtin.import_playbook: preflight_secrets.yml
  vars:
    _preflight_required_env:
      # Signs the service certificate requests on core01.
      - FREEIPA_ADMIN_PASSWORD
      # Seeds the GitLab root account on first reconfigure.
      - GITLAB_ROOT_PASSWORD
      # GitLab's OIDC client secret. Required here, on the phase 3 playbook,
      # rather than only where Keycloak is configured — the secret is authored
      # rather than generated, which is what lets GitLab carry its single
      # sign-on configuration from its very first run, long before the cluster
      # that hosts Keycloak exists. Until Keycloak answers, the sign-in button
      # fails and the root password still works.
      - OIDC_CLIENT_SECRET_GITLAB

- name: Configure phase3 GitLab platform on the repository host
  hosts: repo
  gather_facts: true
  become: true
  # Without this a task failing late discards the handlers queued earlier, so a
  # changed compose file sits on disk while the old container keeps running and
  # the next run sees no change and never restarts it. Same reasoning as
  # repo01.yml, where that exact failure left a service on the wrong address.
  force_handlers: true
  tasks:
    # Before GitLab: the role asserts the certificate files exist rather than
    # letting omnibus fail deep inside an nginx template.
    - name: gitlab | Include the service certificate role
      tags:
        - ipa_service_cert
      vars:
        ipa_service_cert_admin_password: >-
          {{ inventory_ipa_service_cert_admin_password }}
        ipa_service_cert_ca_file: "{{ inventory_ipa_service_cert_ca_file }}"
        ipa_service_cert_ca_publish_path: >-
          {{ inventory_ipa_service_cert_ca_publish_path }}
        ipa_service_cert_dir: "{{ inventory_ipa_service_cert_dir }}"
        ipa_service_cert_enabled: "{{ inventory_ipa_service_cert_enabled }}"
        ipa_service_cert_ipa_host: "{{ inventory_ipa_service_cert_ipa_host }}"
        ipa_service_cert_names: "{{ inventory_ipa_service_cert_names }}"
        ipa_service_cert_trust_ca_path: >-
          {{ inventory_ipa_service_cert_trust_ca_path }}
      ansible.builtin.include_role:
        name: ipa_service_cert
        apply:
          tags:
            - ipa_service_cert

    - name: gitlab | Include the GitLab role
      tags:
        - gitlab
      vars:
        gitlab_compose_dir: "{{ inventory_gitlab_compose_dir }}"
        gitlab_container_image: "{{ inventory_gitlab_container_image }}"
        gitlab_data_root: "{{ inventory_gitlab_data_root }}"
        gitlab_enabled: "{{ inventory_gitlab_enabled }}"
        gitlab_external_hostname: "{{ inventory_gitlab_external_hostname }}"
        gitlab_external_url: "{{ inventory_gitlab_external_url }}"
        gitlab_https_port: "{{ inventory_gitlab_https_port }}"
        gitlab_image_tarball_url: "{{ inventory_gitlab_image_tarball_url }}"
        gitlab_letsencrypt_enabled: "{{ inventory_gitlab_letsencrypt_enabled }}"
        gitlab_monitoring_allowed_networks: >-
          {{ inventory_gitlab_monitoring_allowed_networks }}
        gitlab_oidc_ca_source_file: >-
          {{ inventory_gitlab_oidc_ca_source_file }}
        gitlab_oidc_client_id: "{{ inventory_gitlab_oidc_client_id }}"
        gitlab_oidc_client_secret: "{{ inventory_gitlab_oidc_client_secret }}"
        gitlab_oidc_enabled: "{{ inventory_gitlab_oidc_enabled }}"
        gitlab_oidc_issuer: "{{ inventory_gitlab_oidc_issuer }}"
        gitlab_oidc_label: "{{ inventory_gitlab_oidc_label }}"
        gitlab_package_registry_enabled: >-
          {{ inventory_gitlab_package_registry_enabled }}
        gitlab_registry_enabled: "{{ inventory_gitlab_registry_enabled }}"
        gitlab_registry_external_url: >-
          {{ inventory_gitlab_registry_external_url }}
        gitlab_registry_hostname: "{{ inventory_gitlab_registry_hostname }}"
        gitlab_root_password: "{{ inventory_gitlab_root_password }}"
        gitlab_ssh_port: "{{ inventory_gitlab_ssh_port }}"
        gitlab_ssl_source_dir: "{{ inventory_gitlab_ssl_source_dir }}"
      ansible.builtin.include_role:
        name: gitlab
        apply:
          tags:
            - gitlab
