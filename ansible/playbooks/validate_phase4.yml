---

- name: Validate the RKE2 control plane
  hosts: kubecp
  gather_facts: true
  become: true
  vars:
    _validate_kubectl: >-
      {{ inventory_rke2_server_data_dir }}/bin/kubectl
      --kubeconfig /etc/rancher/rke2/rke2.yaml
  tasks:

    - name: validate_phase4 | Validate the data volume is mounted
      vars:
        _validate_mounts: >-
          {{ ansible_facts['mounts'] | selectattr('mount', 'equalto',
             inventory_data_volume_mount_path) | list }}
      ansible.builtin.assert:
        that:
          - _validate_mounts | length == 1
        fail_msg: >-
          {{ inventory_data_volume_mount_path }} is not mounted. RKE2's data directory
          and the containerd image store would be filling the OS disk.
        quiet: true

    - name: validate_phase4 | Validate every control plane node is Ready
      changed_when: false
      run_once: true
      register: _reg_validate_nodes_ready
      ansible.builtin.command:
        cmd: >-
          {{ _validate_kubectl }} wait --for=condition=Ready
          nodes --all --timeout=30s

    - name: validate_phase4 | Read the registered node names
      changed_when: false
      run_once: true
      register: _reg_validate_nodes
      ansible.builtin.command:
        cmd: "{{ _validate_kubectl }} get nodes -o name"

    - name: validate_phase4 | Validate every control plane node is registered
      run_once: true
      vars:
        _validate_expected: >-
          {{ groups['kubecp']
             | map('regex_replace', '$', '.dev.lo')
             | map('regex_replace', '^', 'node/')
             | list }}
      ansible.builtin.assert:
        that:
          - >-
            _validate_expected
            | difference(_reg_validate_nodes['stdout_lines'] | select | list)
            | length == 0
        fail_msg: >-
          Expected every one of {{ _validate_expected }} to be registered,
          found {{ _reg_validate_nodes['stdout_lines'] | select | list }}.
        quiet: true

    - name: validate_phase4 | Read the etcd member health
      changed_when: false
      run_once: true
      register: _reg_validate_etcd
      ansible.builtin.command:
        cmd: >-
          {{ _validate_kubectl }} get pods -n kube-system
          -l component=etcd --no-headers

    - name: validate_phase4 | Validate etcd has one running member per server
      run_once: true
      ansible.builtin.assert:
        that:
          - >-
            _reg_validate_etcd['stdout_lines'] | select('search', ' Running ')
            | list | length == groups['kubecp'] | length
        fail_msg: >-
          etcd does not have a member running on every server:
          {{ _reg_validate_etcd['stdout_lines'] }}. A control plane that lost quorum
          answers reads and silently refuses writes.
        quiet: true

    - name: validate_phase4 | Validate no air-gap image tarball was seeded on the node
      register: _reg_validate_seeded
      ansible.builtin.find:
        paths: "{{ inventory_rke2_node_data_dir }}/agent/images"
        patterns: "rke2-images*"

    - name: validate_phase4 | Assert the images came from the registry, not from a tarball
      ansible.builtin.assert:
        that:
          - _reg_validate_seeded['matched'] == 0
        fail_msg: >-
          {{ inventory_rke2_node_data_dir }}/agent/images holds
          {{ _reg_validate_seeded['matched'] }} image tarballs. containerd would
          find every image locally and never contact the mirror, so a broken
          registry path would pass this phase and fail in a later one.
        quiet: true

    - name: validate_phase4 | Pull an image by its upstream name through the mirror
      changed_when: false
      register: _reg_validate_pull
      ansible.builtin.command:
        cmd: >-
          {{ inventory_rke2_node_data_dir }}/bin/crictl
          --runtime-endpoint unix:///run/k3s/containerd/containerd.sock
          pull docker.io/rancher/mirrored-pause:3.10.2

    - name: validate_phase4 | Validate the pull succeeded through the mirror
      ansible.builtin.assert:
        that:
          - _reg_validate_pull['rc'] == 0
        fail_msg: >-
          Pulling docker.io/rancher/mirrored-pause:3.10.2 failed. With no route
          upstream, this is the registry mirror, its rewrite rule, the deploy
          token, or the CA trust — check /etc/rancher/rke2/registries.yaml.
        quiet: true

    - name: validate_phase4 | Attempt a direct upstream fetch, which must fail
      changed_when: false
      failed_when: false
      register: _reg_validate_upstream
      ansible.builtin.uri:
        url: https://registry-1.docker.io/v2/
        timeout: 10
        status_code: -1

    - name: validate_phase4 | Validate the node has no route to an upstream registry
      ansible.builtin.assert:
        that:
          - _reg_validate_upstream is failed or _reg_validate_upstream['status'] | int < 0
        fail_msg: >-
          This node reached registry-1.docker.io. An internal node with a route
          to the internet breaks the premise every phase is built on.
        quiet: true

    - name: validate_phase4 | Validate the API virtual address answers
      run_once: true
      ansible.builtin.wait_for:
        host: "{{ inventory_rke2_server_api_address }}"
        port: "{{ inventory_rke2_server_api_port }}"
        timeout: 15

    - name: validate_phase4 | Validate exactly one node holds the virtual address
      changed_when: false
      register: _reg_validate_vip_holder
      ansible.builtin.command:
        cmd: ip -4 -oneline address show

    - name: validate_phase4 | Assert the virtual address is held once across the control plane
      run_once: true
      vars:
        _validate_holders: >-
          {{ ansible_play_hosts
             | map('extract', hostvars, ['_reg_validate_vip_holder', 'stdout'])
             | select('search', inventory_rke2_server_api_address | regex_escape)
             | list }}
      ansible.builtin.assert:
        that:
          - _validate_holders | length == 1
        fail_msg: >-
          {{ _validate_holders | length }} nodes hold
          {{ inventory_rke2_server_api_address }}. More than one means leader election is
          not working and two nodes are answering ARP for the same address;
          none means kube-vip is not running anywhere.
        quiet: true

- name: Validate the controller can reach the cluster
  hosts: controller
  gather_facts: false
  become: false
  tasks:
    - name: validate_phase4 | Validate the API answers through the virtual address by name
      changed_when: false
      ansible.builtin.uri:
        url: >-
          https://{{ hostvars[groups['kubecp'][0]]['inventory_rke2_server_api_name']
          }}:{{ hostvars[groups['kubecp'][0]]['inventory_rke2_server_api_port'] }}/readyz
        validate_certs: false
        status_code: [200, 401, 403]
