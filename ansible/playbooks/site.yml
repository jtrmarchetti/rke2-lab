---

- name: Phase 0 - the automation controller itself
  ansible.builtin.import_playbook: controller_bootstrap.yml

- name: Phase 1 - repository, artifact host, and tunnel gateway
  ansible.builtin.import_playbook: repo01.yml

- name: Phase 2 - identity, DNS, and certificate authority
  ansible.builtin.import_playbook: core01.yml

- name: Phase 3 - GitLab container, package, and image registries
  ansible.builtin.import_playbook: gitlab.yml

- name: Phase 4 - RKE2 control plane
  ansible.builtin.import_playbook: kubecp.yml

- name: Phase 5 - RKE2 workers, and the control plane taint that follows them
  ansible.builtin.import_playbook: kubewk.yml

- name: Phases 5-6a - controller tooling for operating the cluster
  ansible.builtin.import_playbook: controller.yml

- name: Phase 6 - cluster service artifacts, and the node rewrites for them
  ansible.builtin.import_playbook: cluster_services.yml

- name: Phase 6 - the GitOps source, and the cluster attached to it
  ansible.builtin.import_playbook: gitops.yml

- name: Phase 6 - initialise the vault, the object store, and the federation
  ansible.builtin.import_playbook: cluster_init.yml

- name: Phase 6 - seal the vault keys now that the vault exists
  ansible.builtin.import_playbook: gitops.yml
  vars:
    # The first gitops pass already rendered, sealed, and pushed the tree
    # with the unseal-key entry omitted (the vault did not exist yet).
    # This pass seals that one entry into the working clone the first
    # pass left behind and skips the render and the other secrets.
    gitops_source_unseal_keys_only: true
